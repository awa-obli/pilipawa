<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>播放器</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/common.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* 顶部导航:player 的 body 是纵向 flex 容器,width:100% 不能省(否则被 align-items:center 收成内容宽);
           层次划分用公共样式的阴影,这里只把 z-index 提到 100(网页全屏时要压住导航) */
        .nav {
            z-index: 100;
            width: 100%;
        }

        /* 页面整体布局:左侧主列(播放器+信息+评论) + 右侧栏(选集+相关推荐,窄屏下相关推荐会被 JS 搬到主列),模仿 B 站官网排版 */
        .page-layout {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px 60px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 24px;
            align-items: start;
        }
        .main-col {
            min-width: 0;
        }
        .side-col {
            min-width: 0;
        }
        /* 窄屏下选集、相关推荐都被 JS 搬进了主列(见下方 updateRelatedPlacement),
           右侧栏这时是空的,这里让整体折叠成单列,避免右侧还留着一条 320px 的空白列 */
        @media (max-width: 960px) {
            .page-layout {
                grid-template-columns: 1fr;
                /* 窄屏折叠成单列后,两侧留白若沿用桌面端的 24px 会贴着屏幕边缘,这里适当加大左右边距 */
                padding: 20px 64px 60px;
            }
        }
        #videoTitle {
            flex: 1;
            min-width: 0;
            margin: 0;
            font-size: 20px;
            font-weight: 500;
            line-height: 1.4;
            color: var(--text);
            word-break: break-all;
        }
        /* 标题下方的播放量/弹幕数/发布时间,图标跟搜索页卡片上的保持一致(同一套 svg) */
        .video-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 6px 0 0;
            font-size: 13px;
            color: var(--text-3);
        }
        .video-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .video-stats .stat-item svg {
            flex-shrink: 0;
        }
        /* 视频描述区 */
        .desc-box {
            width: 100%;
            margin: 12px 0 12px;
        }
        .desc-text {
            font-size: 12px;
            color: var(--text-2);
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .desc-text.collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .desc-toggle {
            display: inline-block;
            margin-top: 6px;
            padding: 0;
            background: none;
            border: none;
            color: var(--text-3);
            font-size: 13px;
            cursor: pointer;
        }
        .desc-toggle:hover {
            background: none;
            color: var(--pink);
        }
        /* 播放器容器(保留深色,贴合播放场景) */
        #videoPlayer {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: #000000;
            display: block;
            position: relative;
            isolation: isolate;
        }
        /* 非全屏时按 DOM 顺序排在导航栏(.nav,z-index:100)下方;只有网页全屏
            (fullscreenWeb,容器 position:fixed 铺满)时才盖过导航栏和右侧栏,
            由 initPlayer 监听 fullscreenWeb 事件切换 .art-fullscreen-web */
        #videoPlayer.art-fullscreen-web {
            z-index: 200;
        }
        /* JSON 调试按钮/面板 z-index 更高(1000),全屏时会盖在视频上,所以全屏期间隐藏。
           由 initPlayer 的 fullscreenWeb 事件给 body 切换 .is-fullscreen-web */
        body.is-fullscreen-web .debug-toggle-btn,
        body.is-fullscreen-web .debug-panel,
        body.is-fullscreen-web .related-expand-btn {
            display: none;
        }
        /* 清晰度入口在 Artplayer "设置"子菜单里:档位高亮用站点主色,当前档位那行右侧的
           文字加重一点,不展开子菜单也能看清。
           子菜单项由 Artplayer 渲染,它只按 default 标一次初始态,后续高亮由 syncQualitySettingUi() 维护 */
        #videoPlayer .art-setting-panel .art-setting-item[data-name="quality"] .art-setting-item-right-tooltip {
            color: #ffffff;
            opacity: .85;
            font-weight: 600;
        }
        #videoPlayer .art-setting-item.art-current .art-setting-item-left-text,
        #videoPlayer .art-setting-item.art-current .art-setting-item-right-tooltip {
            color: var(--pink);
        }
        /* 播放器下方的互动按钮:点赞/投币/收藏/转发,大图标+数量 */
        .action-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 14px 0;
        }
        .action-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            background: var(--hover);
            color: var(--text-2);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background .15s ease, color .15s ease;
        }
        .action-btn:hover {
            background: var(--hover-strong);
            color: var(--text);
        }
        .action-btn.active {
            background: var(--pink-soft);
            color: var(--pink);
        }
        .action-btn:disabled {
            cursor: default;
            opacity: .55;
        }
        .action-btn svg {
            flex-shrink: 0;
        }
        /* 选择收藏夹弹窗的样式在 common.css(与个人主页的"移动/复制到收藏夹"共用) */
        /* 互动按钮的轻提示 */
        .action-toast {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translateX(-50%) translateY(20px);
            background: var(--toast-bg);
            color: #fff;
            font-size: 14px;
            padding: 10px 18px;
            border-radius: 8px;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
            white-space: nowrap;
        }
        .action-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        /* 作者信息卡:头像(左) + 昵称/简介(中,自动撑满) + 关注按钮(右),
           宽屏默认在右侧栏最上方(视觉上正好是整个播放页的右上角),窄屏时被 JS
           (updateRelatedPlacement)搬到主列"简介"上方,布局(头像在左、信息+按钮在右)不变。 */
        .up-card {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .up-card.hide {
            display: none;
        }
        .up-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--fill);
            border: 1px solid var(--border);
            flex-shrink: 0;
            display: block;
        }
        .up-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .up-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .up-sign {
            font-size: 12px;
            color: var(--text-3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .up-follow-btn {
            flex-shrink: 0;
            padding: 6px 16px;
            font-size: 12.5px;
            font-weight: 600;
            font-family: inherit;
            border: 1px solid var(--pink);
            border-radius: 14px;
            background: var(--pink);
            color: var(--on-brand);
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s ease, color .15s ease, border-color .15s ease;
        }
        .up-follow-btn:hover {
            background: var(--pink-dark);
            border-color: var(--pink-dark);
        }
        /* 已关注状态:改成描边按钮,和点赞/收藏等"已激活"状态的粉色高亮区分开,
           避免"关注中"看起来像还没点过 */
        .up-follow-btn.following {
            background: var(--card);
            color: var(--text-2);
            border-color: var(--border);
        }
        .up-follow-btn.following:hover {
            color: var(--pink-dark);
            border-color: var(--pink-dark);
            background: var(--card);
        }
        .up-follow-btn:disabled {
            cursor: default;
            opacity: .6;
        }
        /* 小标题 */
        .section-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
            letter-spacing: normal;
        }
        /* 选集控制栏样式(现在位于右侧栏最上方) */
        .episode-box {
            display: none;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .episode-box.show {
            display: flex;
        }
        /* 分P列表 */
        .episode-list {
            display: none;
            width: 100%;
            max-height: 240px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card);
            scrollbar-color: var(--border) var(--fill);
        }
        .episode-list.show {
            display: block;
            margin-bottom: 25px;
        }
        .episode-item {
            padding: 10px 16px;
            font-size: 14px;
            color: var(--text-2);
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .episode-item:last-child {
            border-bottom: none;
        }
        .episode-item:hover {
            background: var(--hover);
            color: var(--pink);
        }
        .episode-item.active {
            background: var(--pink);
            color: var(--on-brand);
        }
        /* 这里不设全局 input 规则:页面里真正的 <input> 只有顶部搜索框(由 .search-box input 管样式),
            加了会误伤 Artplayer 弹幕插件注入的 .apd-input */
        /* 按钮(全局兜底样式)
           用 :where() 把优先级压到 0,组件自己的类(.comment-action-btn 之类)才能盖住它;
           否则 button:hover 的粉色背景会串到"点赞/回复"这些小按钮上 */
        :where(button) {
            padding: 12px 30px;
            background-color: var(--pink);
            color: var(--on-brand);
            border: 1px solid var(--pink);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        :where(button):hover {
            background-color: var(--pink-dark);
            border-color: var(--pink-dark);
            color: var(--on-brand);
        }
        /* JSON 调试面板:右下角悬浮按钮 + 抽屉面板,默认收起,不占页面常驻空间 */
        .debug-toggle-btn {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            background: rgba(36, 41, 46, .75);
            color: #ffffff;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
        }
        .debug-toggle-btn:hover {
            /* 必须显式覆盖全局 button:hover 的纯色背景(它优先级更高),否则悬停时会变成不透明纯色 */
            background: rgba(36, 41, 46, .85);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, .3);
        }
        .debug-toggle-icon {
            flex-shrink: 0;
            font-family: 'SF Mono', Consolas, Monaco, monospace;
            font-size: 13px;
            font-weight: 700;
            line-height: 1;
        }
        .debug-panel {
            position: fixed;
            right: 22px;
            bottom: 74px;
            z-index: 1000;
            width: 420px;
            max-width: calc(100vw - 44px);
            max-height: min(70vh, 560px);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 36px var(--shadow);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .debug-panel.open {
            display: flex;
        }
        .debug-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            flex: 0 0 auto;
        }
        .debug-panel-title {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text);
        }
        .debug-panel-close {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--fill);
            border: 1px solid var(--border);
            color: var(--text-3);
            cursor: pointer;
            border-radius: 4px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .debug-panel-close:hover {
            background: var(--pink);
            border-color: var(--pink);
            color: var(--on-brand);
        }
        .json-tabs {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px 0;
            overflow-x: auto;
            overflow-y: hidden;
            flex: 0 0 auto;
        }
        .json-tab {
            flex: 0 0 auto;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            background: var(--fill);
            color: var(--text-3);
            border: 1px solid var(--border);
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: color .15s ease, background .15s ease, border-color .15s ease;
        }
        .json-tab:hover {
            color: var(--pink);
        }
        .json-tab.active {
            background: var(--pink);
            color: var(--on-brand);
            border-color: var(--pink);
        }
        #jsonOutput {
            margin: 10px 14px 14px;
            padding: 12px;
            background: var(--fill);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-2);
            font-family: "SF Mono", Menlo, Consolas, monospace;
            font-size: 12.5px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            flex: 1 1 auto;
            overflow-y: auto;
            scrollbar-color: var(--border) var(--fill);
        }

        /* 评论区(位于播放器下方) */
        .comment-box {
            margin-top: 25px;
            width: 100%;
        }
        .comment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }
        .comment-count {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: normal;
        }
        .comment-sort {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .comment-sort-btn {
            display: inline-block;
            padding: 0;
            background: none;
            border: none;
            color: var(--text-3);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: color .15s ease;
        }
        .comment-sort-btn:hover {
            background: none;
            color: var(--pink);
        }
        .comment-sort-btn.active {
            background: none;
            color: var(--pink);
            border: none;
        }
        .comment-sort-divider {
            color: var(--border);
            font-size: 12px;
        }
        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .comment-item {
            display: flex;
            gap: 12px;
        }
        .comment-avatar {
            flex: 0 0 40px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--fill);
            border: 1px solid var(--border);
        }
        .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .comment-body {
            flex: 1;
            min-width: 0;
        }
        .comment-uname {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-2);
            margin-bottom: 4px;
        }
        /* 置顶评论(UP 主/管理员置顶)昵称后面的小标签 */
        .comment-top-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 0 4px;
            border: 1px solid var(--pink);
            border-radius: 3px;
            font-size: 11px;
            font-weight: 400;
            line-height: 15px;
            color: var(--pink);
        }
        .comment-message {
            font-size: 14px;
            color: var(--text);
            line-height: 1.6;
            word-break: break-all;
            white-space: pre-wrap;
        }
        /* 评论正文里的表情图: 只给高度、宽度自适应,这样 "[2233娘_大笑]" 这种横向表情
           也能保持原比例,不会被压扁。meta.size=2 的会员大表情(带 -big)渲染大一档。 */
        .comment-emoji {
            width: auto;
            height: 20px;
            vertical-align: text-bottom;
            margin: 0 1px;
        }
        .comment-emoji-big { height: 36px; }
        /* 评论附图: 允许换行排列,自适应宽度但压住最大高度,免得一张长截图把评论区撑爆;
           多图时统一切成固定方形并居中裁切,免得长短不一的截图把同一条评论撑得高低不平 */
        .comment-pics {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .comment-pic {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--fill);
            cursor: zoom-in;
        }
        .comment-pics.is-multi .comment-pic {
            width: 110px;
            height: 110px;
            object-fit: cover;
        }
        /* 评论附图点击后的大图浮层:整屏遮罩 + 居中原图,点空白处、关闭按钮或 Esc 关闭。
           常驻页面、靠 opacity+visibility 显隐(而不是 display),淡入淡出才有过渡。
           touch-action:none 是触摸端能拖能捏的前提:滑动/捏合全交给下面的 pointer 事件,
           否则浏览器会抢去做页面滚动(拖图片时滚播放页、放大也拖不动) */
        .comment-img-mask {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity .2s ease, visibility .2s;
            background: rgba(24, 25, 28, .75);
            touch-action: none;
        }
        .comment-img-mask.show { opacity: 1; visibility: visible; }
        /* 图片视口:一直铺满整屏,放大后图片能整个溢出屏幕,超出部分裁掉、不出滚动条(同官网)。
           拖拽发生在这层,浮层上的按钮不会跟着动 */
        .comment-img-viewport {
            flex: 1;
            align-self: stretch;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .comment-img-viewport img {
            max-width: calc(100% - 80px);
            max-height: calc(100% - 80px);
            object-fit: contain;
            border-radius: 4px;
            cursor: zoom-in;
            /* 放大/恢复的动画:位移和缩放写在同一个 transform 里,过渡时才能一起补间 */
            transition: transform .25s ease;
        }
        /* 拖拽、滚轮、换图、复位都要瞬时生效,这一下不能带过渡(见 applyCommentImageTransform) */
        .comment-img-viewport img.is-instant { transition: none; }
        /* 本来就不用放大的小图:光标提示"点了就退出预览",点击也确实只关闭(见 toggleCommentImageZoom) */
        .comment-img-viewport img.is-small { cursor: zoom-out; }
        .comment-img-mask.is-zoomed .comment-img-viewport img { cursor: grab; }
        .comment-img-mask.is-zoomed .comment-img-viewport img:active { cursor: grabbing; }
        /* 浮层上的圆形按钮(左右切换、右上角关闭):深色底 + 白色图标,同一种观感 */
        .comment-img-btn {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, .6);
            color: #fff;
            cursor: pointer;
        }
        .comment-img-btn:hover { background: rgba(0, 0, 0, .75); }
        /* 左右箭头只在这条评论有多张图时出现(浮层加 is-multi),关闭按钮一直在 */
        .comment-img-prev,
        .comment-img-next {
            top: 50%;
            display: none;
            margin-top: -22px;
        }
        .comment-img-prev { left: 24px; }
        .comment-img-next { right: 24px; }
        .comment-img-close { top: 20px; right: 24px; }
        .comment-img-mask.is-multi .comment-img-prev,
        .comment-img-mask.is-multi .comment-img-next { display: flex; }
        .comment-img-count {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            padding: 3px 10px;
            border-radius: 11px;
            background: rgba(0, 0, 0, .5);
            color: #fff;
            font-size: 12px;
        }
        .comment-img-mask.is-multi .comment-img-count { display: block; }
        /* 手机屏窄,适应窗口那 40px 留白把图挤得太小,收窄一档 */
        @media (max-width: 600px) {
            .comment-img-viewport img {
                max-width: calc(100% - 24px);
                max-height: calc(100% - 24px);
            }
        }
        .comment-meta {
            margin-top: 6px;
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-3);
        }
        /* ----------------------------- 评论输入框 -----------------------------
           常驻评论列表最上面:头像 + 输入区,输入区右下角是"发布"按钮;
           点某条评论的"回复"时,输入框里会多出一个"正在回复 @xxx"的小标签 */
        .comment-editor {
            display: flex;
            gap: 12px;
            margin-bottom: 22px;
        }
        .comment-editor-avatar {
            flex: 0 0 40px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--fill);
            border: 1px solid var(--border);
        }
        .comment-editor-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .comment-editor-main {
            position: relative; /* 表情面板相对它定位(浮在输入框下方) */
            flex: 1;
            min-width: 0;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card);
            transition: border-color .15s ease;
        }
        .comment-editor-main:focus-within { border-color: var(--pink); }
        /* 输入框用 contenteditable 的 div 而不是 textarea:表情要以图片形式出现在框里,
           textarea 只能放纯文本(框里的表情图复用评论正文的 .comment-emoji)。
           高度随内容自然增长,到 max-height 后自己滚 */
        .comment-editor-input {
            display: block;
            width: 100%;
            min-height: 46px;
            max-height: 140px;
            padding: 10px 12px;
            border: none;
            outline: none;
            overflow-y: auto;
            background: none;
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            font-family: inherit;
            white-space: pre-wrap;
            word-break: break-all;
        }
        /* 内容为空时显示占位提示(没有内容时 :empty 成立;只有一个空 <br> 的情况由 JS 清掉) */
        .comment-editor-input:empty::before {
            content: attr(data-placeholder);
            color: var(--text-3);
            pointer-events: none;
        }
        .comment-editor-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 34px;
            padding: 4px 10px 6px;
            border-top: 1px solid var(--border);
        }
        /* 窄屏下底栏图标按钮不换行、整栏横向滚动 */
        .comment-editor-tools {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .comment-editor-tools::-webkit-scrollbar { display: none; }
        .comment-reply-chip {
            display: none;
            align-items: center;
            gap: 6px;
            min-width: 0;
            font-size: 12px;
            color: var(--text-3);
        }
        .comment-reply-chip.show { display: flex; }
        .comment-reply-chip b {
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
            color: var(--text-2);
        }
        .comment-reply-chip button {
            padding: 0 2px;
            border: none;
            background: none;
            color: var(--text-3);
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
        }
        .comment-reply-chip button:hover { color: var(--pink); }
        .comment-send-btn {
            margin-left: auto;
            padding: 6px 18px;
            border: none;
            border-radius: 15px;
            background: var(--pink);
            color: var(--on-brand);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: background .15s ease;
        }
        .comment-send-btn:hover:not(:disabled) { background: var(--pink-dark); }
        .comment-send-btn:disabled { cursor: default; opacity: .6; }
        /* 表情/图片面板:浮在输入框下方(相对 .comment-editor-main 定位)。
           同一个面板承担"表情"(默认)和"@ 提及候选"两种内容,由 data-mode 区分,不开第二个浮层 */
        .comment-emoji-btn,
        .comment-pic-btn {
            display: flex;
            align-items: center;
            padding: 2px;
            border: none;
            background: none;
            color: var(--text-3);
            cursor: pointer;
            transition: color .15s ease;
        }
        .comment-emoji-btn svg,
        .comment-pic-btn svg { display: block; }
        /* 显式写 background: none,免得被全局 :where(button):hover 串上粉色背景 */
        .comment-emoji-btn:hover,
        .comment-pic-btn:hover { color: var(--pink); background: none; }
        /* @ 按钮是文字而不是图标:字号、字体跟随页面,行高压到 1 才能和旁边的图标在底栏同一基线居中 */
        .comment-emoji-btn.is-text {
            font-family: inherit;
            font-size: 17px;
            line-height: 1;
        }
        .comment-emoji-panel {
            display: none;
            position: absolute;
            left: 0;
            top: calc(100% + 6px);
            z-index: 30;
            width: 360px;
            max-width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 4px 16px var(--shadow);
            overflow: hidden;
        }
        .comment-emoji-panel.show { display: block; }
        /* @ 候选是一条条的用户,不需要表情面板那么宽 */
        .comment-emoji-panel[data-mode="at"] { width: 260px; }
        .comment-emoji-tabs {
            display: flex;
            gap: 4px;
            padding: 8px 8px 0;
            overflow-x: auto;
        }
        .comment-emoji-tab {
            flex: 0 0 auto;
            width: 28px;
            height: 28px;
            padding: 2px;
            border: none;
            border-radius: 6px;
            background: none;
            cursor: pointer;
            opacity: .55;
        }
        .comment-emoji-tab img { display: block; width: 100%; height: 100%; object-fit: contain; }
        .comment-emoji-tab:hover { background: var(--hover); opacity: 1; }
        .comment-emoji-tab.active { background: var(--fill); opacity: 1; }
        /* 一行放几个由后端的包尺寸决定:小表情 10 个,大表情 5 个,颜文字(纯文本格子)4 个 */
        .comment-emoji-grid {
            display: grid;
            gap: 2px;
            max-height: 220px;
            padding: 8px;
            overflow-y: auto;
        }
        .comment-emoji-grid.is-small { grid-template-columns: repeat(10, 1fr); }
        .comment-emoji-grid.is-big { grid-template-columns: repeat(5, 1fr); }
        .comment-emoji-grid.is-text { grid-template-columns: repeat(4, 1fr); }
        .comment-emoji-item {
            padding: 3px;
            border: none;
            border-radius: 6px;
            background: none;
            cursor: pointer;
        }
        .comment-emoji-item img { display: block; width: 100%; height: 28px; object-fit: contain; }
        .comment-emoji-grid.is-big .comment-emoji-item img { height: 56px; }
        /* 颜文字格子: 一段字符,放不下就省略,完整内容看 title */
        .comment-emoji-item.is-text {
            padding: 6px 4px;
            font-size: 12px;
            line-height: 1.2;
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .comment-emoji-item:hover { background: var(--hover); }
        .comment-emoji-empty {
            margin: 0;
            padding: 18px 0;
            text-align: center;
            font-size: 13px;
            color: var(--text-3);
        }
        /* @ 提及候选列表(与表情网格共用同一个面板) */
        .comment-at-group {
            padding: 6px 8px 2px;
            font-size: 11px;
            color: var(--text-3);
        }
        .comment-at-list {
            max-height: 240px;
            padding: 4px;
            overflow-y: auto;
        }
        .comment-at-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 4px 8px;
            border: none;
            border-radius: 6px;
            background: none;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
        }
        .comment-at-item:hover,
        .comment-at-item.active { background: var(--fill); }
        .comment-at-avatar {
            flex: 0 0 28px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--fill);
        }
        .comment-at-avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
        /* 昵称与标签分两行: 昵称独占整行宽,长昵称点省略号而不是被标签挤掉 */
        .comment-at-info {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .comment-at-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            color: var(--text);
        }
        .comment-at-meta {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        /* 关注的人 / 认证用户各加一个小标记,和 .comment-top-badge 一个做法 */
        .comment-at-tag {
            flex: 0 0 auto;
            padding: 0 4px;
            border: 1px solid var(--pink);
            border-radius: 3px;
            font-size: 10px;
            line-height: 14px;
            color: var(--pink);
        }
        .comment-at-fans {
            flex: 0 0 auto;
            font-size: 11px;
            color: var(--text-3);
        }
        /* 正文里 @ 到的人:高亮 + 跳转该用户主页(mid 缺失时只高亮) */
        .comment-at-text { color: var(--blue); }
        /* ----------------------------- 评论附图(发评论侧) -----------------------------
           上传成功的图片排在这里,发送时随评论一起提交;上传中的那张盖一层"上传中…"。
           容器夹在输入框和底栏之间,底部 10px 是它与底栏的留白(:empty 时整个容器不显示) */
        .comment-editor-pics {
            display: flex;
            gap: 8px;
            padding: 8px 12px 10px;
            overflow-x: auto;
        }
        .comment-editor-pics:empty { display: none; }
        .comment-editor-pic {
            position: relative;
            flex: 0 0 auto;
            width: 72px;
            height: 72px;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            background: var(--fill);
        }
        .comment-editor-pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .comment-editor-pic.is-loading img { opacity: .5; }
        .comment-editor-pic-tip {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #fff;
            background: rgba(24, 25, 28, .5);
        }
        .comment-editor-pic.is-loading .comment-editor-pic-tip { display: flex; }
        .comment-editor-pic-del {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(24, 25, 28, .6);
            color: #fff;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
        }
        .comment-editor-pic-del:hover { background: var(--pink); }
        /* 评论/回复上的"点赞""回复"小按钮(纯图标 + 文字,悬停变粉) */
        .comment-action-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0;
            border: none;
            background: none;
            color: var(--text-3);
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: color .15s ease;
        }
        .comment-action-btn svg { display: block; flex-shrink: 0; }
        /* 悬停只变粉,不带背景(显式写 background: none,免得又被全局 button:hover 串到) */
        .comment-action-btn:hover { color: var(--pink); background: none; }
        .comment-action-btn.active { color: var(--pink); }
        .comment-action-btn:disabled { cursor: default; opacity: .6; }
        .comment-empty, .comment-error {
            color: var(--text-3);
            font-size: 13px;
            padding: 6px 0;
        }
        /* 评论骨架屏,复用下面 related 骨架屏的 relatedShimmer 动画 */
        .comment-skeleton .comment-avatar {
            background: linear-gradient(90deg, var(--skeleton-1), var(--skeleton-2), var(--skeleton-1));
            background-size: 200% 100%;
            animation: relatedShimmer 1.2s infinite;
        }
        .comment-skeleton .comment-uname,
        .comment-skeleton .comment-message {
            border-radius: 4px;
            background: linear-gradient(90deg, var(--skeleton-1), var(--skeleton-2), var(--skeleton-1));
            background-size: 200% 100%;
            animation: relatedShimmer 1.2s infinite;
        }
        .comment-skeleton .comment-uname {
            width: 80px;
            height: 12px;
        }
        .comment-skeleton .comment-message {
            width: 90%;
            height: 12px;
            margin-top: 8px;
        }
        /* 评论区滚动到底部自动加载:一个不可见的哨兵元素判断是否滚到底,加一小段加载提示文字 */
        .comment-sentinel {
            height: 1px;
        }
        .comment-loading-more {
            margin-top: 16px;
            text-align: center;
            font-size: 12.5px;
            color: var(--text-3);
        }
        .comment-end-tip {
            margin-top: 16px;
            text-align: center;
            font-size: 12.5px;
            color: var(--text-3);
        }
        /* 未登录时评论区只能看到前几条,底部提示"登录后查看更多评论",
           跟评论元信息一个色调的文字链接,悬浮才变粉色。
           点击/手型光标/悬浮变色只挂在内层包住文字的 span 上:外层是撑满整行的块级元素
           (JS 用 display:block 控制显隐),挂在外层会让整行空白都能点开登录弹窗。 */
        .comment-login-tip {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            color: var(--text-3);
        }
        .comment-login-tip > span {
            display: inline-block;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: color .15s ease;
        }
        .comment-login-tip > span:hover {
            color: var(--pink);
        }

        /* 楼层回复(子评论):默认收起,点击"展开"按钮后才请求加载 */
        .comment-reply-toggle {
            margin-top: 8px;
            padding: 0;
            font-size: 12.5px;
            font-weight: 500;
            font-family: inherit;
            background: none;
            color: var(--text-3);
            border: none;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .comment-reply-toggle:hover {
            background: none;
            color: var(--pink);
        }
        .comment-sub-replies {
            margin-top: 10px;
            padding-left: 14px;
            border-left: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sub-reply-item {
            display: flex;
            gap: 8px;
        }
        .sub-reply-avatar {
            flex: 0 0 26px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--fill);
            border: 1px solid var(--border);
        }
        .sub-reply-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .sub-reply-body {
            flex: 1;
            min-width: 0;
        }
        .sub-reply-uname {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-2);
            margin-bottom: 3px;
        }
        .sub-reply-message {
            font-size: 13px;
            color: var(--text);
            line-height: 1.55;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .sub-reply-meta {
            margin-top: 4px;
            display: flex;
            gap: 14px;
            font-size: 11px;
            color: var(--text-3);
        }
        .sub-reply-skeleton .sub-reply-avatar {
            background: linear-gradient(90deg, var(--skeleton-1), var(--skeleton-2), var(--skeleton-1));
            background-size: 200% 100%;
            animation: relatedShimmer 1.2s infinite;
        }
        .sub-reply-skeleton .sub-reply-uname,
        .sub-reply-skeleton .sub-reply-message {
            border-radius: 4px;
            background: linear-gradient(90deg, var(--skeleton-1), var(--skeleton-2), var(--skeleton-1));
            background-size: 200% 100%;
            animation: relatedShimmer 1.2s infinite;
        }
        .sub-reply-skeleton .sub-reply-uname {
            width: 60px;
            height: 10px;
        }
        .sub-reply-skeleton .sub-reply-message {
            width: 85%;
            height: 10px;
            margin-top: 6px;
        }
        .sub-reply-more-btn {
            align-self: flex-start;
            padding: 3px 10px;
            font-size: 12px;
            font-family: inherit;
            background: none;
            color: var(--text-3);
            border: none;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .sub-reply-more-btn:hover {
            background: none;
            color: var(--pink);
        }

        /* 标题行 */
        .title-row {
            width: 100%;
            margin: 0 0 6px;
        }

        /* 强制覆盖 ArtPlayer 的部分高亮逻辑,贴合粉白主题 */
        .art-video-player .art-control-playtime {
            color: #ffffff !important;
        }

        /* 弹幕插件设置面板配色 */
        .art-video-player .artplayer-plugin-danmuku {
            font-family: inherit;
        }

        /* 原生 video 控件配色微调 */
        video::-webkit-media-controls-panel {
            background-color: rgba(0, 0, 0, 0.6);
        }
        /* 相关推荐:宽屏在右侧栏,纵向列表,每项是"左缩略图+右文字"的横向条目;
           窄屏下由 JS(relatedNarrowQuery)搬到简介下方、评论区上方,并给 relatedScroll
           加上 .related-scroll--narrow,改成横向可滚动的卡片列表。两种模式共用同一套
           .related-card 类名,宽窄样式都写在这里,不用维护两份标签。
           "展开全部"按钮宽屏时在列表下方,窄屏时被 JS 搬到横向列表最右侧当最后一张卡片 */
        .related-list {
            display: none;
            width: 100%;
        }
        .related-list.show {
            display: block;
        }
        .related-scroll {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .related-scroll.related-scroll--narrow {
            flex-direction: row;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .related-card {
            display: flex;
            flex-direction: row;
            gap: 8px;
        }
        .related-scroll--narrow .related-card {
            flex: 0 0 160px;
            width: 160px;
            flex-direction: column;
            gap: 0;
        }
        .related-thumb {
            display: block;
            position: relative;
            flex: 0 0 140px;
            width: 140px;
            aspect-ratio: 16 / 9;
            border-radius: 6px;
            overflow: hidden;
            background: var(--thumb-bg);
            border: 1px solid var(--border);
            text-decoration: none;
        }
        .related-scroll--narrow .related-thumb {
            flex-basis: auto;
            width: 100%;
        }
        .related-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .related-duration {
            position: absolute;
            right: 5px;
            bottom: 5px;
            background: rgba(0, 0, 0, .65);
            color: #ffffff;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 3px;
        }
        .related-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .related-scroll--narrow .related-info {
            margin-top: 8px;
        }
        .related-title {
            margin: 0 0 4px;
            font-size: 13px;
            line-height: 1.4;
            height: 2.8em;
            color: var(--text);
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        /* 标题文字外面包一层行内 <a>:块级 .related-title 只管两行截断与占位,
           文字本身才是视频入口(右键新标签页、中键、键盘聚焦交给浏览器) */
        .related-title-text {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: color .15s ease;
        }
        /* 悬停时卡片不上移,也不整卡变色:只有光标落在标题文字本身时标题才变粉 */
        .related-title-text:hover {
            color: var(--pink);
        }
        /* UP 名 + 播放数这一行必须是"同一排"的:
           容器用 flex,UP 那部分可收缩(名字长了出省略号),播放数不收缩。
           注意不能用块级容器包 <a>(作者链接是 display:flex,块级盒子会把后面的
           播放数顶到第二排去,窄屏 160px 的卡片上尤其明显)。 */
        .related-meta {
            margin-top: auto;
            display: flex;
            align-items: center;
            min-width: 0;
            font-size: 11px;
            color: var(--text-3);
            white-space: nowrap;
            overflow: hidden;
        }
        /* 播放数: 不参与收缩,保证始终和 UP 名同排 */
        .related-meta-play {
            flex: 0 0 auto;
            margin-left: 4px;
        }
        /* UP 这一行(UP 角标 + 用户名 + 播放数)整体就是一个链接,指向 TA 的个人主页。
           角标和文字都在 <a> 里,悬停任意一处三者一起变粉;点击进空间,不触发换视频。 */
        .related-meta-author {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
            color: var(--text-3);
            text-decoration: none;
            cursor: pointer;
            transition: color .12s ease;
        }
        .related-meta-author svg {
            flex-shrink: 0;
            color: var(--text-3);
            transition: color .12s ease;
        }
        .related-meta-author:hover,
        .related-meta-author:hover svg,
        .related-meta-author:hover .related-meta-name {
            color: var(--pink);
        }
        .related-meta-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            /* 没有 mid 时这里是 flex 的直接子项,不加 min-width 就压不下去,名字长了会
               把播放数挤出卡片 */
            min-width: 0;
            /* 悬停变粉是直接写在这个 span 上的(.related-meta-author:hover .related-meta-name),
               自己带一条 transition 才能和角标一起渐变,而不是文字硬跳色 */
            transition: color .12s ease;
        }
        .related-skeleton .related-thumb {
            background: linear-gradient(90deg, var(--skeleton-1), var(--skeleton-2), var(--skeleton-1));
            background-size: 200% 100%;
            animation: relatedShimmer 1.2s infinite;
        }
        @keyframes relatedShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .related-empty, .related-error {
            color: var(--text-3);
            font-size: 13px;
            padding: 6px 0;
        }
        /* 相关推荐默认只展示前 20 条,超出部分才出现"展开全部"按钮。
           宽屏:按钮在相关推荐列表下方,横排圆角矩形。
           窄屏:按钮被 JS(updateRelatedPlacement)搬进 relatedScroll,当作横向列表最后一张卡片,
           滚动条拉到最右侧才会看到(具体样式见下面 .related-scroll--narrow 那组选择器) */
        .related-expand-btn {
            display: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            background: var(--card);
            color: var(--text-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: color .15s ease, background .15s ease, border-color .15s ease;
        }
        .related-expand-btn.show {
            display: block;
            width: 100%;
            margin: 8px 0 0;
        }
        .related-expand-btn:hover {
            background: var(--pink);
            color: var(--on-brand);
            border-color: var(--pink);
        }
        /* 窄屏专属:按钮此时的父节点是横向滚动的 relatedScroll,作为最后一张"卡片"展示 —
           不设高度,靠 flex 默认的 align-items: stretch 自动跟其它卡片一样高 */
        .related-scroll--narrow .related-expand-btn.show {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 44px;
            width: 44px;
            align-self: stretch;
            margin: 0;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 2px;
            padding: 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/artplayer/5.1.7/artplayer.js"></script>
    <script src="https://unpkg.com/artplayer-plugin-danmuku@5/dist/artplayer-plugin-danmuku.js"></script>
</head>
<body>

    <div class="nav">
        <div class="nav-inner">
            <a class="logo" href="/" title="回到首页">
                <img class="logo-img" src="/pilipawa-logo.png" alt="pilipawa" />
            </a>
            <div class="search-wrap">
                <form class="search-box" id="searchForm">
                    <input id="keyword" type="text" placeholder="搜索你感兴趣的视频" autocomplete="off" />
                    <button class="icon-btn" type="submit">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/>
                            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </form>
                <div class="history-dropdown" id="historyDropdown"></div>
            </div>
            <div class="nav-actions">
                <div class="login-slot" id="loginSlot">
                    <button class="login-btn" type="button" onclick="openLoginModal()">登录</button>
                </div>
                <a class="icon-btn" href="/settings" title="设置" aria-label="设置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <!-- 互动按钮的轻提示 -->
    <div class="action-toast" id="actionToast"></div>

    <!-- 评论附图的大图浮层:点评论里的附图打开,点空白处、关闭按钮或按 Esc 关闭 -->
    <div class="comment-img-mask" id="commentImgMask" onclick="closeCommentImage()">
        <div class="comment-img-viewport">
            <img id="commentImgFull" src="" alt="" referrerpolicy="no-referrer" draggable="false"
                 onclick="event.stopPropagation(); toggleCommentImageZoom(event)" />
        </div>
        <!-- 左右箭头只在这条评论有多张图时显示(见 showCommentImage)。
             浮层上的按钮都要 stopPropagation,否则冒泡到浮层上就顺手把预览关了 -->
        <button class="comment-img-btn comment-img-prev" type="button" title="上一张"
                onclick="event.stopPropagation(); stepCommentImage(-1)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L8 12l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button class="comment-img-btn comment-img-next" type="button" title="下一张"
                onclick="event.stopPropagation(); stepCommentImage(1)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button class="comment-img-btn comment-img-close" type="button" title="关闭"
                onclick="event.stopPropagation(); closeCommentImage()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <div class="comment-img-count" id="commentImgCount"></div>
    </div>

    <!-- 扫码登录弹窗(登录 B 站账号,不是本站账号体系) -->
    <div class="login-modal-mask" id="loginModalMask" style="display:none;">
        <div class="login-modal">
            <button class="login-modal-close" type="button" onclick="closeLoginModal()">&times;</button>
            <p class="login-modal-title">扫码登录 B 站账号</p>
            <div class="login-qrcode-box">
                <img id="loginQrcodeImg" width="180" height="180" alt="登录二维码" />
                <div class="login-qrcode-mask" id="loginQrcodeMask">
                    <p id="loginQrcodeMaskText"></p>
                    <button class="login-refresh-btn" id="loginRefreshBtn" type="button" onclick="startLoginFlow()">刷新二维码</button>
                </div>
            </div>
            <p class="login-modal-tip">请使用哔哩哔哩客户端扫码登录</p>
        </div>
    </div>

    <!-- 选择收藏夹弹窗:点"收藏"按钮打开,夹子列表和勾选状态由 loadFavFolders/updateFavFolderUI 填充 -->
    <div class="fav-folder-mask" id="favFolderMask">
        <div class="fav-folder-modal">
            <p class="fav-folder-title">选择收藏夹</p>
            <div class="fav-folder-list" id="favFolderList"></div>
            <div class="fav-folder-foot">
                <button class="fav-folder-btn cancel" id="favFolderCancel" type="button">取消</button>
                <button class="fav-folder-btn confirm" id="favFolderConfirm" type="button" disabled>确定</button>
            </div>
        </div>
    </div>

    <!-- 左侧主列(播放器+信息+评论) + 右侧栏(选集+相关推荐,窄屏下相关推荐会被 JS 搬到主列) -->
    <div class="page-layout" id="pageLayout">
        <div class="main-col">
            <div class="title-row">
                <p id="videoTitle"></p>
                <div class="video-stats" id="videoStats" style="display:none;">
                    <span class="stat-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="2" y="4" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.6"/>
                            <path d="M4 4.5C4 3.6 4.99 3.05 5.75 3.52L19.5 12L5.75 20.48C4.99 20.95 4 20.4 4 19.5V4.5Z" fill="currentColor" transform="translate(6.6,6) scale(0.5)"/>
                        </svg>
                        <span id="statPlay"></span>
                    </span>
                    <span class="stat-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="2" y="4" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.6"/>
                            <line x1="6" y1="9.5" x2="15" y2="9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                            <line x1="6" y1="14.5" x2="18" y2="14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                        <span id="statDanmaku"></span>
                    </span>
                    <span id="statPubdate"></span>
                </div>
            </div>

            <!-- ArtPlayer 播放器容器 -->
            <div id="videoPlayer"></div>

            <!-- 互动按钮:点赞/投币/收藏/转发,提交后由轻提示反馈结果 -->
            <div class="action-bar">
                <button class="action-btn" id="actionLike" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                        <path d="M7 11l3.6-7.2a1.8 1.8 0 0 1 3.4.8V9h5.2a2 2 0 0 1 1.94 2.48l-1.5 6.2A2 2 0 0 1 17.7 19H7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    </svg>
                    <span id="statLike">-</span>
                </button>
                <button class="action-btn" id="actionCoin" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" fill="none"/>
                        <text x="12" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor" font-family="SimHei, 'Heiti SC', 'Microsoft YaHei', sans-serif">币</text>
                    </svg>
                    <span id="statCoin">-</span>
                </button>
                <button class="action-btn" id="actionFavorite" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 4.5l2.2 4.7 5.1.6-3.8 3.5.9 5.1L12 16l-4.4 2.4.9-5.1-3.8-3.5 5.1-.6L12 4.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    </svg>
                    <span id="statFavorite">-</span>
                </button>
                <button class="action-btn" id="actionShare" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="18" cy="5.5" r="2.3" stroke="currentColor" stroke-width="1.6"/>
                        <circle cx="6" cy="12" r="2.3" stroke="currentColor" stroke-width="1.6"/>
                        <circle cx="18" cy="18.5" r="2.3" stroke="currentColor" stroke-width="1.6"/>
                        <path d="M8 10.8l8-4.4M8 13.2l8 4.4" stroke="currentColor" stroke-width="1.6"/>
                    </svg>
                    <span id="statShare">-</span>
                </button>
            </div>

            <!-- 视频描述(默认折叠,可展开/收起) -->
            <div class="desc-box" id="descBox" style="display:none;">
                <div class="desc-text collapsed" id="descText"></div>
                <button class="desc-toggle" id="descToggle" onclick="toggleDesc()">展开</button>
            </div>

            <!-- 相关推荐默认(宽屏)在右侧栏,窄屏下由 JS 搬到简介和评论区之间 -->

            <!-- 评论区:可发评论/回复,可给评论点赞 -->
            <div class="comment-box">
                <div class="comment-header">
                    <div class="comment-count" id="commentCount">评论</div>
                    <div class="comment-sort" id="commentSort">
                        <button class="comment-sort-btn active" data-sort="2">最热</button>
                        <span class="comment-sort-divider">|</span>
                        <button class="comment-sort-btn" data-sort="0">最新</button>
                    </div>
                </div>
                <!-- 评论输入框:未登录时点它会直接弹扫码登录 -->
                <div class="comment-editor" id="commentEditor">
                    <div class="comment-editor-avatar">
                        <img id="commentEditorAvatar" src="" alt="" referrerpolicy="no-referrer" onerror="this.style.opacity=0" />
                    </div>
                    <div class="comment-editor-main">
                        <!-- 输入框用 contenteditable 的 div(不是 textarea):表情在框里直接
                             显示成图,提交时由 readCommentInput 还原成 "[表情名]" -->
                        <div class="comment-editor-input" id="commentInput" contenteditable="true"
                             data-placeholder="发一条友善的评论"></div>
                        <!-- 已选评论附图:上传成功的排在这里,发送时随评论一起提交 -->
                        <div class="comment-editor-pics" id="commentEditorPics"></div>
                        <div class="comment-editor-footer">
                            <div class="comment-editor-tools">
                                <button class="comment-emoji-btn" id="commentEmojiBtn" type="button" title="表情">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
                                        <circle cx="9" cy="10" r="1.2" fill="currentColor"/>
                                        <circle cx="15" cy="10" r="1.2" fill="currentColor"/>
                                        <path d="M8.2 14.2a4.4 4.4 0 0 0 7.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                                    </svg>
                                </button>
                                <!-- @ 按钮:点开候选列表,也可以在输入框里直接打 "@" 触发(见 updateMentionPanel) -->
                                <button class="comment-emoji-btn is-text" id="commentAtBtn" type="button" title="@ 某人">@</button>
                                <button class="comment-pic-btn" id="commentPicBtn" type="button" title="上传图片">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/>
                                        <circle cx="8.5" cy="9.5" r="1.5" stroke="currentColor" stroke-width="1.4"/>
                                        <path d="M4 16.5l4.5-4.5 3.5 3.5 3-3 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </button>
                            </div>
                            <span class="comment-reply-chip" id="commentReplyChip">
                                正在回复 <b id="commentReplyName"></b>
                                <button type="button" id="commentReplyCancel" title="取消回复">&times;</button>
                            </span>
                            <button class="comment-send-btn" id="commentSendBtn" type="button">发布</button>
                        </div>
                        <!-- 表情 / @ 候选面板:两种内容共用这一个浮层,由 data-mode 区分 -->
                        <div class="comment-emoji-panel" id="commentEmojiPanel"></div>
                        <input type="file" id="commentPicInput" accept="image/png,image/jpeg,image/gif" multiple hidden />
                    </div>
                </div>
                <div class="comment-list" id="commentList"></div>
                <div class="comment-loading-more" id="commentLoadingMore" style="display:none;">加载中...</div>
                <div class="comment-end-tip" id="commentEndTip" style="display:none;">没有更多评论了</div>
                <!-- 未登录时评论区只能看到前几条,点这条提示打开登录二维码弹窗。
                     点击只绑在内层包住文字的 span 上,否则外层整行空白都能点开弹窗 -->
                <div class="comment-login-tip" id="commentLoginTip" style="display:none;"><span onclick="openLoginModal()">登录后查看更多评论</span></div>
                <!-- 不可见哨兵元素:滚到视口时自动加载下一页评论 -->
                <div class="comment-sentinel" id="commentSentinel"></div>
            </div>

        </div>

        <!-- 右侧栏:选集(仅多P视频显示) + 相关推荐(宽屏默认在这里,窄屏会被 JS 搬到主列) -->
        <div class="side-col">
            <!-- 作者信息卡:头像 + 昵称/简介 + 关注按钮,宽屏在右侧栏最上方,窄屏被 JS 搬到主列简介上方 -->
            <div class="up-card hide" id="upCard">
                <img class="up-avatar" id="upAvatar" src="" referrerpolicy="no-referrer" alt=""
                    onerror="this.style.visibility='hidden'" style="cursor:pointer;" />
                <div class="up-info">
                    <!-- 名称整行是块级元素,点击和手型光标都放在内层只包住名字的 span 上:
                         否则名字右侧的空白区域也吃点击、也能点进主页(和下方评论区同一套做法)。 -->
                    <div class="up-name"><span id="upName" style="cursor:pointer;"></span></div>
                    <div class="up-sign" id="upSign"></div>
                </div>
                <button class="up-follow-btn" id="upFollowBtn" type="button" style="display:none;">+ 关注</button>
            </div>

            <!-- 选集(仅多P视频显示) -->
            <div class="episode-box" id="episodeBox">
                <div class="section-title">选集</div>
            </div>

            <!-- 分P列表(仅多P视频显示，可垂直滚动，点击直接播放对应分P) -->
            <div class="episode-list" id="episodeList"></div>

            <!-- 相关推荐(解析成功后自动加载;宽屏在这里纵向展示,窄屏会被 JS 搬到主列简介下方,横向展示) -->
            <div class="related-list" id="relatedBox">
                <div class="section-title">相关推荐</div>
                <div class="related-scroll" id="relatedScroll"></div>
                <!-- 展开全部按钮:宽屏在列表下方(横排圆角按钮);窄屏由 JS(placeRelatedExpandBtn)
                     搬进上面的 relatedScroll,当作横向列表最后一张竖排文字卡片 -->
                <button class="related-expand-btn" id="relatedExpandBtn" onclick="expandRelated()">展开全部</button>
            </div>
        </div>
    </div>

    <!-- JSON 调试面板:右下角悬浮按钮,点击展开/收起,不占页面常驻空间 -->
    <button class="debug-toggle-btn" id="debugToggleBtn" type="button" onclick="toggleDebugPanel()">
        <span class="debug-toggle-icon">&lt;/&gt;</span>
        <span>JSON</span>
    </button>
    <div class="debug-panel" id="debugPanel">
        <div class="debug-panel-header">
            <span class="debug-panel-title">JSON 响应</span>
            <button class="debug-panel-close" type="button" onclick="toggleDebugPanel(false)">&times;</button>
        </div>
        <div class="json-tabs" id="jsonTabs">
            <button class="json-tab active" data-type="play">/api/play</button>
            <button class="json-tab" data-type="info">/api/info</button>
            <button class="json-tab" data-type="danmaku">/api/danmaku</button>
            <button class="json-tab" data-type="related">/api/related</button>
            <button class="json-tab" data-type="reply">/api/reply</button>
        </div>
        <pre id="jsonOutput">等待解析...</pre>
    </div>

    <script src="/common.js"></script>
<script>
        /* ----------------------------- 顶部导航搜索框 -----------------------------
         * 本页不展示搜索结果,提交后统一跳转到 /search 搜索结果页。
         * -------------------------------------------------------------------- */
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('keyword');

                // 本页不展示搜索结果,提交后跳转到 /search
        function goSearch(keyword) {
            window.location.href = `/search?keyword=${encodeURIComponent(keyword)}`;
        }

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const keyword = searchInput.value.trim();
            if (!keyword) return;
            addHistory(keyword);
            hideHistoryDropdown();
            goSearch(keyword);
        });

        let currentPage = 1; // 当前分P
        let currentVideoId = ''; // 当前视频的 bv/av 号,来自 URL 参数
        let pendingSeekSeconds = 0; // 继续观看:URL 上的 t 参数(秒),元数据加载完后 seek 一次
        // 站内切视频(选集/相关推荐)不整页刷新,同一页面可能连续快速点好几次。
        // 每次 startPlay() 都 ++playSeq 取新序号,异步请求回来后先比对,对不上就丢弃结果,
        // 避免旧请求覆盖新视频的标题/播放地址/相关推荐等内容
        let playSeq = 0;

        // 评论区的数字 av 号,由 /api/info 的 aid 填入;/api/reply 必须用它做 oid 查询
        let currentAid = 0;
        // 播放心跳(历史记录/进度同步)用的当前 cid,取自 /api/info 里当前分P 的 pages 项
        let currentCid = 0;
        // 当前视频 UP 主的 mid,由 /api/info 的 ownerMid 填入;作者信息卡靠它查 /api/up/info,
        // 关注/取关也要用它作为 fid
        let currentOwnerMid = 0;
        let heartbeatTimer = null; // 播放中定时上报的 setInterval 句柄,暂停/结束/卸载时清掉
        const HEARTBEAT_INTERVAL_MS = 15000; // 每 15 秒上报一次播放进度

        // 互动按钮(点赞/投币/收藏)状态,每次切视频重置;转发只是复制链接,不需要状态
        let actionState = { liked: false, favorited: false, coinCount: 0 };
        let commentSort = '2'; // 2 = 按热度(默认), 0 = 按时间
        let commentCursor = 0; // 新评论接口的游标: 第一页 0,之后取上一页返回的 next
        let commentPage = 1; // 只有退回老接口分页时才会用到
        let commentLegacyPaging = false; // 上一页是否走的兜底老接口(按 pn 翻页)
        let commentTotal = 0;
        let commentLoadedCount = 0;
        let commentRpids = new Set(); // 已渲染的 rpid,防止同一条评论被插两次
        // 本次页面会话里删掉的评论 id: 上游删除生效有延迟,列表接口可能还会返回它,
        // 渲染时统一跳过;刷新页面后以上游为准,这个集合自然失效
        let deletedRpids = new Set();
        let commentLoading = false;
        let commentHasMore = false; // 是否还有下一页评论,滚动到底部时检查
        // 自己刚发的那条评论的 rpid,拉列表时当 seek_rpid 传给上游,让它稳定出现在第一页最前面
        // (0 赞的新评论在"最热"排序下挤不进第一页)。只记在内存里:刷新页面、切换排序、
        // 换视频都会清掉,不再强制置顶
        let myCommentRpid = '';

        // 楼层回复(子评论)的加载状态,按 rpid 分别记录页码/总数/是否加载中
        const subReplyState = {};

        function saveMyCommentRpid(rpid) {
            if (rpid) myCommentRpid = String(rpid);
        }

        function forgetMyCommentRpid() {
            myCommentRpid = '';
        }

        // 相关推荐:默认只展示前 20 条,点击"展开"后显示 relatedFullList 全部内容
        const RELATED_INITIAL_COUNT = 20;
        let relatedFullList = [];
        let relatedExpanded = false;
        // 提前取一次引用: 这个按钮会被搬来搬去(宽屏在 relatedBox,窄屏在 relatedScroll 末尾),
        // 而 relatedScroll 每次重渲染卡片都会整体替换 innerHTML 把它冲掉,所以后面统一用这个变量
        const relatedExpandBtn = document.getElementById('relatedExpandBtn');

        // 根据 bv/av 号(+分P)构造 /player 跳转地址
        function buildPlayerUrl(id, page) {
            const paramType = id.toLowerCase().startsWith('av') ? 'av' : 'bv';
            const cleanId = id.replace(/av/i, '');
            const params = new URLSearchParams();
            params.set(paramType, cleanId);
            if (page && page > 1) params.set('p', String(page));
            return `/player?${params.toString()}`;
        }

        // 站内切换视频(切分P / 点相关推荐)的统一入口: 只改地址栏 + 重新拉数据,不做整页跳转,
        // 这样静态资源不用重新下载解析。replace=true 用于 popstate 回退,不产生新的历史记录
        function navigateToVideo(id, page, replace) {
            page = page || 1;

            // 切走前先补报一次上一个视频的播放进度、停掉旧的心跳定时器。
            // 页面不会卸载,所以不能依赖 beforeunload;不补报会丢进度,不清理定时器会用新视频的 aid/cid 误报
            if (art && !art.paused) reportHeartbeat(art.currentTime, true);
            clearInterval(heartbeatTimer);
            heartbeatTimer = null;

            const url = buildPlayerUrl(id, page);
            if (replace) {
                history.replaceState({ id, page }, '', url);
            } else {
                history.pushState({ id, page }, '', url);
            }

            currentVideoId = id;
            currentPage = page;
            pendingSeekSeconds = 0; // 站内切视频不是"继续观看"入口,不跳转到指定秒数

            // 楼层回复的分页状态按 rpid 记,换了视频这些 rpid 就没用了
            Object.keys(subReplyState).forEach((key) => delete subReplyState[key]);

            // 点赞/投币/收藏的高亮先复位,等 syncActionStatus 回来再刷新成真实状态,
            // 避免短暂"借用"上一个视频的高亮
            actionState = { liked: false, favorited: false, coinCount: 0 };
            document.getElementById('actionLike').classList.remove('active');
            document.getElementById('actionFavorite').classList.remove('active');
            document.getElementById('actionCoin').classList.remove('active');
            // 收藏夹弹窗的内容属于上一个视频,一并关掉并清空
            closeFavFolders();

            window.scrollTo({ top: 0, behavior: 'smooth' });

            startPlay();
        }

        // 地址栏是 pushState 改的,浏览器不会自动重新加载内容,需要自己监听 popstate 重新走一遍播放流程
        window.addEventListener('popstate', () => {
            const params = new URLSearchParams(window.location.search);
            const bv = params.get('bv');
            const av = params.get('av');
            const p = params.get('p');
            if (bv || av) {
                navigateToVideo(bv || `av${av}`, p ? (parseInt(p, 10) || 1) : 1, true);
            }
        });

        const API_TIMEOUT_MS = 15000; // 后端还要转发上游,给足够余量

        // /api/* 统一加超时,避免后端卡住时页面一直转圈。
        // 第二个参数既可以是超时毫秒数(多数调用),也可以是 fetch 的 options(上传图片等 POST),
        // options 里带 signal 时以调用方为准
        async function fetchWithTimeout(url, optionsOrTimeout = API_TIMEOUT_MS, timeoutMs = API_TIMEOUT_MS) {
            const asOptions = typeof optionsOrTimeout === 'object' && optionsOrTimeout !== null;
            const options = asOptions ? optionsOrTimeout : {};
            const timeout = asOptions ? timeoutMs : optionsOrTimeout;

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            try {
                return await fetch(url, { ...options, signal: options.signal || controller.signal });
            } catch (err) {
                if (err.name === 'AbortError') {
                    throw new Error(`请求超时(超过 ${(timeout / 1000).toFixed(0)}s 未响应),请稍后重试`);
                }
                throw err;
            } finally {
                clearTimeout(timer);
            }
        }

        /* ----------------------------- JSON RESPONSE 面板(可切换查看各接口返回) ----------------------------- */

        const jsonResults = { play: null, info: null, danmaku: null, related: null, reply: null };
        let currentJsonTab = 'play';

        function renderJsonOutput() {
            const data = jsonResults[currentJsonTab];
            document.getElementById('jsonOutput').textContent =
                data != null ? JSON.stringify(data, null, 2) : '暂无数据';
        }

        function setJsonResult(type, data) {
            jsonResults[type] = data;
            if (type === currentJsonTab) renderJsonOutput();
        }

        function switchJsonTab(type) {
            currentJsonTab = type;
            document.querySelectorAll('.json-tab').forEach((el) => {
                el.classList.toggle('active', el.dataset.type === type);
            });
            renderJsonOutput();
        }

        document.getElementById('jsonTabs').addEventListener('click', (e) => {
            const btn = e.target.closest('.json-tab');
            if (!btn || btn.classList.contains('active')) return;
            switchJsonTab(btn.dataset.type);
        });

        // 右下角悬浮按钮控制 JSON 调试面板的展开/收起。
        // force 传 true/false 可以强制展开或收起(关闭按钮用),不传就是切换。
        function toggleDebugPanel(force) {
            const panel = document.getElementById('debugPanel');
            const shouldOpen = typeof force === 'boolean' ? force : !panel.classList.contains('open');
            panel.classList.toggle('open', shouldOpen);
        }

        // 点击面板和悬浮按钮以外的地方自动收起,体验上更接近"浮层"而不是常驻区块
        document.addEventListener('click', (e) => {
            const panel = document.getElementById('debugPanel');
            const btn = document.getElementById('debugToggleBtn');
            if (!panel.classList.contains('open')) return;
            if (panel.contains(e.target) || btn.contains(e.target)) return;
            toggleDebugPanel(false);
        });

        function renderEpisodeBox(pages, activePage) {
            const episodeBox = document.getElementById('episodeBox');
            const episodeList = document.getElementById('episodeList');

            // 没有分P信息，或只有一P，就不显示选集切换和列表
            if (!pages || pages.length <= 1) {
                episodeBox.classList.remove('show');
                episodeList.classList.remove('show');
                episodeList.innerHTML = '';
                return;
            }

            episodeBox.classList.add('show');
            episodeList.classList.add('show');

            episodeList.innerHTML = '';
            pages.forEach((item) => {
                const el = document.createElement('div');
                el.className = 'episode-item' + (item.page === activePage ? ' active' : '');
                el.textContent = `P${item.page}  ${item.part}`;
                el.onclick = () => {
                    if (item.page === activePage) return; // 已经是当前这一P，不用重复切换
                    navigateToVideo(currentVideoId, item.page);
                };
                episodeList.appendChild(el);
            });
        }

        function toggleDesc() {
            const descText = document.getElementById('descText');
            const descToggle = document.getElementById('descToggle');
            const collapsed = descText.classList.toggle('collapsed');
            descToggle.textContent = collapsed ? '展开' : '收起';
        }

        /* 标题下方的播放量/弹幕数/发布时间 */
        function formatStatCount(n) {
            if (n == null) return '-';
            if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
            return String(n);
        }

        function renderVideoStats(data) {
            const box = document.getElementById('videoStats');
            if (!data) {
                box.style.display = 'none';
                return;
            }
            document.getElementById('statPlay').textContent = formatStatCount(data.play);
            document.getElementById('statDanmaku').textContent = formatStatCount(data.danmaku);
            document.getElementById('statPubdate').textContent = formatFullDateTime(data.pubdate);
            box.style.display = 'flex';
        }

        /* 播放器下方的点赞/投币/收藏/转发按钮 */
        function setStatWithRaw(spanId, n) {
            const span = document.getElementById(spanId);
            span.dataset.raw = String(n || 0);
            span.textContent = formatStatCount(n);
        }

        function renderActionBar(data) {
            setStatWithRaw('statLike', data ? data.like : null);
            setStatWithRaw('statCoin', data ? data.coin : null);
            setStatWithRaw('statFavorite', data ? data.favorite : null);
            setStatWithRaw('statShare', data ? data.share : null);

            // 切视频时先重置按钮的"已点/已投/已收藏"状态和 UP 主 mid,
            // 真实状态由 syncActionStatus() 异步查回来后再覆盖一次(见 startPlay)
            currentOwnerMid = data ? (data.ownerMid || 0) : 0;
            actionState = { liked: false, favorited: false, coinCount: 0 };
            document.getElementById('actionLike').classList.remove('active');
            document.getElementById('actionFavorite').classList.remove('active');
            document.getElementById('actionCoin').classList.remove('active');
            // 换视频(含浏览器前进/后退)时关掉收藏夹弹窗,避免把上一个视频的勾选提交到新视频上
            closeFavFolders();

            // 右上角作者信息卡跟着这次切视频一起刷新
            fetchUpInfo(currentOwnerMid);
        }

        /* ----------------------------- 作者信息卡:头像/昵称/简介 + 关注/取关 -----------------------------
         * 宽屏在右侧栏最上方,窄屏被 updateRelatedPlacement 搬到主列"简介"上方,DOM 节点是同一个,
         * 这里只管请求数据、渲染内容,不关心它当前具体待在页面哪个位置。
         * -------------------------------------------------------------------- */
        async function renderFollowBtn(following) {
            const btn = document.getElementById('upFollowBtn');
            btn.dataset.following = following ? '1' : '0';
            btn.classList.toggle('following', following);
            btn.textContent = following ? '已关注' : '+ 关注';
        }

        async function fetchUpInfo(mid) {
            const card = document.getElementById('upCard');
            const btn = document.getElementById('upFollowBtn');

            if (!mid) {
                card.classList.add('hide');
                return;
            }

            // 先清空上一个视频作者的内容再请求,避免异步等待期间短暂"借用"上一个作者的信息
            card.classList.remove('hide');
            document.getElementById('upAvatar').src = '';
            document.getElementById('upName').textContent = '';
            document.getElementById('upSign').textContent = '';
            btn.style.display = 'none';

            try {
                const res = await fetchWithTimeout(`/api/up/info?mid=${mid}`);
                // 先取文本再解析: 后端异常时可能返回 HTML 错误页,直接 res.json() 的报错会盖掉真正原因
                const text = await res.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch {
                    throw new Error('加载失败');
                }

                // 异步返回时用户可能已经切到别的视频了,mid 对不上就丢弃这次结果
                if (mid !== currentOwnerMid) return;

                if (data.code !== 0) {
                    // 失败就给一句"加载失败",不把上游原因(风控/超时)摊在卡片上
                    document.getElementById('upName').textContent = '加载失败';
                    document.getElementById('upSign').textContent = '';
