                    document.getElementById('upAvatar').style.visibility = 'hidden';
                    btn.style.display = 'none';
                    card.dataset.spaceHref = '';
                    return;
                }

                document.getElementById('upAvatar').src = data.avatar || '';
                document.getElementById('upAvatar').style.visibility = 'visible';
                document.getElementById('upName').textContent = data.name || '';
                document.getElementById('upSign').textContent = data.sign || '暂无简介';

                // 点头像/昵称跳转到 TA 的空间页;点自己的则跳去"我的主页"(不带 mid)
                card.dataset.spaceHref = data.isSelf ? '/account' : `/account?mid=${mid}`;

                if (!data.isSelf) {
                    btn.dataset.mid = String(mid);
                    renderFollowBtn(!!data.isFollowing);
                    btn.style.display = 'inline-block';
                }
            } catch (err) {
                if (mid === currentOwnerMid) {
                    document.getElementById('upName').textContent = '加载失败';
                    document.getElementById('upSign').textContent = '';
                    document.getElementById('upAvatar').style.visibility = 'hidden';
                    btn.style.display = 'none';
                    card.dataset.spaceHref = '';
                }
            }
        }

        // 点头像/昵称跳转到作者的空间页(自己的空间页会跳去不带 mid 的 /account,展示完整"我的主页")
        function goToUpSpace() {
            const href = document.getElementById('upCard').dataset.spaceHref;
            if (href) window.location.href = href;
        }
        document.getElementById('upAvatar').addEventListener('click', goToUpSpace);
        document.getElementById('upName').addEventListener('click', goToUpSpace);

        document.getElementById('upFollowBtn').addEventListener('click', async () => {
            if (!isUserLoggedIn) { openLoginModal(); return; }

            const btn = document.getElementById('upFollowBtn');
            const mid = btn.dataset.mid;
            if (!mid) return;

            const nextFollow = btn.dataset.following !== '1';
            btn.disabled = true;
            try {
                const res = await fetch('/api/up/follow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mid, follow: nextFollow }),
                });
                const data = await res.json();
                if (data.code !== 0) {
                    showToast(data.message || (nextFollow ? '关注失败' : '取消关注失败'));
                    return;
                }
                renderFollowBtn(nextFollow);
                showToast(nextFollow ? '关注成功' : '已取消关注');
            } catch (err) {
                console.warn('关注/取关请求失败:', err);
                showToast('请求失败,请稍后重试');
            } finally {
                btn.disabled = false;
            }
        });

        // 反查当前账号对这个视频的真实点赞/投币/收藏状态,同步按钮高亮。
        // 这里不判断 isUserLoggedIn 就直接调——未登录时接口自己会返回默认值(全 false/0),
        // 这样也不用担心 isUserLoggedIn 是否已经被 refreshLoginStatus() 异步刷新回来。
        // 只更新按钮的高亮状态,不改 statLike/statCoin/statFavorite 上的数字——
        // 那几个数字已经是 /api/info 给的真实总数,不需要再乐观加减。
        async function syncActionStatus(aid) {
            if (!aid) return;
            try {
                const res = await fetchWithTimeout(`/api/action/status?aid=${aid}`);
                const data = await res.json();
                if (data.code !== 0) return;
                // 异步返回时用户可能已经切到别的视频了,aid 对不上就不要覆盖当前状态
                if (aid !== currentAid) return;

                actionState.liked = !!data.liked;
                actionState.favorited = !!data.favorited;
                actionState.coinCount = data.coinCount || 0;
                document.getElementById('actionLike').classList.toggle('active', actionState.liked);
                document.getElementById('actionFavorite').classList.toggle('active', actionState.favorited);
                document.getElementById('actionCoin').classList.toggle('active', actionState.coinCount > 0);
            } catch (err) {
                console.warn('查询点赞/投币/收藏状态失败:', err);
            }
        }

        function showToast(text, durationMs) {
            const toast = document.getElementById('actionToast');
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(showToast._timer);
            // 默认 2.2 秒;登录过期这类重要提示会传更长的时长
            showToast._timer = setTimeout(() => toast.classList.remove('show'), durationMs || 2200);
        }

        // 把某个 stat span 的数字在当前显示值基础上加/减 delta(纯前端乐观更新,不重新拉取真实值)
        function bumpStatCount(spanId, delta) {
            const span = document.getElementById(spanId);
            const raw = parseInt(span.dataset.raw || '0', 10) + delta;
            span.dataset.raw = String(Math.max(0, raw));
            span.textContent = formatStatCount(Math.max(0, raw));
        }

        async function postAction(url, body) {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const data = await res.json().catch(() => ({}));
            if (res.status === 401) {
                openLoginModal();
                throw new Error('请先登录');
            }
            if (!res.ok || data.code !== 0) {
                throw new Error(data.message || '操作失败');
            }
            return data;
        }

        // 播放心跳: 对应真实 B 站的 x/report/web/heartbeat 接口。
        // 打开视频后立即上报一次,相当于"写入历史记录";播放过程中定时上报当前秒数,
        // 这样换个设备/客户端打开同一个账号时,"继续观看"能跳到上次看到的位置。
        // 未登录时上报了也进不了"我的"历史,直接跳过;失败也静默忽略,不打扰正常观看。
        // keepalive 用于页面隐藏/卸载前的最后一次上报,确保请求不会因为页面关闭而被中断。
        async function reportHeartbeat(playedTime, keepalive) {
            if (!isUserLoggedIn || !currentAid || !currentCid) return;
            const safeTime = Math.max(0, Math.floor(playedTime || 0));
            try {
                await fetch('/api/action/heartbeat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ aid: currentAid, cid: currentCid, playedTime: safeTime }),
                    keepalive: !!keepalive,
                });
            } catch (err) {
                console.warn('播放进度上报失败,忽略:', err);
            }
        }

        // 页面隐藏(切后台/切标签页)或即将卸载(切视频整页刷新/关闭页面)时,
        // 补报一次当前播放进度,避免刚好卡在两次定时上报中间的这段进度丢失。
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && art && !art.paused) {
                reportHeartbeat(art.currentTime, true);
            }
        });
        window.addEventListener('beforeunload', () => {
            if (art && !art.paused) reportHeartbeat(art.currentTime, true);
        });

        document.getElementById('actionLike').addEventListener('click', async () => {
            if (!isUserLoggedIn) { openLoginModal(); return; }
            if (!currentAid) return;
            const btn = document.getElementById('actionLike');
            const nextLiked = !actionState.liked;
            btn.disabled = true;
            try {
                await postAction('/api/action/like', { aid: currentAid, like: nextLiked });
                actionState.liked = nextLiked;
                btn.classList.toggle('active', nextLiked);
                bumpStatCount('statLike', nextLiked ? 1 : -1);
                showToast(nextLiked ? '点赞成功' : '已取消点赞');
            } catch (err) {
                if (err.message !== '请先登录') showToast(err.message || '点赞失败');
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById('actionCoin').addEventListener('click', async () => {
            if (!isUserLoggedIn) { openLoginModal(); return; }
            if (!currentAid) return;
            if (actionState.coinCount >= 2) { showToast('最多投 2 个硬币'); return; }

            const btn = document.getElementById('actionCoin');
            btn.disabled = true;
            try {
                await postAction('/api/action/coin', { aid: currentAid, count: 1 });
                actionState.coinCount += 1;
                btn.classList.add('active');
                bumpStatCount('statCoin', 1);
                showToast('投币成功');
            } catch (err) {
                if (err.message !== '请先登录') showToast(err.message || '投币失败');
            } finally {
                btn.disabled = false;
            }
        });

        /* ----------------------------- 选择收藏夹弹窗 -----------------------------
           点"收藏"按钮弹出居中弹窗,勾选要放入/移出的夹子后点"确定"一次提交。
           勾选状态来自 /api/account/favorites?rid=aid(上游按 rid 回 fav_state),
           提交时与打开弹窗时的初始状态比对出增/删两个数组,发给 /api/action/favorite;
           从所有夹子移出即取消收藏。 */
        let favFolders = [];      // [{ id, title, mediaCount, checked, initial }]
        let favFolderOpen = false;
        let favFolderLoading = false;
        let favFolderError = '';
        let favFolderSubmitting = false;
        let favFolderLoadId = 0;  // 每次加载递增,回来时对不上就说明这次结果已经过期

        const CHECK_ICON_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        const favFolderMask = document.getElementById('favFolderMask');
        const favFolderList = document.getElementById('favFolderList');
        const favFolderConfirm = document.getElementById('favFolderConfirm');

        document.getElementById('actionFavorite').addEventListener('click', () => {
            if (!isUserLoggedIn) { openLoginModal(); return; }
            if (!currentAid) return;
            openFavFolders();
        });

        document.getElementById('favFolderCancel').addEventListener('click', () => closeFavFolders());
        // 点遮罩空白处关闭(弹窗内部的点击不关,同扫码登录弹窗)
        favFolderMask.addEventListener('click', (e) => {
            if (e.target === favFolderMask) closeFavFolders();
        });

        function openFavFolders() {
            favFolderOpen = true;
            favFolders = [];
            favFolderError = '';
            favFolderLoading = true; // 先按"加载中"渲染,避免空列表的提示闪一下
            updateFavFolderUI();
            loadFavFolders();
        }

        // reset=false 只用在上游确认改动成功后: 关掉弹窗但保留夹子列表和新的 initial,
        // 用户马上再打开时不必重新加载
        function closeFavFolders(reset = true) {
            favFolderOpen = false;
            if (reset) {
                favFolders = [];
                favFolderError = '';
                favFolderLoading = false;
            }
            updateFavFolderUI();
        }

        // 只负责把 favFolders 画成列表 + 刷新确定按钮的可用状态,不关心数据来源
        function updateFavFolderUI() {
            favFolderMask.classList.toggle('show', favFolderOpen);
            if (!favFolderOpen) { favFolderConfirm.disabled = true; return; }

            if (favFolderError) {
                favFolderList.innerHTML = `<div class="fav-folder-error">${escapeHtml(favFolderError)}
                    <br><button type="button" class="fav-folder-retry" id="favFolderRetry">重试</button></div>`;
                document.getElementById('favFolderRetry').addEventListener('click', loadFavFolders);
            } else if (favFolderLoading && !favFolders.length) {
                favFolderList.innerHTML = `<div class="fav-folder-placeholder">加载中...</div>`;
            } else if (!favFolders.length) {
                favFolderList.innerHTML = `<div class="fav-folder-placeholder">还没有创建收藏夹,请先在 B 站创建一个收藏夹</div>`;
            } else {
                favFolderList.innerHTML = favFolders.map((f, i) => `
                    <label class="fav-folder-item${f.checked ? ' checked' : ''}" data-index="${i}">
                        <span class="fav-folder-check">${CHECK_ICON_SVG}</span>
                        <span class="fav-folder-name">${escapeHtml(f.title)}</span>
                        <span class="fav-folder-count">${formatStatCount(f.mediaCount || 0)}</span>
                    </label>`).join('');
            }

            const changed = favFolders.some((f) => f.checked !== f.initial);
            favFolderConfirm.disabled = favFolderLoading || favFolderSubmitting || !changed;
            favFolderConfirm.textContent = favFolderSubmitting ? '提交中...' : '确定';
        }

        favFolderList.addEventListener('click', (e) => {
            const item = e.target.closest('.fav-folder-item');
            if (!item || favFolderSubmitting) return;
            const folder = favFolders[Number(item.dataset.index)];
            if (!folder) return;
            folder.checked = !folder.checked;
            updateFavFolderUI();
        });

        async function loadFavFolders() {
            const aid = currentAid;
            const loadId = ++favFolderLoadId;
            const isCurrent = () => favFolderOpen && loadId === favFolderLoadId && aid === currentAid;

            favFolderLoading = true;
            favFolderError = '';
            updateFavFolderUI();
            try {
                const res = await fetchWithTimeout(`/api/account/favorites?rid=${aid}`);
                const data = await res.json();
                if (!isCurrent()) return;
                if (data.code !== 0) throw new Error(data.message || '获取收藏夹失败');
                favFolders = (data.list || []).map((f) => {
                    const checked = !!f.favState;
                    return { id: f.id, title: f.title, mediaCount: f.mediaCount, checked, initial: checked };
                });
            } catch (err) {
                if (!isCurrent()) return;
                favFolderError = err.message || '获取收藏夹失败,请稍后重试';
            } finally {
                // 过期结果不碰状态:用户可能已经关掉弹窗、重开或切了视频
                if (isCurrent()) {
                    favFolderLoading = false;
                    updateFavFolderUI();
                }
            }
        }

        favFolderConfirm.addEventListener('click', async () => {
            if (favFolderSubmitting) return;
            const aid = currentAid;
            const addMediaIds = favFolders.filter((f) => f.checked && !f.initial).map((f) => f.id);
            const delMediaIds = favFolders.filter((f) => !f.checked && f.initial).map((f) => f.id);
            if (!addMediaIds.length && !delMediaIds.length) return;

            // 数字的加减只看"收藏夹数量从 0 变到非 0(或反过来)",换个夹子不动总数
            const wasFavorited = favFolders.some((f) => f.initial);

            favFolderSubmitting = true;
            updateFavFolderUI();
            try {
                const data = await postAction('/api/action/favorite', { aid, addMediaIds, delMediaIds });
                if (aid !== currentAid) return; // 提交期间用户已经切到别的视频了
                const nowFavorited = !!data.favorited;
                actionState.favorited = nowFavorited;
                document.getElementById('actionFavorite').classList.toggle('active', nowFavorited);
                if (nowFavorited !== wasFavorited) bumpStatCount('statFavorite', nowFavorited ? 1 : -1);
                favFolders = favFolders.map((f) => ({ ...f, initial: f.checked }));
                closeFavFolders(false);
                showToast(nowFavorited ? '已收藏' : '已取消收藏');
            } catch (err) {
                if (err.message !== '请先登录') showToast(err.message || '收藏失败');
            } finally {
                favFolderSubmitting = false;
                if (favFolderOpen && aid === currentAid) updateFavFolderUI();
            }
        });

        // 按 Esc 关掉弹窗(弹窗外点击的关闭写在遮罩的 click 里)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && favFolderOpen) closeFavFolders();
        });

        function fallbackCopyText(text, onSuccess, onFail) {
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(textarea);
                ok ? onSuccess() : onFail();
            } catch (err) {
                onFail();
            }
        }

        document.getElementById('actionShare').addEventListener('click', () => {
            const link = window.location.href;
            const onSuccess = () => showToast('分享链接已复制');
            const onFail = () => showToast('复制失败,请手动复制地址栏链接');

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(link).then(onSuccess).catch(() => fallbackCopyText(link, onSuccess, onFail));
            } else {
                fallbackCopyText(link, onSuccess, onFail);
            }
        });

        /* ----------------------------- 相关推荐 ----------------------------- */

        function formatRelatedCount(n) {
            if (n == null) return '';
            if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
            return String(n);
        }

        function formatRelatedDuration(sec) {
            // 上游可能给 "mm:ss"/"hh:mm:ss" 字符串,也可能给秒数;带冒号的必须逐段解析,
            // 直接 parseInt("13:05") 会得到 13
            let total;
            if (typeof sec === 'string' && sec.includes(':')) {
                const parts = sec.split(':').map((p) => parseInt(p, 10) || 0);
                if (parts.length === 3) total = parts[0] * 3600 + parts[1] * 60 + parts[2];
                else if (parts.length === 2) total = parts[0] * 60 + parts[1];
                else total = parts[0] || 0;
            } else {
                total = parseInt(sec, 10) || 0;
            }
            const h = Math.floor(total / 3600);
            const m = Math.floor((total % 3600) / 60);
            const s = total % 60;
            if (h > 0) {
                return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        function relatedSkeletonHTML(count) {
            return Array.from({ length: count }).map(() => `
                <div class="related-card related-skeleton">
                    <div class="related-thumb"></div>
                </div>
            `).join('');
        }

        function relatedCardHTML(item) {
            const safeTitle = (item.title || '').replace(/"/g, '&quot;');
            const href = buildPlayerUrl(item.bvid, 1);
            // 播放数单独包一个 span: .related-meta 是 flex 排,UP 名可收缩出省略号,
            // 这个 span 不收缩,所以两者永远在同一排(窄屏卡片也一样)
            const playHTML = item.play != null
                ? `<span class="related-meta-play">· ${formatRelatedCount(item.play)}播放</span>`
                : '';

            // UP 角标 + 用户名做成一整行链接(和首页/搜索页的 UP 行一致):
            // 悬停两者一起变粉,点击进 TA 的空间;没有 mid 时退回纯文本。
            const mid = item.authorMid || 0;
            const authorHTML = (item.author && mid)
                ? `<a class="related-meta-author" href="/account?mid=${mid}" title="${String(item.author).replace(/"/g, '&quot;')}">
                        <svg width="16" height="13" viewBox="0 0 24 20" xmlns="http://www.w3.org/2000/svg">
                            <rect x="0.5" y="0.5" width="23" height="19" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
                            <text x="12" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif">UP</text>
                        </svg>
                        <span class="related-meta-name">${item.author}</span>
                    </a>`
                : `<span class="related-meta-name">${item.author || ''}</span>`;

            // 卡片是 div,封面与标题各自是真 <a href>(右键新标签页/中键/键盘原生可用),
            // 左键由 relatedScroll 的点击委托在原地切换播放,卡片空白处不响应
            return `
                <div class="related-card" data-bvid="${item.bvid}">
                    <a class="related-thumb" href="${href}">
                        <img src="${item.pic}" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.style.opacity=0" />
                        <span class="related-duration">${formatRelatedDuration(item.duration)}</span>
                    </a>
                    <div class="related-info">
                        <p class="related-title" title="${safeTitle}"><a class="related-title-text" href="${href}">${item.title || ''}</a></p>
                        <div class="related-meta">${authorHTML}${playHTML}</div>
                    </div>
                </div>
            `;
        }

        // 根据 relatedFullList + relatedExpanded 渲染右侧推荐列表:
        // 默认只截取前 RELATED_INITIAL_COUNT 条,超出部分点击"展开"按钮后才全部显示
        function renderRelatedList() {
            const relatedScroll = document.getElementById('relatedScroll');

            const shown = relatedExpanded
                ? relatedFullList
                : relatedFullList.slice(0, RELATED_INITIAL_COUNT);

            // 这里是整体 innerHTML 替换,如果按钮当前正待在 relatedScroll 里(窄屏状态),
            // 会被一并冲掉,所以渲染完卡片后必须调用 placeRelatedExpandBtn() 把它放回去
            relatedScroll.innerHTML = shown.map(relatedCardHTML).join('');

            const hasMore = !relatedExpanded && relatedFullList.length > RELATED_INITIAL_COUNT;
            relatedExpandBtn.classList.toggle('show', hasMore);
            placeRelatedExpandBtn();
        }

        // "展开全部"按钮点击后,一次性显示 relatedFullList 里剩余的全部内容
        function expandRelated() {
            relatedExpanded = true;
            renderRelatedList();
        }

        // 拉取当前视频的相关推荐
        async function loadRelated(paramType, cleanId, mySeq = playSeq) {
            const relatedBox = document.getElementById('relatedBox');
            const relatedScroll = document.getElementById('relatedScroll');

            relatedBox.classList.add('show');
            relatedFullList = [];
            relatedExpanded = false;
            relatedExpandBtn.classList.remove('show');
            relatedScroll.innerHTML = relatedSkeletonHTML(8);

            try {
                const url = `/api/related?${paramType}=${encodeURIComponent(cleanId)}`;
                const res = await fetchWithTimeout(url);
                const data = await res.json();
                setJsonResult('related', data);

                // 站内切视频时,这个请求可能是上一个视频发出的、现在才慢悠悠地回来,
                // 序号对不上就不要再拿它去刷新当前(已经是别的视频了)的相关推荐列表。
                if (mySeq !== playSeq) return;

                if (!res.ok || !data.list || data.list.length === 0) {
                    relatedScroll.innerHTML = `<div class="related-empty">暂无相关推荐</div>`;
                    return;
                }

                relatedFullList = data.list;
                renderRelatedList();
            } catch (err) {
                if (mySeq !== playSeq) return;
                setJsonResult('related', { error: err.message });
                relatedScroll.innerHTML = `<div class="related-error">相关推荐加载失败,请稍后再试</div>`;
            }
        }

        // 点相关推荐卡片的封面/标题:原地切换播放(改地址栏 + 重新拉数据,不整页刷新)。
        // 卡片空白处不响应;带修饰键的点击交给浏览器开新标签页
        document.getElementById('relatedScroll').addEventListener('click', (e) => {
            // UP 行是独立的链接(进 TA 的个人主页),交给浏览器默认行为,不要顺手把视频也换了
            if (e.target.closest('.related-meta-author')) return;

            const link = e.target.closest('a[href]');
            if (!link) return;
            if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
            e.preventDefault(); // 普通左键:拦掉整页跳转,走下面的原地切换

            const card = link.closest('.related-card');
            if (!card || !card.dataset.bvid) return;
            if (card.dataset.bvid === currentVideoId && currentPage === 1) return; // 已经在看这个视频

            navigateToVideo(card.dataset.bvid, 1);
        });

        /* 选集 + 相关推荐的窄屏适配:默认(宽屏)两者都待在右侧栏(选集在上、相关推荐在下),
           相关推荐是纵向列表,"展开全部"按钮跟着留在列表下方、横排圆角按钮;
           视口 <= 960px 时,选集+相关推荐一起搬到主列"简介"和"评论区"之间(选集在上、
           相关推荐在下),相关推荐改横向可滚动排列,"展开全部"按钮这时被搬进 relatedScroll
           内部、排在所有卡片最后面,当成一张竖排文字的圆角矩形"卡片",滚动条拉到最右侧才会看到
           (具体样式见 .related-scroll--narrow .related-expand-btn.show)。
           用 matchMedia 监听断点变化,进入/离开窄屏时实时挪动 DOM 节点 + 切换样式类。 */
        const relatedNarrowQuery = window.matchMedia('(max-width: 960px)');

        // 按当前宽窄屏状态,把"展开全部"按钮放到它该在的位置:
        // 宽屏 -> relatedBox 末尾(列表下方);窄屏 -> relatedScroll 末尾(横向列表最后一张"卡片")。
        // renderRelatedList 每次整体重渲染卡片后,以及断点变化时都要调用一次。
        function placeRelatedExpandBtn() {
            const relatedBox = document.getElementById('relatedBox');
            const relatedScroll = document.getElementById('relatedScroll');
            if (!relatedBox || !relatedScroll) return;

            if (relatedNarrowQuery.matches) {
                if (relatedExpandBtn.parentElement !== relatedScroll
                    || relatedScroll.lastElementChild !== relatedExpandBtn) {
                    relatedScroll.appendChild(relatedExpandBtn);
                }
            } else if (relatedExpandBtn.parentElement !== relatedBox) {
                relatedBox.appendChild(relatedExpandBtn);
            }
        }

        function updateRelatedPlacement() {
            const episodeBox = document.getElementById('episodeBox');
            const episodeList = document.getElementById('episodeList');
            const relatedBox = document.getElementById('relatedBox');
            const relatedScroll = document.getElementById('relatedScroll');
            const upCard = document.getElementById('upCard');
            const descBox = document.getElementById('descBox');
            const sideCol = document.querySelector('.side-col');
            const commentBox = document.querySelector('.comment-box');
            if (!episodeBox || !episodeList || !relatedBox || !relatedScroll || !upCard || !descBox
                || !sideCol || !commentBox) return;

            const narrow = relatedNarrowQuery.matches;
            relatedScroll.classList.toggle('related-scroll--narrow', narrow);

            if (narrow) {
                // 主列:互动栏 -> 作者信息卡 -> 简介 -> 选集 -> 相关推荐 -> 评论区
                const mainCol = commentBox.parentElement;
                if (upCard.nextElementSibling !== descBox) {
                    mainCol.insertBefore(upCard, descBox);
                }
                if (episodeBox.nextElementSibling !== episodeList
                    || episodeList.nextElementSibling !== relatedBox
                    || relatedBox.nextElementSibling !== commentBox) {
                    mainCol.insertBefore(episodeBox, commentBox);
                    mainCol.insertBefore(episodeList, commentBox);
                    mainCol.insertBefore(relatedBox, commentBox);
                }
            } else {
                // 右侧栏最上方:作者信息卡(播放页右上角),下面依次是选集 -> 相关推荐
                if (upCard.parentElement !== sideCol || sideCol.firstElementChild !== upCard) {
                    sideCol.insertBefore(upCard, sideCol.firstChild);
                }
                if (episodeBox.parentElement !== sideCol
                    || episodeBox.nextElementSibling !== episodeList
                    || episodeList.nextElementSibling !== relatedBox) {
                    // 选集 -> 相关推荐(还原成最初顺序,作者信息卡始终留在最上方)
                    sideCol.appendChild(episodeBox);
                    sideCol.appendChild(episodeList);
                    sideCol.appendChild(relatedBox);
                }
            }

            placeRelatedExpandBtn();
        }

        updateRelatedPlacement();
        if (relatedNarrowQuery.addEventListener) {
            relatedNarrowQuery.addEventListener('change', updateRelatedPlacement);
        } else {
            // 兼容旧版 Safari
            relatedNarrowQuery.addListener(updateRelatedPlacement);
        }

        /* ----------------------------- 评论区 ----------------------------- */

        // 评论昵称/正文虽然都是纯文本,但要拼进 innerHTML,必须转义后再拼。
        // 后果不只是 XSS: 正文里出现孤立 "<"(如贴代码 "a < b")时浏览器会当成标签开头,
        // 一路吞到后面第一个 ">",连评论模板收尾的 </div> 都被吃掉,导致这个 .comment-item
        // 少闭合一层、后面的评论全被塞进它里面(.comment-item 是 flex 横向排列,
        // 表现就是一整条被挤成逐字换行、其余评论跑到右侧)
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 表情名("doge"、"2233娘_大笑" 之类)要拼进正则里当字面量,特殊字符必须转义
        function escapeRegExp(str) {
            return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // 评论正文渲染: 先把整段正文转义(见上面 escapeHtml),再做三件事——
        //   1. 把表情占位符 "[doge]" 换成表情图(映射由服务端 mapReplyEmoji 从
        //      content.emote 里整理出来,key 是不带方括号的表情名);
        //   2. 把 @ 到的人标蓝(服务端 mapReplyMembers 给的 content.members);
        //   3. 附上评论图片(新版接口 content.pictures)。
        // 只有这里自己拼出来的 <img>/<span> 是可信标签,正文里带的尖括号永远只是字面量。
        function renderCommentContent(item) {
            let html = escapeHtml(item.message || '');

            // 名字按长度从长到短排,避免 "[doge]" 抢先匹配掉更长的 "[doge_xxx]"
            const emoji = item.emoji || {};
            const names = Object.keys(emoji).sort((a, b) => b.length - a.length);
            if (names.length) {
                const re = new RegExp('\\[(' + names.map(escapeRegExp).join('|') + ')\\]', 'g');
                html = html.replace(re, (whole, name) => {
                    const e = emoji[name] || {};
                    const big = e.size === 2 ? ' comment-emoji-big' : '';
                    return `<img class="comment-emoji${big}" src="${escapeHtml(e.url || '')}" alt="${escapeHtml(whole)}" loading="lazy" referrerpolicy="no-referrer" />`;
                });
            }

            // @ 到的人:上游在 content.members 里给出被 @ 的昵称和 mid,把正文里的 "@昵称" 标蓝,
            // 点它跳这个人的主页(昵称同理见 goToUserSpace)。名字长→短匹配(和表情同理);
            // 正则里用 "|" 会匹配多条 @,所以字符串整体替换,再按昵称回查 mid。
            const atMembers = (item.members || []).filter((m) => m.uname).sort((a, b) => b.uname.length - a.uname.length);
            if (atMembers.length) {
                const atMid = {};
                for (const m of atMembers) atMid[m.uname] = m.mid;
                const re = new RegExp('@(' + atMembers.map((m) => escapeRegExp(m.uname)).join('|') + ')', 'g');
                html = html.replace(re, (whole, name) => {
                    const mid = atMid[name];
                    // mid 缺失(异常数据)时只高亮,不给跳转
                    return mid
                        ? `<span class="comment-at-text" style="cursor:pointer;" onclick="goToUserSpace('${mid}')">${whole}</span>`
                        : `<span class="comment-at-text">${whole}</span>`;
                });
            }

            const pictures = item.pictures || [];
            // 多图统一切成方形(见 .comment-pics.is-multi),单图保持原比例
            const multi = pictures.length > 1;
            const pics = pictures.map((p) => {
                const w = Number(p.width) || 0;
                const h = Number(p.height) || 0;
                // 宽高只当占位提示用(配 CSS 的 max-width/max-height),图片没加载完不会跳版
                const size = !multi && w && h ? ` width="${w}" height="${h}"` : '';
                return `<img class="comment-pic" src="${escapeHtml(p.src || '')}"${size} loading="lazy" referrerpolicy="no-referrer" alt="" />`;
            }).join('');

            return html + (pics ? `<div class="comment-pics${multi ? ' is-multi' : ''}">${pics}</div>` : '');
        }

        function formatCommentTime(ctime) {
            if (!ctime) return '';
            const d = new Date(ctime * 1000);
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        // 标题下方的发布时间用完整的"年-月-日 时:分:秒",跟上面评论时间(不带秒)区分开
        function formatFullDateTime(unixSeconds) {
            if (!unixSeconds) return '';
            const d = new Date(unixSeconds * 1000);
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        function commentSkeletonHTML(count) {
            return Array.from({ length: count }).map(() => `
                <div class="comment-item comment-skeleton">
                    <div class="comment-avatar"></div>
                    <div class="comment-body">
                        <div class="comment-uname"></div>
                        <div class="comment-message"></div>
                    </div>
                </div>
            `).join('');
        }

        // 点评论区头像/昵称跳转到对应用户的空间页;mid 为 0 时是异常/已注销的匿名评论,不绑定跳转
        function goToUserSpace(mid) {
            if (!mid) return;
            window.location.href = `/account?mid=${mid}`;
        }

        // isTop = 置顶评论(UP 主/管理员置顶),昵称后面多一个"置顶"标签
        function commentItemHTML(item, isTop) {
            // 昵称先转义、正文交给 renderCommentContent(内部同样先转义):
            // 见 escapeHtml 的说明,文本里的 "<" 会冲垮整个评论列表的 DOM
            const uname = escapeHtml(item.uname || '匿名用户');
            const safeUname = escapeHtml(item.uname || '');
            const metaParts = [formatCommentTime(item.ctime)];
            const hasReplies = !!item.rcount;
            const clickable = item.mid ? ' style="cursor:pointer;" onclick="goToUserSpace(' + item.mid + ')"' : '';
            // 昵称整行是块级元素,直接挂在行上会让右侧空白也能点进主页,所以只把点击
            // 绑在名字本身的 span 上(头像本来就是固定尺寸的小方块,保持整块可点)。
            // title(悬停出完整昵称)同理:挂在行上会让整行右侧空白都弹提示,必须挂在 span 上。
            const nameClick = item.mid ? ` style="cursor:pointer;" onclick="goToUserSpace('${item.mid}')"` : '';
            const topBadge = isTop ? '<span class="comment-top-badge">置顶</span>' : '';

            // 有楼层回复的评论,默认收起回复列表,展示一个"展开N条回复"按钮,
            // 点进去才请求 /api/reply/replies 拉取该楼层的回复内容
            const repliesHTML = hasReplies ? `
                <button class="comment-reply-toggle" data-rpid="${item.rpid}" data-total="${item.rcount}" onclick="toggleReplies(this)">展开${formatRelatedCount(item.rcount)}条回复</button>
                <div class="comment-sub-replies" id="subReplies-${item.rpid}" style="display:none;"></div>
            ` : '';

            return `
                <div class="comment-item" data-rpid="${item.rpid}">
                    <div class="comment-avatar"${clickable}>
                        <img src="${item.avatar}" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.style.opacity=0" />
                    </div>
                    <div class="comment-body">
                        <div class="comment-uname"><span title="${safeUname}"${nameClick}>${uname}</span>${topBadge}</div>
                        <div class="comment-message">${renderCommentContent(item)}</div>
                        <div class="comment-meta">
                            ${metaParts.map((p) => `<span>${p}</span>`).join('')}
                            ${commentActionsHTML(item, item.rpid, item.rpid, item.uname)}
                        </div>
                        ${repliesHTML}
                    </div>
                </div>
            `;
        }

        // 这条评论是不是自己发的(决定要不要给"删除"按钮)。
        // mid 全程按字符串比: 上游的 member.mid 是字符串,而且 mid 可能超过 JS 安全整数上限,
        // 转数字比会悄悄比错人(和登录状态里 uid 用字符串是同一个原因)。
        function isMyComment(item) {
            return !!(currentUser && currentUser.mid && item && item.mid && String(item.mid) === String(currentUser.mid));
        }

        // 评论/回复右侧的小按钮: 点赞 / 回复 / 删除(只有自己发的评论才有删除)。
        // rootRpid 是楼层根评论(主评论就是自己),parentRpid 是被回复的那一条:
        // 回复主评论时两者相同,回复楼中楼时 root 保持不变、parent 换成那条子评论。
        // 删除时 root 用来告诉上游这条属于哪个楼层(主评论就是它自己,上游会忽略)。
        function commentActionsHTML(item, rootRpid, parentRpid, uname) {
            const raw = Number(item.like) || 0;
            const delBtn = isMyComment(item) ? `
                <button class="comment-action-btn" type="button"
                        data-del-rpid="${item.rpid}" data-del-root="${rootRpid}" title="删除这条评论">删除</button>
            ` : '';
            return `
                <button class="comment-action-btn${item.liked ? ' active' : ''}" type="button"
                        data-like-rpid="${item.rpid}" data-liked="${item.liked ? '1' : '0'}" data-like-raw="${raw}" title="点赞">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                        <path d="M7 11l3.6-7.2a1.8 1.8 0 0 1 3.4.8V9h5.2a2 2 0 0 1 1.94 2.48l-1.5 6.2A2 2 0 0 1 17.7 19H7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    </svg>
                    <span class="comment-like-count">${formatRelatedCount(raw)}</span>
                </button>
                <button class="comment-action-btn" type="button"
                        data-reply-root="${rootRpid}" data-reply-parent="${parentRpid}"
                        data-reply-uname="${escapeHtml(uname || '')}">回复</button>
                ${delBtn}
            `;
        }

        function subReplySkeletonHTML(count) {
            return Array.from({ length: count }).map(() => `
                <div class="sub-reply-item sub-reply-skeleton">
                    <div class="sub-reply-avatar"></div>
                    <div class="sub-reply-body">
                        <div class="sub-reply-uname"></div>
                        <div class="sub-reply-message"></div>
                    </div>
                </div>
            `).join('');
        }

        function subReplyItemHTML(item, rootRpid) {
            // 同 commentItemHTML: 楼中楼的昵称先转义、正文交给 renderCommentContent
            const uname = escapeHtml(item.uname || '匿名用户');
            const safeUname = escapeHtml(item.uname || '');
            const clickable = item.mid ? ' style="cursor:pointer;" onclick="goToUserSpace(' + item.mid + ')"' : '';
            // 同 commentItemHTML: 只有昵称文字本身可点,整行右侧空白不跳转;悬停提示也挂在 span 上
            const nameClick = item.mid ? ` style="cursor:pointer;" onclick="goToUserSpace('${item.mid}')"` : '';
            return `
                <div class="sub-reply-item" data-rpid="${item.rpid}">
                    <div class="sub-reply-avatar"${clickable}>
                        <img src="${item.avatar}" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.style.opacity=0" />
                    </div>
                    <div class="sub-reply-body">
                        <div class="sub-reply-uname"><span title="${safeUname}"${nameClick}>${uname}</span></div>
                        <div class="sub-reply-message">${renderCommentContent(item)}</div>
                        <div class="sub-reply-meta">
                            <span>${formatCommentTime(item.ctime)}</span>
                            ${commentActionsHTML(item, rootRpid, item.rpid, item.uname)}
                        </div>
                    </div>
                </div>
            `;
        }

        // 上游没回带刚发的那条回复时,用它本地拼一条:昵称/头像取当前登录用户,
        // 内容就是刚提交的文本,时间按"刚刚"算。rpid 用接口回带的那个,后续按 rpid 去重。
        // members 是提交时的 @ 列表,拼进来正文里的 "@昵称" 才会被标蓝(和上游 mapReplyMembers 一致)
        function buildMyReplyItem(rpid, message, members) {
            if (!rpid) return null;
            return {
                rpid: String(rpid),
                mid: currentUser ? currentUser.mid : 0,
                uname: currentUser ? currentUser.uname : '',
                avatar: currentUser ? currentUser.avatar : '',
                message: message,
                emoji: usedEmoteMap(message),
                members: members || [],
                like: 0,
                liked: false,
                rcount: 0,
                ctime: Math.floor(Date.now() / 1000),
            };
        }

        // 楼层折叠按钮的文案和条数: 展开状态下写"收起回复",收起状态下写"展开N条回复"
        function updateReplyToggle(root, total) {
            const toggle = document.querySelector(`.comment-reply-toggle[data-rpid="${root}"]`);
            if (!toggle) return;

            if (total > 0) toggle.dataset.total = String(total);
            const count = total > 0 ? total : parseInt(toggle.dataset.total, 10) || 0;

            const box = document.getElementById(`subReplies-${root}`);
            const expanded = !!box && box.style.display !== 'none' && box.dataset.loaded === '1';
            toggle.textContent = expanded ? '收起回复' : `展开${formatRelatedCount(count)}条回复`;
        }

        // 发完回复后把上游回带的那条补进楼层列表。
        // 必须补的原因: 楼层回复接口对刚发出的这条有延迟,重拉第一页往往还没有它;
        // 楼层回复多时(按 pn 分页,一页 10 条)刚发的这条还会排在最后一页,而这里只加载第一页 ——
        // 两种情况下表现都是"回复成功但看不见"。直接插进 DOM,后续翻页/重拉按 rpid 去重
        function appendMySubReply(root, item) {
            const box = document.getElementById(`subReplies-${root}`);
            if (!box || !item || !item.rpid) return;
            if (deletedRpids.has(String(item.rpid))) return; // 已经删掉的不要又插回来
            if (box.querySelector(`.sub-reply-item[data-rpid="${item.rpid}"]`)) return; // 已经在列表里了

            // 上游还没索引到这条时,重拉回来的第一页是空的,页面会写一句"暂无回复",
            // 这条补进去以后那句话就不成立了,先把它去掉
            const emptyEl = box.querySelector('.comment-empty');
            if (emptyEl) emptyEl.remove();

            // "查看更多回复"按钮要始终留在最后,所以插到它前面
            const moreBtn = box.querySelector('.sub-reply-more-btn');
            const html = subReplyItemHTML(item, root);
            if (moreBtn) moreBtn.insertAdjacentHTML('beforebegin', html);
            else box.insertAdjacentHTML('beforeend', html);

            const state = subReplyState[root];
            if (state) state.loaded += 1;

            // 条数取"上游总数"和"已经画出来的条数"里更大的那个:
            //   - 上游还没算上刚发的这条(有延迟) → 总数偏小,用已渲染条数,不会少算;
            //   - 上游已经算上了(只是这页没渲染到它) → 上游总数偏大,用它,不会多算。
            const total = Math.max((state && state.total) || 0, (state && state.loaded) || 0);
            updateReplyToggle(root, total);
        }

        // 点击评论下方的"展开N条回复"/"收起回复"按钮。
        // 第一次展开时才去请求接口,之后再次展开直接复用已加载的内容,不重复请求。
        async function toggleReplies(btn) {
            const rpid = btn.dataset.rpid;
            const total = parseInt(btn.dataset.total, 10) || 0;
            const box = document.getElementById(`subReplies-${rpid}`);
            if (!box) return;

            const alreadyLoaded = box.dataset.loaded === '1';
            const isOpen = box.style.display !== 'none';

            if (isOpen) {
                box.style.display = 'none';
                btn.textContent = `展开${formatRelatedCount(total)}条回复`;
                return;
            }

            box.style.display = 'flex';
            btn.textContent = '收起回复';

            if (alreadyLoaded) return;

            box.dataset.loaded = '1';
            box.innerHTML = subReplySkeletonHTML(Math.min(3, total) || 1);
            subReplyState[rpid] = { page: 1, total, loaded: 0, loading: false };
            await loadSubReplies(rpid);
        }

        // 拉取(或翻页加载)某条楼层评论下的回复,oid 用当前视频的 aid,root 用楼层评论的 rpid
        async function loadSubReplies(rpid) {
            const state = subReplyState[rpid];
            const box = document.getElementById(`subReplies-${rpid}`);
            if (!state || !box || state.loading) return;

            state.loading = true;

            try {
                const url = `/api/reply/replies?oid=${currentAid}&root=${rpid}&pn=${state.page}`;
                const res = await fetchWithTimeout(url);
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

                const rawList = data.list || [];
                // 自己刚发的那条是本地先画进去的(见 appendMySubReply),等真正翻到它
                // 所在的那一页时不能再来一条,按 rpid 去重;已经删掉的那条也跳过。
                const list = rawList.filter((item) => {
                    const key = String(item.rpid);
                    if (deletedRpids.has(key)) return false;
                    if (state.page === 1) return true; // 第一页会先清空容器,不用查重
                    return !box.querySelector(`.sub-reply-item[data-rpid="${key}"]`);
                });
                if (state.page === 1) box.innerHTML = '';

                if (state.page === 1 && list.length === 0) {
                    box.innerHTML = '<div class="comment-empty">暂无回复</div>';
                } else {
                    box.insertAdjacentHTML('beforeend', list.map((item) => subReplyItemHTML(item, rpid)).join(''));
                }

                state.total = data.total || state.total;
                state.loaded += list.length;
                state.page += 1;

                // 每次追加前先移除旧的"查看更多回复"按钮,避免重复
                const oldMoreBtn = box.querySelector('.sub-reply-more-btn');
                if (oldMoreBtn) oldMoreBtn.remove();

                if (list.length > 0 && state.loaded < state.total) {
                    box.insertAdjacentHTML(
                        'beforeend',
                        `<button class="sub-reply-more-btn" onclick="loadSubReplies('${rpid}')">查看更多回复</button>`
                    );
                }

                // 折叠按钮上的条数跟着这一页刷新(取上游总数和已渲染条数的较大值,
                // 理由同 appendMySubReply: 上游对刚发的这条有延迟时不能把条数算少)
                updateReplyToggle(rpid, Math.max(state.total, state.loaded));
            } catch (err) {
                console.warn('楼层回复加载失败:', err);
                box.insertAdjacentHTML('beforeend', `<div class="comment-error">回复加载失败: ${err.message}</div>`);
            } finally {
                state.loading = false;
            }
        }

        /* ----------------------------- 发评论 / 回复 / 评论点赞 ----------------------------- */

        // 当前登录用户(昵称/头像),评论输入框左侧的头像用它;未登录时为 null
        let currentUser = null;

        // 正在回复谁:{ root, parent, uname };null 表示发一条新的主评论
        let replyTarget = null;

        function renderCommentEditor() {
            const avatar = document.getElementById('commentEditorAvatar');
            if (avatar) {
                avatar.src = currentUser && currentUser.avatar ? currentUser.avatar : '';
                avatar.style.opacity = currentUser && currentUser.avatar ? '1' : '0';
            }
            commentInput.dataset.placeholder = currentUser ? '发一条友善的评论' : '登录后参与评论';
        }

        // 点赞 / 取消点赞:先按当前状态乐观切换,失败再回滚
        async function toggleCommentLike(btn) {
            if (!currentAid) return;
            if (!isUserLoggedIn) { openLoginModal(); return; }

            const rpid = btn.dataset.likeRpid;
            const nextLiked = btn.dataset.liked !== '1';
            const raw = Number(btn.dataset.likeRaw) || 0;
            btn.disabled = true;
            try {
                // 和播放器下方那几个互动按钮共用 postAction(自动处理 401/业务错误码)
                await postAction('/api/reply/like', { oid: currentAid, rpid, like: nextLiked });

                const nextRaw = Math.max(0, raw + (nextLiked ? 1 : -1));
                btn.dataset.liked = nextLiked ? '1' : '0';
                btn.dataset.likeRaw = String(nextRaw);
                btn.classList.toggle('active', nextLiked);
                const countEl = btn.querySelector('.comment-like-count');
                if (countEl) countEl.textContent = formatRelatedCount(nextRaw);
            } catch (err) {
                if (err.message !== '请先登录') showToast(err.message || '点赞失败,请稍后重试');
            } finally {
                btn.disabled = false;
            }
        }

        // 删除自己发的评论/回复:确认后调上游删除,再把这条从页面上摘掉并同步各处计数。
        async function deleteComment(btn) {
            if (!currentAid) return;
            if (!isUserLoggedIn) { openLoginModal(); return; }

            const rpid = btn.dataset.delRpid;
            const root = btn.dataset.delRoot || rpid;
            if (!rpid) return;
            if (!window.confirm('确定删除这条评论吗？删除后无法恢复。')) return;

            btn.disabled = true;
            try {
                await postAction('/api/reply/del', { oid: currentAid, rpid, root });
                removeCommentFromPage(rpid, root);
                showToast('评论已删除');
            } catch (err) {
                if (err.message !== '请先登录') showToast(err.message || '删除失败,请稍后重试');
                btn.disabled = false;
            }
        }

        // 把已删除的那条从页面上摘掉,顺带把总数/楼层条数/折叠按钮文案都改对,
        // 不然会出现"评论删了但计数还是老的""楼层空了还挂着展开N条回复"这类残留。
        function removeCommentFromPage(rpid, root) {
            const mainItem = document.querySelector(`.comment-item[data-rpid="${rpid}"]`);
            if (mainItem) {
                mainItem.remove();
                commentTotal = Math.max(0, commentTotal - 1);
                commentLoadedCount = Math.max(0, commentLoadedCount - 1);
                deletedRpids.add(String(rpid));
                const countEl = document.getElementById('commentCount');
                if (countEl) countEl.textContent = commentTotal > 0 ? `评论 ${commentTotal.toLocaleString()}` : '评论';
                // 删掉的正好是自己那条(靠 seek_rpid 置顶的),记忆也要一起清掉,
                // 否则后面重拉第一页还会拿这个已经不存在的 rpid 去请求
                if (String(myCommentRpid) === String(rpid)) forgetMyCommentRpid();
                if (!document.querySelector('.comment-item')) {
                    document.getElementById('commentList').innerHTML = '<div class="comment-empty">暂无评论,快来抢沙发吧</div>';
                }
                return;
            }

            // 楼中楼回复
            const subItem = document.querySelector(`.sub-reply-item[data-rpid="${rpid}"]`);
            if (!subItem) return;
            subItem.remove();
            deletedRpids.add(String(rpid));

            const state = subReplyState[root];
            if (state) {
                state.loaded = Math.max(0, state.loaded - 1);
                state.total = Math.max(0, state.total - 1);
            }

            const box = document.getElementById(`subReplies-${root}`);
            if (box && !box.querySelector('.sub-reply-item')) {
                // 这层楼已经没有回复了: 和 B 站一样把"展开回复"入口整个收掉,
                // 而不是留一个"展开0条回复"
                const toggle = document.querySelector(`.comment-reply-toggle[data-rpid="${root}"]`);
                if (toggle) toggle.remove();
                box.remove();
                delete subReplyState[root];
            } else {
                updateReplyToggle(root, Math.max((state && state.total) || 0, (state && state.loaded) || 0));
            }
        }

        // 点某条评论/回复的"回复":把输入框切到"正在回复 @xxx"状态
        function startReply(dataset) {
            if (!isUserLoggedIn) { openLoginModal(); return; }
            const root = dataset.replyRoot;
            replyTarget = { root, parent: dataset.replyParent || root, uname: dataset.replyUname || '' };

            const chip = document.getElementById('commentReplyChip');
            const nameEl = document.getElementById('commentReplyName');
            const editor = document.getElementById('commentEditor');
            if (nameEl) nameEl.textContent = `@${replyTarget.uname}`;
            if (chip) chip.classList.add('show');
            if (editor && editor.scrollIntoView) editor.scrollIntoView({ behavior: 'smooth', block: 'center' });

            commentInput.dataset.placeholder = `回复 @${replyTarget.uname}：`;
            commentInput.focus();
        }

        function cancelReply() {
            replyTarget = null;
            const chip = document.getElementById('commentReplyChip');
            if (chip) chip.classList.remove('show');
            renderCommentEditor();
        }

        // 给某条楼层评论补上"展开回复"折叠块(原本一条回复都没有时才有必要)
        function ensureReplyArea(root) {
            const box = document.getElementById(`subReplies-${root}`);
            if (box) return box;
            const item = document.querySelector(`.comment-item[data-rpid="${root}"] .comment-body`);
            if (!item) return null;
            item.insertAdjacentHTML('beforeend', `
                <button class="comment-reply-toggle" data-rpid="${root}" data-total="1" onclick="toggleReplies(this)">收起回复</button>
                <div class="comment-sub-replies" id="subReplies-${root}" style="display:flex;"></div>
            `);
            return document.getElementById(`subReplies-${root}`);
        }

        // 回复发出去之后,把这个楼层的回复重新拉一遍(第一页),顺序、分页、总数以上游为准。
        // 注意: 上游对刚发出去的这条有延迟,重拉回来的第一页里可能还没有它,所以调用方
        // 会再用 appendMySubReply 本地补一条(按 rpid 去重,不会和后续翻页打架)。
        async function reloadReplies(root) {
            const box = ensureReplyArea(root);
            if (!box) return;
            box.style.display = 'flex';
            box.dataset.loaded = '1';
            box.innerHTML = subReplySkeletonHTML(2);
            subReplyState[root] = { page: 1, total: 0, loaded: 0, loading: false };

            // 这里只是把楼层重新展开,条数不在这里加: 刚发出去的那条由 appendMySubReply
            // 统一算(取"上游总数"和"已渲染条数"里较大的那个)。两边都加就会出现
            // "明明只有两条回复,按钮却写展开 3 条回复"。
            const toggle = document.querySelector(`.comment-reply-toggle[data-rpid="${root}"]`);
            if (toggle) toggle.textContent = '收起回复';
            await loadSubReplies(root);
        }

        async function sendComment() {
            if (!currentAid) { showToast('视频还没加载好,稍后再试'); return; }
            if (!isUserLoggedIn) { openLoginModal(); return; }

            const { message, members } = readCommentInput();
            const pictures = readyCommentPictures();
            const text = message.trim();
            // 只发图不写字是允许的(B 站自己就是这个规矩);上传还没落地的那几张不算数
            if (!text && !pictures.length) {
                if (commentPictures.length) { showToast('图片还在上传中,稍等一下'); return; }
                showToast('先写点什么吧');
                commentInput.focus();
                return;
            }

            const btn = document.getElementById('commentSendBtn');
            const oldText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '发送中…';

            const target = replyTarget;
            try {
                const payload = { oid: currentAid, message };
                // 正文里的 @ 得把它 @ 的是谁一起交上去:服务端照这张表回填 content.members
                // (网页端也是这么发的),只发正文的话上游不认,评论在网页上不会高亮
                if (members.length) payload.atMentions = members;
                if (target) {
                    payload.root = target.root;
                    payload.parent = target.parent;
                }
                if (pictures.length) {
                    // 字段名和上游 content.pictures 里的对象一致(见服务端 buildReplyPictures)
                    payload.pictures = pictures.map((p) => ({
                        src: p.src,
                        width: p.width,
                        height: p.height,
                        size: p.size,
                    }));
                }
                const data = await postAction('/api/reply/add', payload);

                clearCommentInput();
                cancelReply();
                // 发送成功才丢附图: 失败时留着,用户改完字数/重试都能直接再发一次
                clearCommentPictures();

                if (target) {
                    showToast('回复成功');
                    // 不能只靠重拉: 楼层回复接口对刚发出的这条有延迟,重拉第一页经常还没有它,
                    // 表现为"回复成功但看不见,刷新才出来"。先把刚发的这条画进列表,
                    // 后续翻页/重拉按 rpid 去重。优先用上游回带的对象(带真实 rpid/时间),没有就本地拼一条
                    const optimistic = data.reply || buildMyReplyItem(data.rpid, message, members);
                    await reloadReplies(target.root);
                    if (optimistic) appendMySubReply(target.root, optimistic);
                } else if (data.reply) {
                    // 主评论: 上游回带了刚发的那条,直接插到列表最前面(置顶评论之前),不用整页重拉
                    const list = document.getElementById('commentList');
                    const emptyEl = list.querySelector('.comment-empty');
                    if (emptyEl) emptyEl.remove();
                    // 记下 rpid: 本次页面会话再拉第一页时靠 seek_rpid 让它继续顶在最前面
                    // (刷新页面/切换排序后记忆清掉,不再强制置顶)
                    saveMyCommentRpid(data.reply.rpid);
                    commentRpids.add(String(data.reply.rpid));
                    list.insertAdjacentHTML('afterbegin', commentItemHTML(data.reply));
                    commentTotal += 1;
                    const countEl = document.getElementById('commentCount');
                    if (countEl) countEl.textContent = `评论 ${commentTotal.toLocaleString()}`;
                    showToast('评论成功');
                } else {
                    // 上游没回带这条评论,只能整页重拉;先记下 rpid,重拉时会带上 seek_rpid,
                    // 保证刚发的这条仍出现在最前面
                    showToast('评论成功');
                    saveMyCommentRpid(data.rpid);
                    loadComments(true);
                }
            } catch (err) {
                if (err.message !== '请先登录') showToast(err.message || '发送失败,请稍后重试');
            } finally {
                btn.disabled = false;
                btn.textContent = oldText;
            }
        }

        /* ----------------------------- 发送弹幕 -----------------------------
         * 播放器自带弹幕输入框(插件的 emitter)在上屏前会先调用 sendDanmakuToBili:
         * 把弹幕提交给上游(走 /api/danmaku/send),成功返回 true 让插件显示在弹幕层,
         * 失败返回 false(插件不显示)并弹一句提示。
         * 时间取当前播放进度(毫秒),颜色/模式来自输入框里用户选的值。
         * -------------------------------------------------------------------- */

        // 插件给的是 "#ffffff" 这种十六进制,B 站要的是十进制整数
        function hexColorToDecimal(color) {
            const hex = String(color || '').replace('#', '').trim();
            return /^[0-9a-fA-F]{6}$/.test(hex) ? parseInt(hex, 16) : 16777215;
        }

        async function sendDanmakuToBili(danmu) {
            if (!isUserLoggedIn) { openLoginModal(); return false; }
            if (!currentCid) { showToast('视频还没加载好,稍后再试'); return false; }

            const text = ((danmu && danmu.text) || '').trim();
            if (!text) return false;

            try {
                await postAction('/api/danmaku/send', {
                    cid: currentCid,
                    bvid: /^BV/i.test(currentVideoId || '') ? currentVideoId : '',
                    msg: text,
                    progress: Math.max(0, Math.round((Number(danmu.time) || 0) * 1000)),
                    color: hexColorToDecimal(danmu.color),
                    mode: Number(danmu.mode) || 0,
                });
                showToast('弹幕已发送');
                return true;
            } catch (err) {
                if (err.message !== '请先登录') showToast(err.message || '弹幕发送失败,请稍后重试');
                return false;
            }
        }

        // reset=true: 切换视频/切换排序时,清空重新拉第一页; reset=false: 滚动到底部时追加下一页
        async function loadComments(reset, mySeq = playSeq) {
            const commentList = document.getElementById('commentList');
            const commentLoadingMore = document.getElementById('commentLoadingMore');
            const commentEndTip = document.getElementById('commentEndTip');
            const commentLoginTip = document.getElementById('commentLoginTip');

            if (commentLoading) return;

            // 没有 aid(比如 /api/info 失败了),没法查评论,直接展示空态
            if (!currentAid) {
                commentList.innerHTML = '<div class="comment-empty">暂无评论</div>';
                commentHasMore = false;
                commentLoadingMore.style.display = 'none';
                commentEndTip.style.display = 'none';
                commentLoginTip.style.display = 'none';
                return;
            }

            if (reset) {
                commentPage = 1;
                commentCursor = 0;
                commentLegacyPaging = false;
                commentRpids = new Set();
                commentLoadedCount = 0;
                commentTotal = 0;
                commentHasMore = false;
                commentList.innerHTML = commentSkeletonHTML(5);
                commentEndTip.style.display = 'none';
                commentLoginTip.style.display = 'none';
            }

            commentLoading = true;
            commentLoadingMore.style.display = reset ? 'none' : 'block';

            try {
                // 新接口按游标翻页(next),只有上一页是兜底老接口时才退回按 pn 翻页
                let url = `/api/reply?oid=${currentAid}&sort=${commentSort}&pn=${commentPage}`;
                if (!commentLegacyPaging) {
                    url += `&next=${commentCursor}`;
                    // 第一页带上自己刚发的那条评论,让它在热门排序下也顶在最前面
                    if (commentCursor === 0 && myCommentRpid) url += `&seek_rpid=${myCommentRpid}`;
                }

                const res = await fetchWithTimeout(url);
                const data = await res.json();
                setJsonResult('reply', data);

                // 站内切视频时(reset=true 那次调用会带上当次的 mySeq),这个响应可能是
                // 上一个视频发出的请求慢悠悠回来的,序号对不上就丢弃,避免把别人的评论
                // 渲染到当前视频下面。finally 里的收尾(重置 commentLoading 等)照常执行。
                if (mySeq !== playSeq) return;

                if (!res.ok) {
                    throw new Error(data.error || `HTTP ${res.status}`);
                }

                commentTotal = data.total || 0;
                document.getElementById('commentCount').textContent =
                    commentTotal > 0 ? `评论 ${commentTotal.toLocaleString()}` : '评论';

                // 置顶评论:只在第一页返回,排在"自己刚发的那条"后面(见下面的顺序说明)。
                // 它的 rpid 先占住去重集合,万一上游在 replies 里又给了一条同样的,
                // 下面 filter 会把它过滤掉
                const topItem = reset && data.top && !deletedRpids.has(String(data.top.rpid)) ? data.top : null;
                if (topItem && topItem.rpid) commentRpids.add(String(topItem.rpid));

                // seek_rpid 会把"我的评论"额外插一条,按 rpid 去重后再渲染
                // (已删除的那条也一并跳过,上游删除生效有延迟)
                const list = (data.list || []).filter((item) => {
                    const key = String(item.rpid);
                    if (!key || deletedRpids.has(key) || commentRpids.has(key)) return false;
                    commentRpids.add(key);
                    return true;
                });
                if (reset) commentList.innerHTML = '';

                // 列表顺序: 自己刚发的那条 → UP/管理员置顶评论 → 其余。
                // 自己那条要排在置顶评论前面,和"刚发完直接插到列表最前面"保持一致:
                // 上游没回带 data.reply 时会走整页重拉,重拉时自己那条虽然被 seek_rpid 顶到
                // replies 的第一位,但置顶评论排得更前,看起来就成了"刚发的评论被压到置顶下面"。
                // 注意不能直接 list.map(commentItemHTML):map 会把下标当第二个参数传进去,
                // 那样除了第一条,后面的评论都会被当成置顶评论带上"置顶"标签
                let mineHTML = '';
                const restHTML = list.map((item) => {
                    if (reset && myCommentRpid && String(item.rpid) === String(myCommentRpid)) {
                        mineHTML = commentItemHTML(item);
                        return '';
                    }
                    return commentItemHTML(item);
                }).join('');

                const html = mineHTML + (topItem ? commentItemHTML(topItem, true) : '') + restHTML;

                if (reset && !html) {
                    commentList.innerHTML = '<div class="comment-empty">暂无评论,快来抢沙发吧</div>';
                } else if (html) {
                    commentList.insertAdjacentHTML('beforeend', html);
                }

                commentLoadedCount += list.length;
                commentPage += 1;
                commentLegacyPaging = !!data.fallback;
                if (typeof data.next === 'number' && !data.fallback) commentCursor = data.next;

                // isEnd 是上游给的"到底了"标记(兜底老接口那页没有,自己算);
                // 再跟总数比一下,防止上游游标给错时无限翻页
                commentHasMore = list.length > 0 && !data.isEnd && commentLoadedCount < commentTotal;
                commentEndTip.style.display = (!commentHasMore && commentLoadedCount > 0) ? 'block' : 'none';
                // 未登录时上游会把能返回的评论数卡在很小的上限
                updateCommentLoginTip();
            } catch (err) {
                console.warn('评论加载失败:', err);
                setJsonResult('reply', { error: err.message });
                if (reset) {
                    commentList.innerHTML = `<div class="comment-error">评论加载失败: ${err.message}</div>`;
                }
                // 加载失败时保留 commentHasMore,方便用户滚动重试,而不是把已加载的评论清空
            } finally {
                commentLoading = false;
                commentLoadingMore.style.display = 'none';
                // 页面/评论区还没被撑满时滚动条不会触发 scroll,这里主动检查一次,让内容持续填满可视区域
                requestAnimationFrame(maybeLoadMoreComments);
            }
        }

        // 滚动到评论区底部附近时自动加载下一页
        function maybeLoadMoreComments() {
            if (commentLoading || !commentHasMore || !currentAid) return;

            const sentinel = document.getElementById('commentSentinel');
            if (!sentinel) return;

            const rect = sentinel.getBoundingClientRect();
            // 提前 300px 触发,接近"无缝流式加载"
            if (rect.top <= window.innerHeight + 300) {
                loadComments(false);
            }
        }

        window.addEventListener('scroll', maybeLoadMoreComments, { passive: true });
        window.addEventListener('resize', maybeLoadMoreComments);

        // 未登录时评论区只能看到前几条,底部换成"登录后查看更多评论"提示而不是"没有更多评论了"。
        // 判断依据不能是 commentTotal: 未登录时上游连这个总数字段都会裁剪、不可信。
        // 所以只要没登录、又翻不出下一页,就当作被匿名限制挡住
        function updateCommentLoginTip() {
            const loginTip = document.getElementById('commentLoginTip');
            const endTip = document.getElementById('commentEndTip');
            if (!loginTip || !endTip) return;

            if (commentLoadedCount === 0 || commentHasMore) {
                loginTip.style.display = 'none';
                return;
            }

            loginTip.style.display = isUserLoggedIn ? 'none' : 'block';
            if (!isUserLoggedIn) endTip.style.display = 'none';
        }

        document.getElementById('commentSort').addEventListener('click', (e) => {
            const btn = e.target.closest('.comment-sort-btn');
            if (!btn || btn.classList.contains('active')) return;

            // 未登录点"按时间"直接弹登录二维码,不真的切排序
            if (btn.dataset.sort === '0' && !isUserLoggedIn) {
                openLoginModal();
                return;
            }

            document.querySelectorAll('.comment-sort-btn').forEach((el) => {
                el.classList.toggle('active', el === btn);
            });
            commentSort = btn.dataset.sort;
            // 换排序就放弃强制置顶: 自己刚发的那条不再靠 seek_rpid 顶在最前面,交给排序正常排位
            forgetMyCommentRpid();
            loadComments(true);
        });

        /* ------------------------ 评论附图:点击查看大图 ------------------------ */

        // 这次预览能左右切换的图片列表和当前下标;只覆盖同一条评论里的图,关掉浮层就清空
        let commentImgList = [];
        let commentImgIndex = 0;

        // 缩略图点开后铺一层全屏遮罩看原图,点遮罩或按 Esc(见下面的 keydown)关闭
        function openCommentImage(pic) {
            // 同一条评论的图同属一个 .comment-pics,按 DOM 顺序当作切换列表
            const pics = [...pic.closest('.comment-pics').querySelectorAll('.comment-pic')];
            commentImgList = pics.map((el) => el.src);
            commentImgIndex = pics.indexOf(pic);
            document.getElementById('commentImgMask').classList.add('show');
            showCommentImage();
        }

        // 上一张/下一张,到头绕回另一端
        function stepCommentImage(step) {
            if (commentImgList.length < 2) return;
            commentImgIndex = (commentImgIndex + step + commentImgList.length) % commentImgList.length;
            showCommentImage();
        }

        // 原图尺寸 ÷ 适应窗口后的尺寸:<= 1 说明这张图本来就没超出可视区域,没得放大
        function commentImageFullScale() {
            const img = document.getElementById('commentImgFull');
            return img.naturalWidth && img.offsetWidth ? img.naturalWidth / img.offsetWidth : 1;
        }

        // 加载完才知道要不要给放大:不用放大的那张,光标提示成"退出预览"(见 .is-small)
        document.getElementById('commentImgFull').addEventListener('load', (e) => {
            e.currentTarget.classList.toggle('is-small', commentImageFullScale() <= 1);
        });

        // 点图片本身:能放大就切换放大/恢复(焦点是点击的位置),本来就放不了大的就直接退出预览
        function toggleCommentImageZoom(e) {
            // 拖动结束紧跟的那次 click 不算"点一下",否则刚拖完就把缩放切回去了
            if (commentImgDragged) return;
            const img = document.getElementById('commentImgFull');
            const full = commentImageFullScale();
            if (full <= 1) {
                closeCommentImage();
                return;
            }
            // 过渡只该发生在切换缩放的这一刻,先把"瞬时"去掉,再改 transform
            img.classList.remove('is-instant');
            if (document.getElementById('commentImgMask').classList.toggle('is-zoomed')) {
                // 此刻还没有 transform,量到的就是适应窗口下的位置
                const box = img.getBoundingClientRect();
                commentImgScale = Math.min(full, commentImgMaxZoom);
                // 点击点相对图片中心的偏移,缩放后会跑到 k 倍处,补一个 (1-k) 倍的位移把它按回原地
                const dx = e.clientX - (box.left + box.width / 2);
                const dy = e.clientY - (box.top + box.height / 2);
                commentImgFocus = { x: dx * (1 - commentImgScale), y: dy * (1 - commentImgScale) };
                // 从图片靠边的位置放大时,上面这个补偿可能把图片推出贴边范围,先按边界收一下
                commentImgPan = clampCommentImagePan({ x: 0, y: 0 }, 0);
            } else {
                commentImgScale = 1;
                commentImgFocus = { x: 0, y: 0 };
                commentImgPan = { x: 0, y: 0 };
            }
            applyCommentImageTransform();
        }

        function showCommentImage() {
            const multi = commentImgList.length > 1;
            const mask = document.getElementById('commentImgMask');
            mask.classList.toggle('is-multi', multi);
            // 换图就回到适应窗口,不把上一张的缩放和位置带过来
            mask.classList.remove('is-zoomed');
            resetCommentImageTransform();
            document.getElementById('commentImgFull').src = commentImgList[commentImgIndex] || '';
            document.getElementById('commentImgCount').textContent = multi ? `${commentImgIndex + 1}/${commentImgList.length}` : '';
        }

        function closeCommentImage() {
            // 在空白处拖动图片,松手紧跟的那次 click 不算"点空白关闭",否则刚拖完浮层就没了
            if (commentImgDragged) return;
            const mask = document.getElementById('commentImgMask');
            if (!mask.classList.contains('show')) return;
            // 缩放位置和 src 一样都留到下次打开时再复位(见 showCommentImage):
            // 现在复位的话,浮层还在淡出就会闪一下恢复成适应窗口大小的图片
            mask.classList.remove('show');
            commentImgList = [];
            commentImgIndex = 0;
        }

        // 放大态的位置 = 拖拽/滚轮的位移 + 缩放焦点补偿
        let commentImgPan = { x: 0, y: 0 };
        let commentImgFocus = { x: 0, y: 0 };
        let commentImgScale = 1;
        let commentImgDrag = null;
        let commentImgDragged = false;
        // 越界后只跟手这么多,拖起来才有阻尼感(松手由 settleCommentImagePan 收回贴边)
        const commentImgDamping = 0.3;
        // 最大放大倍数:长图按"原图尺寸"放大能到七八倍,封个顶,手感接近官网
        const commentImgMaxZoom = 3;

        function applyCommentImageTransform() {
            const x = commentImgPan.x + commentImgFocus.x;
            const y = commentImgPan.y + commentImgFocus.y;
            document.getElementById('commentImgFull').style.transform =
                `translate(${x}px, ${y}px) scale(${commentImgScale})`;
        }

        // 位移的极限:图片比视口大时最远只能挪到贴边(图片边缘对齐屏幕边缘,图片中心最多偏出 (图-屏)/2);
        // 图片比视口小时它本来就全在屏幕里,只能停在居中
        function commentImageLimit() {
            const img = document.getElementById('commentImgFull');
            const w = img.offsetWidth * commentImgScale;
            const h = img.offsetHeight * commentImgScale;
            return {
                x: Math.max(0, (w - commentImgViewport.clientWidth) / 2),
                y: Math.max(0, (h - commentImgViewport.clientHeight) / 2),
            };
        }

        // 把位移收进贴边范围:超出贴边的部分按 damping 衰减(0 就是硬边界,滚轮和回位都用它)
        function clampCommentImagePan(pan, damping) {
            const limit = commentImageLimit();
            // 实际位移是"焦点补偿 + 拖拽位移",所以边界按总和算,再换算回拖拽位移
            const axis = (value, focus, max) => {
                const total = value + focus;
                const over = Math.abs(total) - max;
                const kept = over > 0 ? Math.sign(total) * (max + over * damping) : total;
                return kept - focus;
            };
            return {
                x: axis(pan.x, commentImgFocus.x, limit.x),
                y: axis(pan.y, commentImgFocus.y, limit.y),
            };
        }

        // 松手后越界了(拖拽是不限越界的)就平滑退回贴边位置:去掉"瞬时"让 transform 走过渡
        function settleCommentImagePan() {
            const settled = clampCommentImagePan(commentImgPan, 0);
            if (settled.x === commentImgPan.x && settled.y === commentImgPan.y) return;
            document.getElementById('commentImgFull').classList.remove('is-instant');
            commentImgPan = settled;
            applyCommentImageTransform();
        }

        function resetCommentImageTransform() {
            document.getElementById('commentImgFull').classList.add('is-instant');
            commentImgDrag = null;
            commentImgDragged = false;
            commentImgPan = { x: 0, y: 0 };
            commentImgFocus = { x: 0, y: 0 };
            commentImgScale = 1;
            applyCommentImageTransform();
        }

        // 预览期间不让播放页跟着滚(wheel 要 non-passive 才能 preventDefault);
        // 放大后滚轮改成滚动图片本身,滚轮一点越界都不给,到头就停住
        document.getElementById('commentImgMask').addEventListener('wheel', (e) => {
            e.preventDefault();
            if (!document.getElementById('commentImgMask').classList.contains('is-zoomed')) return;
            document.getElementById('commentImgFull').classList.add('is-instant');
            commentImgPan = clampCommentImagePan(
                { x: commentImgPan.x - e.deltaX, y: commentImgPan.y - e.deltaY }, 0);
            applyCommentImageTransform();
        }, { passive: false });

        // 放大后按住浮层里任何地方都能拖动图片(包括空白处);
        // 只"点一下"没拖动时,空白处仍是关闭、图片上仍是切换缩放
        const commentImgViewport = document.querySelector('.comment-img-viewport');
        commentImgViewport.addEventListener('pointerdown', (e) => {
            if (!document.getElementById('commentImgMask').classList.contains('is-zoomed')) return;
            document.getElementById('commentImgFull').classList.add('is-instant');
            commentImgDrag = {
                x: e.clientX,
                y: e.clientY,
                panX: commentImgPan.x,
                panY: commentImgPan.y,
                // 手指比鼠标抖得多,阈值放宽一点,否则"点一下"容易被判成拖动
                threshold: e.pointerType === 'touch' ? 10 : 5,
            };
            commentImgDragged = false;
        });

        document.addEventListener('pointermove', (e) => {
            if (!commentImgDrag) return;
            const dx = e.clientX - commentImgDrag.x;
            const dy = e.clientY - commentImgDrag.y;
            // 位移超过这个阈值才算"拖动",否则松手时按"点一下"处理(关闭浮层/切换缩放)
            if (Math.abs(dx) > commentImgDrag.threshold || Math.abs(dy) > commentImgDrag.threshold) {
                commentImgDragged = true;
            }
            // 拖拽不设硬边界,越界部分按阻尼衰减,松手后由 settleCommentImagePan 收回贴边位置
            commentImgPan = clampCommentImagePan(
                { x: commentImgDrag.panX + dx, y: commentImgDrag.panY + dy }, commentImgDamping);
            applyCommentImageTransform();
        });

        // click 紧跟 pointerup 同步派发,标记留到 setTimeout 里再清:
        // 既能吃掉这次 click,也不会让下一次真正的点击被误吞
        document.addEventListener('pointerup', () => {
            if (!commentImgDrag) return;
            commentImgDrag = null;
            settleCommentImagePan();
            setTimeout(() => { commentImgDragged = false; }, 0);
        });
        document.addEventListener('pointercancel', () => {
            commentImgDrag = null;
            commentImgDragged = false;
            settleCommentImagePan();
        });

        // 旋屏/窗口尺寸变了,贴边边界跟着变,把越界的部分按新边界收回(触摸端转屏后靠它复位)
        window.addEventListener('resize', () => {
            if (!document.getElementById('commentImgMask').classList.contains('show')) return;
            settleCommentImagePan();
        });

        /* ----------------------------- 评论表情面板 -----------------------------
         * 数据源: /api/emote/panel(服务端转 x/emote/user/panel/web,business=reply)。
         * 表情包只在第一次打开面板时拉一次;点某个表情就插进输入框(见 insertCommentEmoji):
         * 图片表情插成 <img>,颜文字插原文,发出去的正文里存的是对应的 "[表情名]" 占位符。
         * -------------------------------------------------------------------- */

        const commentInput = document.getElementById('commentInput');
        const commentEmojiPanel = document.getElementById('commentEmojiPanel');
        const commentEditorPics = document.getElementById('commentEditorPics');
        let emotePackages = null; // null = 还没拉过
        let emotePackageIndex = 0;
        let emoteOwnerMid = null; // 缓存属于哪个账号: 换账号后作废(见 renderLoginSlot)
        let emoteMap = {};        // 表情名(不带方括号) -> { url, size },给刚发出去的那条补渲染用

        async function loadEmotePackages() {
            const res = await fetchWithTimeout('/api/emote/panel');
            const data = await res.json().catch(() => ({}));
            if (res.status === 401) { openLoginModal(); throw new Error('请先登录'); }
            if (!res.ok) throw new Error(data.error || '表情加载失败');

            emotePackages = data.packages || [];
            emoteMap = {};
            for (const pkg of emotePackages) {
                for (const e of pkg.emotes) {
                    // 颜文字没有图片地址,是纯文本,不需要进图片映射
                    if (!e.url) continue;
                    const name = e.text.replace(/^\[|\]$/g, '');
                    if (name && !emoteMap[name]) emoteMap[name] = { url: e.url, size: e.size };
                }
            }
        }

        // 多表情包时上面一排包图标当页签(只有一个包就不显示),下面是对应表情的网格
        function renderEmotePanel() {
            const pkg = emotePackages[emotePackageIndex] || emotePackages[0];
            if (!pkg) {
                commentEmojiPanel.innerHTML = '<p class="comment-emoji-empty">暂时没有可用的表情</p>';
                return;
            }

            const tabs = emotePackages.length > 1 ? `<div class="comment-emoji-tabs">${
                emotePackages.map((p, i) => {
                    // 页签用包的标志图;万一上游没给,退回包里第一个图片表情(颜文字包整包没有图片)
                    const icon = p.icon || (p.emotes.find((e) => e.url) || {}).url || '';
                    return `
                    <button class="comment-emoji-tab${i === emotePackageIndex ? ' active' : ''}" type="button"
                            data-emote-package="${i}" title="${escapeHtml(p.name)}">
                        ${icon ? `<img src="${escapeHtml(icon)}" alt="" loading="lazy" referrerpolicy="no-referrer" />` : ''}
                    </button>`;
                }).join('')
            }</div>` : '';

            // 颜文字包没有图片地址,整包按文本格子渲染;图片表情按包尺寸分行(小的一行 10 个,大的一行 5 个)
            const gridClass = !pkg.emotes[0].url ? 'is-text' : (pkg.size === 2 ? 'is-big' : 'is-small');
            const grid = pkg.emotes.map((e) => `
                <button class="comment-emoji-item${e.url ? '' : ' is-text'}" type="button"
                        data-emote-text="${escapeHtml(e.text)}"${e.url ? ` data-emote-url="${escapeHtml(e.url)}"` : ''}
                        title="${escapeHtml(e.text)}">
                    ${e.url ? `<img src="${escapeHtml(e.url)}" alt="${escapeHtml(e.text)}" loading="lazy" referrerpolicy="no-referrer" />` : escapeHtml(e.text)}
                </button>`).join('');

            commentEmojiPanel.innerHTML = tabs + `<div class="comment-emoji-grid ${gridClass}">${grid}</div>`;
        }

        // 打开/收起面板(表情与 @ 候选共用)。内容没变就不重画,免得每次输入都重建 DOM
        function showCommentPanel(mode) {
            if (commentEmojiPanel.classList.contains('show') && commentEmojiPanel.dataset.mode === mode) return;
            commentEmojiPanel.dataset.mode = mode;
            commentEmojiPanel.classList.add('show');
            // 换了内容就作废 @ 候选: 面板切到表情后,上下键/回车不该再去动 @ 候选
            mentionItems = [];
            mentionActive = -1;
        }

        function closeCommentPanel() {
