            if (!commentEmojiPanel.classList.contains('show')) return;
            commentEmojiPanel.classList.remove('show');
            // 收起时把 @ 候选一起丢掉,并让在途的搜索结果作废:
            // 光标已经不在那段关键字上了,留下的旧候选会让下一次回车插错内容
            mentionItems = [];
            mentionActive = -1;
            mentionSeq++;
        }

        async function toggleEmotePanel() {
            if (commentEmojiPanel.classList.contains('show') && commentEmojiPanel.dataset.mode === 'emote') {
                closeCommentPanel();
                return;
            }
            if (!isUserLoggedIn) { openLoginModal(); return; }

            showCommentPanel('emote');
            if (emotePackages) { renderEmotePanel(); return; }

            commentEmojiPanel.innerHTML = '<p class="comment-emoji-empty">加载中…</p>';
            try {
                await loadEmotePackages();
                renderEmotePanel();
            } catch (err) {
                closeCommentPanel();
                if (err.message !== '请先登录') showToast(err.message || '表情加载失败,请稍后重试');
            }
        }

        /* ----------------------------- @ 提及候选列表 -----------------------------
         * 数据源: /api/reply/at(服务端转 x/polymer/web-dynamic/v1/mention/search),
         * 也是和表情面板共用一个浮层,靠 data-mode 区分内容。
         * 触发: 点 @ 按钮,或者在输入框里打 "@" + 关键字(见 updateMentionPanel)。
         * 插入的是原子节点(见 confirmMention),提交时由 readCommentInput 还原成 "@昵称"。
         * 位置一律不缓存: 要用的时候从当前选区现算(见 getMentionContext)。
         * -------------------------------------------------------------------- */

        let mentionItems = [];    // 当前候选
        let mentionActive = -1;   // 键盘选中的下标(鼠标悬停同时改它,两套操作共用一份高亮)
        let mentionSeq = 0;       // 请求序号: 慢的旧结果回来时不许覆盖新结果
        let mentionTimer = null;  // 输入防抖

        function renderMentionPanel() {
            if (!mentionItems.length) {
                commentEmojiPanel.innerHTML = '<p class="comment-emoji-empty">没有可 @ 的人</p>';
                return;
            }
            // 上游按"最近联系/我的关注/其他"分组返回,分组名当小标题插在该组第一项之前
            const html = mentionItems.map((it, i) => {
                const head = it.group && (i === 0 || mentionItems[i - 1].group !== it.group)
                    ? `<div class="comment-at-group">${escapeHtml(it.group)}</div>` : '';
                return `${head}<button class="comment-at-item${i === mentionActive ? ' active' : ''}" type="button"
                        data-at-index="${i}" title="${escapeHtml(it.name)}">
                    <span class="comment-at-avatar">${it.avatar ? `<img src="${escapeHtml(it.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer" />` : ''}</span>
                    <span class="comment-at-info">
                        <span class="comment-at-name">${escapeHtml(it.name)}</span>
                        ${it.followed || it.verify || it.fans ? `<span class="comment-at-meta">
                            ${it.fans ? `<span class="comment-at-fans">${formatRelatedCount(it.fans)}粉丝</span>` : ''}
                            ${it.followed ? '<span class="comment-at-tag">关注</span>' : ''}
                            ${it.verify ? '<span class="comment-at-tag">认证</span>' : ''}
                        </span>` : ''}
                    </span>
                </button>`;
            }).join('');
            commentEmojiPanel.innerHTML = `<div class="comment-at-list">${html}</div>`;
        }

        // 只挪高亮,不重建列表: 重建会把滚动位置带回到顶部(鼠标划过一行就跳一下)
        function highlightMentionItem(index) {
            if (index === mentionActive) return;
            mentionActive = index;
            for (const el of commentEmojiPanel.querySelectorAll('.comment-at-item')) {
                el.classList.toggle('active', Number(el.dataset.atIndex) === index);
            }
        }

        // 在面板里查找用户。keyword 为空时上游回的是"最近联系"+"我的关注",就是面板的初始候选
        async function searchMention(keyword) {
            if (!isUserLoggedIn) { openLoginModal(); return; }
            showCommentPanel('at');
            // 只有这次查询之后拿到的结果才算数: 在途的旧结果同样要作废
            const seq = ++mentionSeq;

            commentEmojiPanel.innerHTML = `<p class="comment-emoji-empty">${keyword ? '搜索中…' : '加载中…'}</p>`;
            try {
                const res = await fetchWithTimeout(`/api/reply/at?keyword=${encodeURIComponent(keyword)}`);
                const data = await res.json().catch(() => ({}));
                if (seq !== mentionSeq) return; // 已经有更新的一次输入,这次结果作废
                if (res.status === 401) { openLoginModal(); throw new Error('请先登录'); }
                if (!res.ok) throw new Error(data.message || '@ 搜索失败');

                mentionItems = data.list || [];
                mentionActive = mentionItems.length ? 0 : -1;
                renderMentionPanel();
            } catch (err) {
                if (seq !== mentionSeq) return;
                mentionItems = [];
                mentionActive = -1;
                commentEmojiPanel.innerHTML = `<p class="comment-emoji-empty">${escapeHtml(err.message || '@ 搜索失败')}</p>`;
                if (err.message !== '请先登录') showToast(err.message || '@ 搜索失败,请稍后重试');
            }
        }

        /* --------------------- @ 提及: 检测与替换 ---------------------
         * 这里只做一件事: 从当前选区往前找 "@关键字",给出它的范围和关键字。
         * 光标位置、选区、撤销栈全部交给浏览器管理,不维护字符偏移量,也不缓存范围
         * ——缓存的那份会随光标移走而失效,要用的时候现算
         * -------------------------------------------------------------------- */

        // 光标前是不是 "…@关键字": 是就返回 { range, keyword },否则 null。
        // "@" 到光标之间不能有空白和第二个 "@",所以关键字就是紧挨着光标的那一段
        function getMentionContext() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return null;
            const range = sel.getRangeAt(0);
            if (!range.collapsed || range.startContainer.nodeType !== Node.TEXT_NODE) return null;
            if (!commentInput.contains(range.startContainer)) return null;

            const node = range.startContainer;
            const beforeCaret = node.nodeValue.slice(0, range.startOffset);
            const keyword = (beforeCaret.match(/[^\s@]*$/) || [''])[0];
            const atIndex = beforeCaret.length - keyword.length - 1;
            if (atIndex < 0 || beforeCaret[atIndex] !== '@') return null;

            const atRange = document.createRange();
            atRange.setStart(node, atIndex);
            atRange.setEnd(node, range.startOffset);
            return { range: atRange, keyword };
        }

        // 输入框里的每一次改动都过这里: 光标前是 "…@关键字" 就查候选并打开面板,否则收起面板。
        // 只收 @ 候选面板: 表情面板靠点击开关,而插表情同样会触发 input,不能顺手把它关掉
        function updateMentionPanel() {
            const ctx = getMentionContext();
            if (!ctx) {
                if (commentEmojiPanel.dataset.mode === 'at') closeCommentPanel();
                return;
            }
            clearTimeout(mentionTimer);
            // 刚敲下 "@" 时关键字还是空的: 立刻拉初始候选(最近联系/我的关注),有关键字才防抖
            if (!ctx.keyword) { searchMention(''); return; }
            mentionTimer = setTimeout(() => searchMention(ctx.keyword), 250);
        }

        // 唯一的插入出口: 内容一律交给浏览器的编辑命令插到光标处,直接改 DOM 的插入进不了撤销栈(Ctrl+Z 撤不回)。
        // execCommand 虽然被标成废弃,但它是目前唯一能让插入动作进入浏览器撤销栈的接口
        // (Ctrl+Z 能一路退回)
        function insertAtCaret(content, asText) {
            focusCommentInputAtEnd();
            document.execCommand(asText ? 'insertText' : 'insertHTML', false, content);
        }

        // 输入框还没聚焦过时插入: 把光标摆到末尾,别插到开头去
        function focusCommentInputAtEnd() {
            if (commentInput.contains(document.activeElement)) return;
            commentInput.focus();
            const range = document.createRange();
            range.selectNodeContents(commentInput);
            range.collapse(false);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }

        // 点 @ 按钮: 光标处补一个 "@",插入触发的 input 事件会打开候选面板(和直接敲 "@" 同一条路)
        function startMention() {
            if (!isUserLoggedIn) { openLoginModal(); return; }
            insertAtCaret('@');
        }

        // 选中的候选插到输入框: 把光标前那段 "@关键字" 换成原子节点,后面补一个空格。
        // 空格不能省 —— @ 块是不可编辑的内联元素,它落在内容末尾时光标就没有合法落点了,
        // 补一个空格等于给光标留了落脚处(顺带把正文和人名分开)
        function confirmMention() {
            const it = mentionItems[mentionActive];
            if (!it) return;

            // 先聚焦再算范围(顺序反了的话,输入框失焦时 focus 会把选区重置回原位),
            // 范围本身按下的这一刻现算: 期间光标可能已经移走,缓存的范围会指向错误的位置
            commentInput.focus();
            const ctx = getMentionContext();
            if (ctx) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(ctx.range);
            }

            insertAtCaret(`<span class="comment-at-text" contenteditable="false"`
                + ` data-at-mid="${escapeHtml(it.mid)}" data-at-name="${escapeHtml(it.name)}"`
                + `>@${escapeHtml(it.name)}</span> `);
            closeCommentPanel();
        }

        /* ------------------- 评论输入框(取内容 / 插表情 / 清空) -------------------
         * 输入框是 contenteditable: 表情在里面是一张 <img>,@ 到的人是一个原子节点
         * (都带着原始文本),提交前由 readCommentInput 再拼回 "[表情名]" "@昵称" 的纯文本,
         * 和拉回来的评论走同一条渲染路径。
         * -------------------------------------------------------------------- */

        // 返回 { message, members }: members 是正文里 @ 到的人(mid + 昵称),
        // 提交时一并带上;昵称取自节点而不是重新解析正文,人名里带空格也不会认错
        function readCommentInput() {
            let out = '';
            const members = [];
            const seen = new Set();
            const walk = (parent) => {
                for (const node of parent.childNodes) {
                    if (node.nodeType === Node.TEXT_NODE) out += node.nodeValue;
                    else if (node.nodeName === 'IMG') out += node.dataset.emoteText || '';
                    else if (node.nodeName === 'BR') out += '\n';
                    else {
                        if (node.dataset && node.dataset.atMid && !seen.has(node.dataset.atMid)) {
                            seen.add(node.dataset.atMid);
                            members.push({ mid: node.dataset.atMid, uname: node.dataset.atName || '' });
                        }
                        walk(node);
                        // 粘贴/回车兜底:浏览器自动包的段落算一次换行
                        if (node.nodeName === 'DIV' || node.nodeName === 'P') out += '\n';
                    }
                }
            };
            walk(commentInput);
            return { message: out, members };
        }

        function clearCommentInput() {
            commentInput.innerHTML = '';
        }

        // 删光内容后浏览器会留下一个空 <br>,会让 :empty 的占位提示失效,顺手清掉
        function normalizeCommentInput() {
            if (commentInput.innerHTML === '<br>') commentInput.innerHTML = '';
        }

        // 图片表情插 <img>(框里看到的是图);颜文字包的纯文本表情直接插文本
        function insertCommentEmoji(btn) {
            const text = btn.dataset.emoteText;
            if (!btn.dataset.emoteUrl) { insertAtCaret(text, true); return; }

            insertAtCaret(`<img class="comment-emoji" src="${escapeHtml(btn.dataset.emoteUrl)}"`
                + ` alt="${escapeHtml(text)}" data-emote-text="${escapeHtml(text)}" referrerpolicy="no-referrer" />`);
        }

        // 正文里实际用到的表情(结构和上游 mapReplyEmoji 一致),只给 buildMyReplyItem 兜底:
        // 上游没回带刚发的那条回复时,靠它先把表情画出来,而不是露着 "[doge]" 原文
        function usedEmoteMap(message) {
            const out = {};
            for (const [name, e] of Object.entries(emoteMap)) {
                if (message.includes(`[${name}]`)) out[name] = e;
            }
            return out;
        }

        /* ----------------------------- 评论附图(发评论侧) -----------------------------
         * 数据源: /api/reply/upload(服务端转 x/dynamic/feed/draw/upload_bfs)。
         * 流程和表情面板一样是"先攒本地状态,发送时才提交": 选中的图片上传成功后进
         * commentPictures,提交时随正文一起发给 /api/reply/add 的 pictures 参数。
         * 上传中/失败的项也在列表里(占位或可删),不会出现"点了没反应"。
         * -------------------------------------------------------------------- */

        const commentPictures = []; // [{src,width,height,size}],发送成功后清空
        const COMMENT_PIC_MAX = 9;

        function renderCommentPictures() {
            commentEditorPics.innerHTML = commentPictures.map((pic, i) => `
                <div class="comment-editor-pic${pic.uploading ? ' is-loading' : ''}${pic.failed ? ' is-failed' : ''}">
                    ${pic.src ? `<img src="${escapeHtml(pic.src)}" alt="" referrerpolicy="no-referrer" />` : ''}
                    <span class="comment-editor-pic-tip">${pic.failed ? '上传失败' : '上传中…'}</span>
                    <button class="comment-editor-pic-del" type="button" data-pic-index="${i}" title="移除">×</button>
                </div>`).join('');
        }

        function clearCommentPictures() {
            commentPictures.length = 0;
            renderCommentPictures();
        }

        // 提交时用的附图参数(只带上传成功的那些)
        function readyCommentPictures() {
            return commentPictures.filter((p) => p.src && !p.failed);
        }

        function removeCommentPicture(index) {
            if (index < 0 || index >= commentPictures.length) return;
            commentPictures.splice(index, 1);
            renderCommentPictures();
        }

        const COMMENT_PIC_UPLOAD_TIMEOUT_MS = 30000; // 上传要传整张图,比普通接口多给一倍余量

        async function uploadCommentPicture(file) {
            const entry = { src: '', width: 0, height: 0, size: 0, uploading: true, failed: false };
            commentPictures.push(entry);
            renderCommentPictures();

            try {
                // 图片二进制原样 POST,Content-Type 交给浏览器按文件类型带,服务端据此校验
                const res = await fetchWithTimeout(
                    '/api/reply/upload',
                    { method: 'POST', body: file },
                    COMMENT_PIC_UPLOAD_TIMEOUT_MS
                );
                const data = await res.json().catch(() => ({}));
                if (res.status === 401) { openLoginModal(); throw new Error('请先登录'); }
                if (!res.ok) throw new Error(data.message || '图片上传失败');

                // 缩略图直接用上游返回的地址(也就是最终提交的地址)
                entry.src = data.url;
                entry.width = data.width || 0;
                entry.height = data.height || 0;
                entry.size = data.size || 0;
            } catch (err) {
                entry.failed = true;
                if (err.message !== '请先登录') showToast(err.message || '图片上传失败,请稍后重试');
            } finally {
                entry.uploading = false;
                renderCommentPictures();
            }
        }

        // 选图: 一次可以多选,受 COMMENT_PIC_MAX 上限约束(和 B 站一样一条评论最多 9 张)。
        // 数的是列表里的总条数(含上传中和上传失败的),不对整个选择做取舍,只逐个收下放得进的
        function pickCommentPictures(files) {
            if (!isUserLoggedIn) { openLoginModal(); return; }
            for (const file of files) {
                if (commentPictures.length >= COMMENT_PIC_MAX) {
                    showToast(`一条评论最多 ${COMMENT_PIC_MAX} 张图片`);
                    break;
                }
                if (!/^image\/(png|jpeg|gif)$/.test(file.type)) {
                    showToast('只支持 jpg / png / gif 图片');
                    continue;
                }
                uploadCommentPicture(file);
            }
        }

        /* ----------------------------- 评论输入框的交互 ----------------------------- */

        // 评论列表里的"点赞""回复""删除"用事件委托处理(列表内容是动态插进去的)
        document.getElementById('commentList').addEventListener('click', (e) => {
            const pic = e.target.closest('.comment-pic');
            if (pic) {
                openCommentImage(pic);
                return;
            }
            const likeBtn = e.target.closest('[data-like-rpid]');
            if (likeBtn) {
                toggleCommentLike(likeBtn);
                return;
            }
            const delBtn = e.target.closest('[data-del-rpid]');
            if (delBtn) {
                deleteComment(delBtn);
                return;
            }
            const replyBtn = e.target.closest('[data-reply-root]');
            if (replyBtn) startReply(replyBtn.dataset);
        });

        document.getElementById('commentSendBtn').addEventListener('click', sendComment);

        document.getElementById('commentReplyCancel').addEventListener('click', cancelReply);

        // 未登录时点输入框直接弹扫码登录,别让人白写一段再发现发不出去
        commentInput.addEventListener('focus', () => {
            if (isUserLoggedIn) return;
            commentInput.blur();
            openLoginModal();
        });

        // 内容删光后清掉浏览器留下的空 <br>,占位提示才会回来(CSS 的 :empty)。
        // 再按光标前的文本决定 @ 候选面板开还是关(打字、删除、撤销都会走到这里)
        commentInput.addEventListener('input', () => {
            normalizeCommentInput();
            updateMentionPanel();
        });

        // 只收纯文本粘贴: 直接贴 HTML 会把外来的标签/样式带进输入框
        commentInput.addEventListener('paste', (e) => {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text/plain');
            if (text) insertAtCaret(text, true);
        });

        // @ 候选面板开着时,上下键移动、回车选中候选,别让光标跳走或插一个换行。
        // 输入法组词中(isComposing)的回车是"选词",不能拦,否则中文无法上屏。
        // 其余按键(退格删 @ 块、Ctrl+Z 撤销等)一律交给浏览器处理,自己拦就要自己维护光标和撤销栈
        commentInput.addEventListener('keydown', (e) => {
            if (e.isComposing) return;
            if (!mentionItems.length || !commentEmojiPanel.classList.contains('show')) return;
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                highlightMentionItem((mentionActive + (e.key === 'ArrowDown' ? 1 : -1) + mentionItems.length) % mentionItems.length);
            } else if (e.key === 'Enter') {
                // 光标已经离开那段关键字(点了输入框别处/左右键挪走): 面板收起,回车还给换行
                if (!getMentionContext()) { closeCommentPanel(); return; }
                e.preventDefault();
                confirmMention();
            }
        });

        // 表情按钮:再点一次收起;页面其它地方的点击也收起面板
        document.getElementById('commentEmojiBtn').addEventListener('click', toggleEmotePanel);

        // @ 按钮:光标处补一个 "@",面板直接打开
        document.getElementById('commentAtBtn').addEventListener('click', startMention);

        // 图片按钮:转交隐藏的 file input(清空 value,同一个文件连选两次也能触发 change)
        const commentPicInput = document.getElementById('commentPicInput');
        document.getElementById('commentPicBtn').addEventListener('click', () => {
            if (!isUserLoggedIn) { openLoginModal(); return; }
            commentPicInput.value = '';
            commentPicInput.click();
        });
        commentPicInput.addEventListener('change', () => pickCommentPictures([...commentPicInput.files]));

        // 缩略图上的"移除": 上传中的那张也能删(请求不中断,回来时条目已经不在了)
        commentEditorPics.addEventListener('click', (e) => {
            const del = e.target.closest('[data-pic-index]');
            if (del) removeCommentPicture(Number(del.dataset.picIndex));
        });

        // 表情按钮/表情项/页签/@ 候选按下时不让输入框失焦: 光标留在原地,内容才插得回用户点的位置,
        // 插入也才走得通浏览器的编辑命令(见 insertAtCaret)。
        // 只在这些可点元素上 preventDefault: 面板空白处、网格滚动条不拦,免得影响滚动条拖动
        const keepCommentInputFocus = (e) => {
            if (e.target.closest('.comment-at-item, .comment-emoji-item, .comment-emoji-tab, #commentEmojiBtn, #commentAtBtn')) {
                e.preventDefault();
            }
        };
        document.getElementById('commentEmojiBtn').addEventListener('mousedown', keepCommentInputFocus);
        document.getElementById('commentAtBtn').addEventListener('mousedown', keepCommentInputFocus);
        commentEmojiPanel.addEventListener('mousedown', keepCommentInputFocus);

        // 面板内的点击一律自己消化(stopPropagation),免得冒到 document 上那条"点面板外面就收起"
        commentEmojiPanel.addEventListener('click', (e) => {
            e.stopPropagation();

            if (commentEmojiPanel.dataset.mode === 'at') {
                const at = e.target.closest('[data-at-index]');
                if (at) {
                    mentionActive = Number(at.dataset.atIndex) || 0;
                    confirmMention();
                }
                return;
            }

            const tab = e.target.closest('[data-emote-package]');
            if (tab) {
                emotePackageIndex = Number(tab.dataset.emotePackage) || 0;
                renderEmotePanel();
                return;
            }
            const item = e.target.closest('[data-emote-text]');
            if (item) insertCommentEmoji(item);
        });

        // 鼠标划过候选时同步高亮: 键盘和鼠标共用 mentionActive,只切高亮类,不动列表 DOM
        commentEmojiPanel.addEventListener('mousemove', (e) => {
            if (commentEmojiPanel.dataset.mode !== 'at') return;
            const at = e.target.closest('[data-at-index]');
            if (at) highlightMentionItem(Number(at.dataset.atIndex));
        });

        document.addEventListener('click', (e) => {
            if (!commentEmojiPanel.classList.contains('show')) return;
            if (e.target.closest('#commentEmojiBtn, #commentAtBtn')) return;
            closeCommentPanel();
        });

        // Esc:收起面板、关掉大图浮层;左右方向键:在同一评论的多张图之间切换
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeCommentPanel();
                closeCommentImage();
                return;
            }
            if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && commentImgList.length) {
                stepCommentImage(e.key === 'ArrowLeft' ? -1 : 1);
            }
        });

        function renderDescBox(desc) {
            const descBox = document.getElementById('descBox');
            const descText = document.getElementById('descText');
            const descToggle = document.getElementById('descToggle');

            // 没有描述内容就直接隐藏整个描述区
            if (!desc || !desc.trim()) {
                descBox.style.display = 'none';
                descText.textContent = '';
                return;
            }

            descBox.style.display = 'block';
            descText.textContent = desc;
            // 每次切换视频/分P都重置为折叠状态，避免上一个视频的展开状态被带过来
            descText.classList.add('collapsed');
            descToggle.textContent = '展开';
            descToggle.style.display = 'none';

            requestAnimationFrame(() => {
                const isOverflowing = descText.scrollHeight > descText.clientHeight;
                descToggle.style.display = isOverflowing ? 'inline-block' : 'none';
            });
        }

        let art = null; // 当前 ArtPlayer 实例,切换视频/分P时需要先销毁旧的

        // dash 模式的隐藏音频轨: video/audio 两条 CDN 直链分别交给 <video>(ArtPlayer 自带的)
        // 和一个隐藏 <audio> 播放,播放状态手动与视频轨同步(见 attachDashAudioListeners)
        let dashAudio = null;
        let currentPlayInfo = null;     // 本次播放信息,供 fallbackToDurl / 切换清晰度用
        let currentDanmakuList = [];
        let dashFallbackTriggered = false; // 避免同一次播放反复触发降级

        function dashAudioErrorHandler() {
            console.warn('音频轨加载失败,降级到单文件直链');
            fallbackToDurl('audio error');
        }

        function destroyDashAudio() {
            if (dashAudio) {
                try { dashAudio.pause(); } catch (err) {}
                dashAudio.removeEventListener('error', dashAudioErrorHandler);
                dashAudio.src = '';
                dashAudio = null;
            }
        }

        /* 切换清晰度: 带 qn 重新请求 /api/play,拿回该档位的完整直链对(含配套音轨),
         * 整个播放器重建,再把进度和播放状态还原。
         * 判断"原来在不在播"必须用 art.video.paused,并且只在确实在播时才调 art.play();
         * 否则暂停状态下切清晰度会把隐藏音频轨推起来,表现成"声音在放、画面不动"。
         * 服务端会按 qn 选中对应清晰度,所以这里不需要自己换 src。 */
        async function switchQuality(qn) {
            if (!currentVideoId || !currentCid) return;
            const resumeAt = art && art.video ? art.currentTime : 0;
            const wasPlaying = art && art.video ? !art.video.paused : false;
            try {
                const paramType = currentVideoId.toLowerCase().startsWith('av') ? 'av' : 'bv';
                const cleanId = currentVideoId.replace(/av/i, '');
                const url = `/api/play?${paramType}=${cleanId}&p=${currentPage || 1}&cid=${currentCid}&qn=${encodeURIComponent(qn)}`;
                const res = await fetchWithTimeout(url);
                const data = await res.json();
                if (!res.ok || data.code !== 0) throw new Error(data.message || '切换清晰度失败');

                setJsonResult('play', data);
                initPlayer(data, currentDanmakuList || []);

                if (art && art.video) {
                    const restore = () => {
                        try {
                            if (resumeAt > 0) art.currentTime = resumeAt;
                            if (wasPlaying) art.play().catch(() => {});
                        } catch (err) {}
                        art.video.removeEventListener('loadedmetadata', restore);
                    };
                    if (art.video.readyState >= 1) restore();
                    else art.video.addEventListener('loadedmetadata', restore);
                }
            } catch (err) {
                console.error('切换清晰度失败:', err);
                alert('切换清晰度失败：' + (err.message || '未知错误'));
            }
        }

        // 把"清晰度"做成播放器设置面板里的一项(用 Artplayer 官方的 art.setting.add)。
        // 档位清单直接用服务端 /api/play 返回的 qualities(由 accept_quality 与
        // accept_description 按下标对应合成,已按清晰度从高到低排好)
        function applyQualitySetting(playInfo) {
            const settingApi = art && art.setting;
            if (!settingApi || !settingApi.add) return;

            const options = Array.isArray(playInfo.qualities) ? playInfo.qualities : [];
            // 没有可切换的档位时不放这一条,免得点进去只有一个选项
            if (options.length <= 1) return;

            const current = options.find((q) => q.id === playInfo.quality) || options[0];

            settingApi.add({
                html: '清晰度',
                tooltip: current.label,
                icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M9 15V9l6 3-6 3Z" fill="currentColor"/></svg>',
                selector: options.map((quality) => ({
                    html: quality.label,
                    value: quality.id,
                    default: quality.id === current.id,
                })),
                // 点某个档位时 Artplayer 回调"父项"的 onSelect,返回值写进这一行右侧
                onSelect: function (item) {
                    switchQuality(item.value);
                    return item.html;
                },
            });
        }

        /* dash 音频轨的播放状态同步: 起播时对齐并 play、暂停时 pause、拖进度时跟跳,
         * 倍速/音量/静音/结束各跟一次。刻意不加额外的再对齐/自动播放兜底,否则会出现:
         *   - 视频还没出画就把音频推起来 → 先响声音后出画面
         *   - 暂停时挂钩子等用户按键 → 暂停期间按任意键声音自己跑起来 */
        function attachDashAudioListeners() {
            if (!dashAudio || !art) return;

            art.on('video:play', () => {
                if (!dashAudio) return;
                dashAudio.currentTime = art.currentTime;
                dashAudio.play().catch(() => {});
            });
            art.on('video:pause', () => {
                if (dashAudio) dashAudio.pause();
            });
            art.on('video:seeked', () => {
                if (dashAudio) dashAudio.currentTime = art.currentTime;
            });
            art.on('video:volumechange', () => {
                if (!dashAudio) return;
                dashAudio.volume = art.volume;
                dashAudio.muted = art.muted;
            });
            art.on('video:ratechange', () => {
                if (dashAudio) dashAudio.playbackRate = art.playbackRate;
            });
            art.on('video:ended', () => {
                if (dashAudio) {
                    dashAudio.pause();
                    dashAudio.currentTime = 0;
                }
            });

            // 额外保险:音频轨 5 秒内还没 canplay,视为加载失败,主动降级。
            let audioReady = false;
            dashAudio.addEventListener('canplay', () => { audioReady = true; });
            setTimeout(() => {
                if (!audioReady && dashAudio && !dashFallbackTriggered) {
                    console.warn('音频轨 5 秒内未就绪,判定为加载失败');
                    fallbackToDurl('audio timeout');
                }
            }, 5000);
        }

        // dash 直链偶尔会因为 CDN 的 Referer 校验直接播放失败,这时整个降级回单文件 durl 直链、
        // 重新初始化播放器,并尽量恢复播放位置/状态。
        // dashFallbackTriggered 保证同一次播放只降级一次
        function fallbackToDurl(reason) {
            if (dashFallbackTriggered) return;
            if (!currentPlayInfo || !currentPlayInfo.fallbackUrl) {
                console.warn('DASH 失败且无兜底地址,无法降级:', reason);
                return;
            }
            dashFallbackTriggered = true;

            const resumeAt = art ? art.currentTime : 0;
            const wasMuted = art ? art.muted : false;
            const prevVolume = art ? art.volume : 1;
            const wasPlaying = art ? !art.paused : false;

            console.warn('DASH 播放失败,自动降级到单文件直链:', reason);

            // 用 durl 重新初始化
            initPlayer(
                { url: currentPlayInfo.fallbackUrl, quality: 64, accept_quality: [], accept_description: [], qualities: [] },
                currentDanmakuList || []
            );

            // 恢复进度 / 音量 / 播放状态
            if (art && art.video) {
                const restore = () => {
                    try {
                        if (resumeAt > 0) art.currentTime = resumeAt;
                        art.muted = wasMuted;
                        art.volume = prevVolume;
                        if (wasPlaying) art.play().catch(() => {});
                    } catch (err) {}
                    art.video.removeEventListener('loadedmetadata', restore);
                };
                if (art.video.readyState >= 1) restore();
                else art.video.addEventListener('loadedmetadata', restore);
            }
        }

        function initPlayer(playData, danmakuList) {
            // 每次解析新视频前,先销毁上一个实例,避免容器里残留多个播放器
            if (art) {
                art.destroy(false); // false = 不移除容器本身,方便重新挂载
                art = null;
            }
            destroyDashAudio();

            // 记住本次播放信息/弹幕,fallbackToDurl 降级、切换清晰度都要用
            currentPlayInfo = playData;
            currentDanmakuList = danmakuList || [];
            dashFallbackTriggered = false;

            // 服务端 /api/play 的返回形状:
            //   dash: { video: <url>, audio: <url>, videoId, audioId } 或 null
            //   fallbackUrl: 单文件 mp4 直链(platform=html5 拿不到 dash 时就是它)
            // 所以 dash 视频轨是**字符串**,不是对象
            const isDash = !!(playData && playData.dash && playData.dash.video);
            // 非 dash:用显式 url(降级时)或纯 durl 视频的 fallbackUrl
            const videoUrl = isDash ? playData.dash.video : (playData.url || playData.fallbackUrl);

            const artOptions = {
                container: '#videoPlayer',
                url: videoUrl,
                autoplay: true,
                autoSize: false,
                autoMini: false,
                setting: true,
                playbackRate: true,
                fullscreen: true,
                fullscreenWeb: true,
                pip: true,
                screenshot: true,
                theme: '#ffffff',
                moreVideoAttr: {
                    crossOrigin: 'anonymous',
                },
                plugins: [
                    artplayerPluginDanmuku({
                        danmuku: currentDanmakuList,
                        speed: 7.5,
                        opacity: 0.75,
                        fontSize: 20,
                        color: '#ffffff',
                        mode: 0,
                        margin: [10, '75%'],
                        antiOverlap: true,
                        synchronousPlayback: false,
                        heatmap: false,
                        // 打开播放器自带的弹幕输入框(控制栏中间那个),发送前先过 beforeEmit:
                        // 由我们把弹幕真正提交到上游,成功才返回 true 让它显示在本地弹幕层
                        emitter: true,
                        maxLength: 100,
                        beforeEmit: sendDanmakuToBili,
                    }),
                ],
            };

            art = new Artplayer(artOptions);

            art.on('error', (err) => {
                console.warn('播放器加载出错,可能是直链失效或跨域限制(Referer 防盗链):', err);
                // 视频轨本身直连失败 → 触发降级;非 dash 场景没有更低一级可退,只能提示
                if (isDash) fallbackToDurl('video error');
            });

            // dash 模式才需要这条隐藏音频轨。
            // 顺序很重要: 先建出 <audio> 再挂监听 —— attachDashAudioListeners 开头有
            // `if (!dashAudio) return`,反过来调会导致一个监听都挂不上(音频永远不 play)
            if (isDash && playData.dash.audio) {
                dashAudio = new Audio(playData.dash.audio);
                dashAudio.preload = 'auto';
                dashAudio.crossOrigin = 'anonymous';
                dashAudio.addEventListener('error', dashAudioErrorHandler);
                attachDashAudioListeners();
            }

            // 清晰度入口:设置面板里的一项(档位取服务端返回的 qualities)。
            // 不能放在 if (isDash) 里:未登录时 B 站只给单文件 mp4(dash 为空),
            // 但 accept_quality 仍然有 2 档(720P/360P),这时候也应该能切。
            // applyQualitySetting 内部自己会判断"档位少于 2 个就不显示"。
            applyQualitySetting(playData);

            // 网页全屏(fullscreenWeb)期间容器会变成 position:fixed 铺满全屏,
            // 这时才需要临时盖过导航栏/右侧栏;退出后立刻还原,避免平时也压在导航栏之上(见上面 CSS)。
            // 同时给 body 加上 is-fullscreen-web,隐藏 JSON 调试按钮/面板,避免它们盖住全屏播放器。
            art.on('fullscreenWeb', (state) => {
                document.getElementById('videoPlayer').classList.toggle('art-fullscreen-web', state);
                document.body.classList.toggle('is-fullscreen-web', state);
            });

            // 继续观看: 等 video 元数据加载完(此时 seek 才是准的)再跳到指定秒数,
            // 只在本次页面加载后生效一次,用完清零,避免同一实例内后续重新触发。
            if (pendingSeekSeconds > 0) {
                const seekTo = pendingSeekSeconds;
                pendingSeekSeconds = 0;
                art.once('video:loadedmetadata', () => {
                    try {
                        art.currentTime = seekTo;
                    } catch (err) {
                        console.warn('继续观看跳转失败:', err);
                    }
                });
            }

            // 播放心跳: 元数据加载完(seek 已经处理完)先上报一次,相当于"打开视频就写入历史记录";
            // 播放中每 HEARTBEAT_INTERVAL_MS 上报一次进度;暂停/结束时停掉定时器并补报最后一次。
            clearInterval(heartbeatTimer);
            heartbeatTimer = null;
            art.once('video:loadedmetadata', () => {
                reportHeartbeat(art.currentTime);
            });
            art.on('video:play', () => {
                if (heartbeatTimer) return;
                heartbeatTimer = setInterval(() => reportHeartbeat(art.currentTime), HEARTBEAT_INTERVAL_MS);
            });
            art.on('video:pause', () => {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
                reportHeartbeat(art.currentTime);
            });
            art.on('video:ended', () => {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
                reportHeartbeat(art.duration || art.currentTime);
            });
        }

        // 拉取指定 cid 的弹幕列表,失败/超时时都静默降级为无弹幕,不影响正常播放
        async function fetchDanmaku(cid) {
            if (!cid) return [];
            try {
                const res = await fetchWithTimeout(`/api/danmaku?cid=${encodeURIComponent(cid)}`);
                if (!res.ok) {
                    setJsonResult('danmaku', { error: `HTTP ${res.status}` });
                    return [];
                }
                const data = await res.json();
                setJsonResult('danmaku', data);
                return Array.isArray(data.list) ? data.list : [];
            } catch (err) {
                console.warn('弹幕加载失败:', err);
                setJsonResult('danmaku', { error: err.message });
                return [];
            }
        }

        // 播放当前 URL 参数指定的视频(bv/av + 分P 由 window.onload 解析后写入
        // currentVideoId / currentPage,这里只管发请求和渲染)。
        // 站内切换(相关推荐/分P)由 navigateToVideo() 原地调用本函数,不整页刷新,
        // 所以可能出现上一次调用还没跑完、用户又点了下一个视频的情况 —— 下面用 playSeq 丢弃迟到结果
        async function startPlay() {
            const id = currentVideoId;
            const p = currentPage || 1;

            if (!id) return; // 没有合法的 bv/av 参数，window.onload 那边已经处理过提示

            const mySeq = ++playSeq;

            let paramType = id.toLowerCase().startsWith('av') ? 'av' : 'bv';
            let cleanId = id.replace(/av/i, '');

            const infoUrl = `/api/info?${paramType}=${cleanId}`;

            // 相关推荐不依赖 cid，可以立刻并行发出
            loadRelated(paramType, cleanId, mySeq);

            // 统一先通过 /api/info 拿到 cid(顺带更新标题/简介/分P列表)，
            // 再用这个 cid 去并行发出 /api/play 和 /api/danmaku，
            // 这样 /api/play 内部就不用重新解析一次 cid，弹幕也不用等播放地址解析完才发。
            let infoData = null;
            try {
                const infoRes = await fetchWithTimeout(infoUrl);
                infoData = await infoRes.json();
                setJsonResult('info', infoData);
            } catch (err) {
                setJsonResult('info', { error: err.message });
            }

            // 这次请求等待期间,用户可能已经点了别的视频(playSeq 会被那次调用继续 +1)，
            // 这里的结果已经过期，直接放弃，避免把旧视频的信息盖到新视频上面。
            if (mySeq !== playSeq) return;

            const infoOk = infoData && infoData.code === 0;
            document.getElementById('videoTitle').textContent = infoOk ? infoData.title : '';
            document.title = infoOk && infoData.title ? infoData.title : 'B站视频播放器';
            renderVideoStats(infoOk ? infoData : null);
            renderActionBar(infoOk ? infoData : null);
            renderDescBox(infoOk ? infoData.desc : '');
            renderEpisodeBox(infoOk ? infoData.pages : [], p);

            // 评论区不依赖 cid/播放地址,只要拿到 aid 就能独立拉取,不用等 /api/play
            currentAid = infoOk ? (infoData.aid || 0) : 0;
            // 换视频了:上一个视频"我发过的评论"记忆和删除记录都清掉
            forgetMyCommentRpid();
            deletedRpids = new Set();
            loadComments(true, mySeq);
            syncActionStatus(currentAid); // 反查真实点赞/投币/收藏状态,同步按钮高亮(见函数注释)

            const targetPage = infoOk ? (infoData.pages || []).find((item) => item.page === p) : null;
            const cid = targetPage ? targetPage.cid : null;
            currentCid = cid || 0;

            // /api/play 必须带 cid;拿不到 cid 说明 /api/info 失败或分P不存在,直接提示,不发请求
            if (!cid) {
                const msg = infoOk ? `未找到第 ${p} P` : '获取视频信息失败，无法解析播放地址';
                setJsonResult('play', { error: msg });
                switchJsonTab('play');
                alert(msg);
                return;
            }

            const apiUrl = `/api/play?${paramType}=${cleanId}&p=${p}&cid=${cid}`;

            // /api/play 解析出错也不影响这里 return 的 Promise 状态本身，
            // 错误统一在下面 Promise.all 之后处理
            const playPromise = (async () => {
                const response = await fetchWithTimeout(apiUrl);
                let jsonData;
                try {
                    jsonData = await response.json();
                } catch (parseErr) {
                    // 连 JSON 都解析不出来，才用笼统的 HTTP 状态码报错
                    throw new Error(`接口返回 HTTP ${response.status}`);
                }
                return jsonData;
            })();

            // 弹幕直接用 /api/info 拿到的 cid，不必等 /api/play 返回
            const danmakuPromise = cid ? fetchDanmaku(cid) : Promise.resolve([]);

            try {
                const [jsonData, danmakuList] = await Promise.all([playPromise, danmakuPromise]);

                // 同上:这批请求回来的时候用户可能已经切到别的视频了,过期结果直接丢弃，
                // 不然会出现"画面/弹幕是新视频的，控件上却在播上一个视频的直链"这种错乱。
                if (mySeq !== playSeq) return;

                // 将原始 JSON 结果记录下来，并自动切到"解析"这个选项卡展示
                setJsonResult('play', jsonData);
                switchJsonTab('play');

                if (jsonData.code !== 0) {
                    // 接口返回了明确的错误信息（如分P超出范围、次数超限、清晰度受限等）
                    alert(`解析失败：${jsonData.message || '未知错误'}`);
                    return;
                }

                // 返回形状: dash 有值 → 音视频分离流;否则用 fallbackUrl 的单文件 mp4
                const hasDash = !!(jsonData.dash && jsonData.dash.video);
                const hasDurl = !!jsonData.fallbackUrl;

                if (hasDash || hasDurl) {
                    try {
                        initPlayer(jsonData, danmakuList);
                    } catch (playerError) {
                        console.error('播放器初始化失败:', playerError);
                        alert('播放器初始化失败：' + playerError.message);
                    }
                } else {
                    alert('解析失败：返回结果中缺少可播放的直链');
                }
            } catch (error) {
                console.error('请求接口失败:', error);
                setJsonResult('play', { error: error.message });
                switchJsonTab('play');
                alert('请求解析接口失败：' + error.message);
            }
        }

        window.onload = function() {
            // 播放页完全由 URL 参数驱动: ?bv=xxx(或 ?av=xxx&p=2),只能从搜索页/相关推荐等
            // 会拼好链接的入口进入。
            // t=从第几秒继续播放,来自历史记录的"继续观看";t<=0 时从头播放
            const params = new URLSearchParams(window.location.search);
            const bv = params.get('bv');
            const av = params.get('av');
            const p = params.get('p');
            const t = parseInt(params.get('t'), 10);

            if (bv || av) {
                currentVideoId = bv || `av${av}`;
                currentPage = p ? (parseInt(p, 10) || 1) : 1;
                pendingSeekSeconds = t > 0 ? t : 0;
                startPlay();
            }
        }

                        function onLoginStateChanged(state) {
                    isUserLoggedIn = !!(state && state.loggedIn);
                    // 评论输入框左侧的头像跟着登录态走;mid 用来判断"这条评论是不是我发的"(要不要给删除按钮),
                    // 上游和登录接口给的 mid 都是字符串,这里原样保留,不做数字转换。
                    currentUser = state && state.loggedIn
                        ? { mid: state.uid || '', uname: state.uname || '', avatar: state.avatar || '' }
                        : null;

                    // 表情包是按账号下发的: 账号变了(退出登录/换号登录)本地缓存就作废,下次打开面板重新拉。
                    // @ 候选同理,而且还得把已经插进输入框的 @ 节点清掉 —— 里面的 mid/昵称属于上一个账号
                    const emoteMid = state && state.loggedIn ? String(state.uid || '') : '';
                    if (emoteMid !== emoteOwnerMid) {
                        emoteOwnerMid = emoteMid;
                        emotePackages = null;
                        emoteMap = {};
                        closeCommentPanel();
                        clearCommentInput();
                        clearCommentPictures();
                    }

                    if (typeof renderCommentEditor === 'function') renderCommentEditor();
                    // 登录状态可能在评论已经加载完之后才刷新回来(见 refreshLoginStatus 的异步时序),
                    // 这里顺手刷一下底部提示,不用等用户重新触发一次评论加载
                    updateCommentLoginTip();
                }

                // 登录成功后评论区要重新初始化(头像/输入框/点赞态都跟登录态有关)
                function afterLoginSuccess() {
                    if (currentVideoId) startPlay();
                }


        async function handleLogout() {
            try {
                await fetch('/api/login/logout', { method: 'POST' });
            } catch (err) {
                console.warn('退出登录失败:', err);
            }
            renderLoginSlot({ loggedIn: false });
            if (currentVideoId) startPlay();
        }

        refreshLoginStatus();
        startLoginWatch();
        // 页面加载完后再确认一次上游登录态: 此时右上角已渲染,不会出现"登录/头像"闪烁,
        // 登录已失效时用户一进页面就能看到提示,不必等第一次巡检
        setTimeout(() => refreshLoginStatus({ verify: true }), 1500);
    </script>
