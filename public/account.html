let favFolders = [];
let favDetailMediaId = null;
let favDetailTitle = '';
let favDetailList = [];
let favDetailPage = 1;
let favDetailHasMore = true;
let favDetailLoading = false;
// 收藏夹内容加载失败的原因,空串表示没出错(与"这个收藏夹还是空的"区分)
let favDetailError = '';

async function loadFavFolders() {
  const box = document.getElementById('favFoldersGrid');
  box.innerHTML = `<div class="placeholder">正在加载...</div>`;
  try {
    const data = await fetchJson('/api/account/favorites');
    if (data.__status === 401) {
      renderNotLoggedIn();
      return;
    }
    if (data.code !== 0) throw new Error(data.message || '获取收藏夹失败');
    favFolders = data.list || [];
    renderFavFolders();
    // 初始展示第一个夹子(上游把自己创建的默认收藏夹排在最前)
    if (!favDetailMediaId && favFolders.length) {
      openFavFolder(favFolders[0].id, favFolders[0].title);
    }
  } catch (err) {
    box.innerHTML = `<div class="error-box">${escapeHtml(err.message || '加载失败,请稍后重试')}</div>`;
  }
}

// 左侧边栏:每个夹子一行,当前打开的那个高亮
function renderFavFolders() {
  const box = document.getElementById('favFoldersGrid');
  if (!favFolders.length) {
    box.innerHTML = `<div class="placeholder">还没有创建收藏夹</div>`;
    return;
  }
  // 每一行右侧都是 "..." 按钮,展开的菜单里是"编辑信息 / 删除";
  // 默认收藏夹(attr 的 bit1 为 0)上游不允许删除,它的菜单里没有"删除";
  // 私密夹子(attr 的 bit0 为 1)在文件夹图标右下角挂一个小锁
  box.innerHTML = favFolders.map((f) => `
    <div class="folder-item${String(f.id) === String(favDetailMediaId) ? ' active' : ''}" data-id="${f.id}" data-title="${escapeAttr(f.title)}" role="button" tabindex="0">
      <span class="folder-icon">${FOLDER_ICON_SVG}${(f.attr & 1) ? `<span class="folder-lock" title="仅自己可见">${LOCK_ICON_SVG}</span>` : ''}</span>
      <span class="folder-title" title="${escapeAttr(f.title)}">${escapeHtml(f.title)}</span>
      <span class="folder-tail">
        <span class="folder-count">${f.mediaCount}</span>
        <button type="button" class="folder-more" aria-label="更多操作" aria-haspopup="true" aria-expanded="false">⋯</button>
        <div class="folder-menu">
          <div class="folder-menu-item" data-folder-action="edit">${FOLDER_MENU_ICON.edit}编辑信息</div>
          ${(f.attr & 2) ? `<div class="folder-menu-item" data-folder-action="delete">${FOLDER_MENU_ICON.delete}删除</div>` : ''}
        </div>
      </span>
    </div>
  `).join('');
}

/* ----------------------------- 收藏夹信息弹窗(新建 / 编辑) -----------------------------
 * 新建走 x/v3/fav/folder/add,编辑走 x/v3/fav/folder/edit,对应
 * /api/account/favorites/create | edit。两个表单字段完全一样(名称 + 可见性),
 * 所以共用一个弹窗,只有标题、按钮文案和提交的目标接口按 mode 分。
 * 成功后:新建重拉一次列表(新夹子带着 id/attr,本地拼不出来),
 * 编辑只改本地那一个夹子(只动了名字/可见性,内容数没变)。
 * ---------------------------------------------------------------------------------- */

const folderFormMask = document.getElementById('folderFormMask');
const folderFormTitle = document.getElementById('folderFormTitle');
const folderFormInput = document.getElementById('folderFormInput');
const folderFormPrivate = document.getElementById('folderFormPrivate');
const folderFormConfirm = document.getElementById('folderFormConfirm');

// mode: 'create' | 'edit';folder 只在 edit 时用
let folderFormMode = 'create';
let folderFormFolder = null;
let folderFormSubmitting = false;

document.getElementById('favCreateBtn').addEventListener('click', () => openFolderForm('create'));
document.getElementById('folderFormCancel').addEventListener('click', closeFolderForm);
// 点遮罩空白处关闭(弹窗内部的点击不关,同其它弹窗)
folderFormMask.addEventListener('click', (e) => {
  if (e.target === folderFormMask) closeFolderForm();
});
folderFormConfirm.addEventListener('click', submitFolderForm);
folderFormInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitFolderForm();
});

// folder 只在 mode='edit' 时传
function openFolderForm(mode, folder) {
  folderFormMode = mode;
  folderFormFolder = folder || null;
  folderFormTitle.textContent = mode === 'create' ? '新建收藏夹' : '编辑收藏夹';
  folderFormConfirm.textContent = mode === 'create' ? '创建' : '保存';
  folderFormInput.value = mode === 'edit' && folder ? (folder.title || '') : '';
  // attr 的 bit0 是私密;新建时默认公开
  folderFormPrivate.checked = mode === 'edit' && folder ? !!(folder.attr & 1) : false;
  folderFormSubmitting = false;
  folderFormConfirm.disabled = false;
  folderFormMask.classList.add('show');
  folderFormInput.focus();
  if (mode === 'edit') folderFormInput.select();
}

function closeFolderForm() {
  folderFormSubmitting = false;
  folderFormFolder = null;
  folderFormMask.classList.remove('show');
}

async function submitFolderForm() {
  const isCreate = folderFormMode === 'create';
  // 提交中、或编辑时没带上是哪个夹子,都不提交
  if (folderFormSubmitting || (!isCreate && !folderFormFolder)) return;
  const title = folderFormInput.value.trim();
  if (!title) {
    showToast('请填写收藏夹名称');
    folderFormInput.focus();
    return;
  }

  const folder = folderFormFolder;
  const privacy = folderFormPrivate.checked ? 1 : 0;
  const failText = isCreate ? '新建收藏夹失败' : '保存收藏夹失败';
  folderFormSubmitting = true;
  folderFormConfirm.disabled = true;
  folderFormConfirm.textContent = isCreate ? '创建中...' : '保存中...';
  try {
    const data = await fetchJson(
      isCreate ? '/api/account/favorites/create' : '/api/account/favorites/edit',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(isCreate ? { title, privacy } : { mediaId: folder.id, title, privacy }),
      }
    );
    if (data.__status === 401) {
      closeFolderForm();
      renderNotLoggedIn();
      return;
    }
    if (data.code !== 0) throw new Error(data.message || failText);

    if (isCreate) {
      closeFolderForm();
      await loadFavFolders();
      showToast(`已创建「${title}」`);
      return;
    }

    // 本地直接更新,不重拉列表(只改了名字/可见性,内容数没动)
    folder.title = title;
    folder.attr = privacy ? (folder.attr | 1) : (folder.attr & ~1);
    if (String(favDetailMediaId) === String(folder.id)) {
      favDetailTitle = title;
      document.getElementById('favDetailTitle').textContent = title;
    }
    renderFavFolders();
    closeFolderForm();
    showToast('已保存');
  } catch (err) {
    folderFormSubmitting = false;
    folderFormConfirm.disabled = false;
    folderFormConfirm.textContent = isCreate ? '创建' : '保存';
    showToast(err.message || `${failText},请稍后重试`);
  }
}

// 夹子行 "..." 菜单里的"删除"(走 x/v3/fav/folder/del → /api/account/favorites/delete)。
// 删除后重新拉一次列表:夹子带的内容多,本地减不如以服务端为准,也让空出来的位置
// 由下一个夹子顶上。默认收藏夹上游不允许删除,菜单里就没有这一项(见 renderFavFolders)。
// moreBtn 只是用来防连点(菜单点完就收了),失败时恢复的是它
async function deleteFavFolder(folder, moreBtn) {
  if (!folder || (moreBtn && moreBtn.disabled)) return;
  const countTip = folder.mediaCount > 0 ? `（里面还有 ${folder.mediaCount} 个内容）` : '';
  if (!window.confirm(`确定删除收藏夹「${folder.title}」吗？${countTip}`)) return;

  if (moreBtn) moreBtn.disabled = true;
  try {
    const data = await fetchJson('/api/account/favorites/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mediaId: folder.id }),
    });
    if (data.__status === 401) {
      renderNotLoggedIn();
      return;
    }
    if (data.code !== 0) throw new Error(data.message || '删除收藏夹失败');

    // 删的就是当前打开的那个:清掉选中态,让 loadFavFolders 重新挑一个顶上
    if (String(favDetailMediaId) === String(folder.id)) {
      favDetailMediaId = null;
      favDetailTitle = '';
    }
    await loadFavFolders();
    showToast(`已删除「${folder.title}」`);
  } catch (err) {
    if (moreBtn) moreBtn.disabled = false;
    showToast(err.message || '删除收藏夹失败,请稍后重试');
  }
}

// 夹子行本身是"进这个夹子",菜单按钮和菜单项都要拦住这次点击。
// 三分支写在同一个委托里(而不是各挂一个监听):点按钮时不会顺手进夹子
document.getElementById('favFoldersGrid').addEventListener('click', (e) => {
  const menuItem = e.target.closest('.folder-menu-item');
  if (menuItem) {
    runFolderMenuAction(menuItem.closest('.folder-item'), menuItem.dataset.folderAction);
    return;
  }
  // "..." 按钮由悬停开关,点击只当没点
  if (e.target.closest('.folder-more')) return;
  const item = e.target.closest('.folder-item');
  if (item) openFavFolder(item.dataset.id, item.dataset.title);
});

// 夹子行是可聚焦的(role=button),回车/空格等同点击
document.getElementById('favFoldersGrid').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const item = e.target.closest('.folder-item');
  if (!item) return;
  e.preventDefault();
  openFavFolder(item.dataset.id, item.dataset.title);
});

/* ----------------------------- 夹子行的 "..." 菜单 -----------------------------
 * 每一行右侧都有 "..." 按钮,菜单里是"编辑信息 / 删除"(默认收藏夹没有"删除")。
 * 开关逻辑与卡片上那个菜单共用 createMenuController,这里只补上带 aria 的那份配置。
 * -------------------------------------------------------------------- */
const folderMenu = createMenuController('.folder-more', '.folder-menu', true);
folderMenu.bind(document.getElementById('favFoldersGrid'));

// 菜单项的动作都作用在"这一行对应的夹子"上,所以从夹子行上取 id 与标题
function runFolderMenuAction(item, action) {
  folderMenu.close();
  if (!item) return;
  const folder = favFolders.find((f) => String(f.id) === String(item.dataset.id));
  if (!folder) return;
  if (action === 'edit') openFolderForm('edit', folder);
  else if (action === 'delete') deleteFavFolder(folder, item.querySelector('.folder-more'));
}

// 点左侧的夹子:切换右侧内容。源夹子的判定不再依赖某个"当前夹子"变量,
// 卡片上的 data-menu-media-id 就是它自己渲染时的那个夹子
function openFavFolder(mediaId, title) {
  favDetailMediaId = mediaId;
  favDetailTitle = title;
  favDetailList = [];
  favDetailPage = 1;
  favDetailHasMore = true;

  document.getElementById('favDetailTitle').textContent = title;
  renderFavFolders();
  loadFavDetail(true);
}

/* ----------------------------- 收藏夹之间移动 / 复制 -----------------------------
 * 点卡片上的"移动"打开弹窗,选目标夹子后按"复制"或"移动"提交给
 * /api/account/favorites/transfer,上游是 x/v3/fav/resource/{move|copy}。
 * 成功后只改本地列表与夹子数量,不重新拉接口:移动 = 从源夹子移出 + 目标夹子 +1,
 * 复制 = 目标夹子 +1(源夹子不变)。
 * -------------------------------------------------------------------- */

// activeItem: 当前要搬运的条目是列表里的哪一条,用来在成功后把它从当前夹子摘掉
let favPickActiveItem = null;
let favPickSrcId = null;
let favPickAid = null;
let favPickType = 2;
let favPickTargets = [];
// 已经含有这条内容的夹子 id(上游按 rid 给 fav_state=1):列出来但不可选,
// 选了移动/复制到这些夹子上游不会真的加进去,本地计数却会 +1,对不上
let favPickHasItem = new Set();
let favPickTargetId = null;
// 打开弹窗的那个菜单项决定这次是复制还是移动,弹窗里不再分两个按钮
let favPickAction = 'move';
let favPickLoading = false;
let favPickError = '';
let favPickSubmitting = false;

const favPickMask = document.getElementById('favPickMask');
const favPickList = document.getElementById('favPickList');
const favPickTitle = document.getElementById('favPickTitle');
const favPickConfirm = document.getElementById('favPickConfirm');

document.getElementById('favPickCancel').addEventListener('click', () => closeFavPick());
// 点遮罩空白处关闭(弹窗内部的点击不关,同登录弹窗)
favPickMask.addEventListener('click', (e) => {
  if (e.target === favPickMask) closeFavPick();
});

// 卡片上带的是 dataset,里面全是字符串。action 来自点开菜单的那一项(copy / move)
function openFavPick({ menuId, menuMediaId, menuType }, action) {
  // 两个 id 缺一个就没法搬运:源夹子拿不到时上游必然拒绝,不如不开弹窗
  if (!menuId || !menuMediaId) return;
  favPickActiveItem = favDetailList.find((it) => String(it.aid) === String(menuId)) || null;
  // 源夹子以卡片上写死的 data-menu-media-id 为准,不读全局的 favDetailMediaId:
  // 它在退回夹子列表时会被清掉,而底下的旧卡片可能还在等新列表渲染
  favPickSrcId = menuMediaId;
  // resources 要的 {内容id}:{内容类型},视频的内容 id 就是 aid
  favPickAid = parseInt(menuId, 10);
  favPickType = parseInt(menuType, 10) || 2;
  favPickAction = action === 'copy' ? 'copy' : 'move';
  favPickTitle.textContent = favPickAction === 'copy' ? '复制到收藏夹' : '移动到收藏夹';
  favPickTargetId = null;
  favPickError = '';
  favPickSubmitting = false;
  favPickLoading = true; // 先按"加载中"渲染,避免"还没有别的收藏夹"闪一下
  updateFavPickUI();
  loadFavPickTargets();
}

function closeFavPick() {
  favPickLoading = false;
  favPickSubmitting = false;
  favPickActiveItem = null;
  favPickSrcId = null;
  favPickAid = null;
  favPickType = 2;
  favPickAction = 'move';
  favPickTargets = [];
  favPickHasItem = new Set();
  favPickTargetId = null;
  favPickError = '';
  favPickList.innerHTML = '';
  updateFavPickUI();
}

// 目标候选 = 自己的夹子去掉当前这个(移动到自己没有意义)。
// 带 rid 时上游会为每个夹子带上 fav_state,据此把"已经含有这条内容"的夹子标成不可选
async function loadFavPickTargets() {
  const srcId = favPickSrcId;
  const aid = favPickAid;
  // 弹窗关掉、或换成另一条内容时,这次的结果就不要了(直接照 favPickSrcId 取的话,
  // 从详情退回列表再点旧卡片时可能已经指向别的夹子)
  const isCurrent = () => favPickSrcId === srcId && favPickAid === aid && favPickMask.classList.contains('show');
  favPickLoading = true;
  favPickError = '';
  updateFavPickUI();
  try {
    const data = await fetchJson(`/api/account/favorites?rid=${encodeURIComponent(aid)}`);
    if (!isCurrent()) return;
    if (data.code !== 0) throw new Error(data.message || '获取收藏夹失败');
    favFolders = data.list || [];
    favPickTargets = favFolders.filter((f) => String(f.id) !== String(srcId));
    favPickHasItem = new Set(
      favPickTargets.filter((f) => f.favState).map((f) => String(f.id))
    );
  } catch (err) {
    // loading 先复位:下面 isCurrent() 要求弹窗还开着,不先复位会把弹窗卡在"加载中"
    favPickLoading = false;
    if (!isCurrent()) return;
    favPickError = err.message || '获取收藏夹失败,请稍后重试';
  }
  if (isCurrent()) {
    favPickLoading = false;
    updateFavPickUI();
  }
}

// 一个候选夹子。alreadyIn 的排在后面、只有一行说明,点了不选中
function favPickItemHTML(folder, alreadyIn) {
  const disabled = alreadyIn ? ' is-disabled' : '';
  const checked = !alreadyIn && String(folder.id) === String(favPickTargetId) ? ' checked' : '';
  const count = alreadyIn
    ? '已在该收藏夹'
    : `${folder.mediaCount} 个内容`;
  return `
      <div class="fav-folder-item${disabled}${checked}" data-id="${escapeAttr(String(folder.id))}">
        <span class="fav-folder-name">${escapeHtml(folder.title)}</span>
        <span class="fav-folder-count">${count}</span>
      </div>`;
}

function updateFavPickUI() {
  const open = favPickActiveItem !== null;
  favPickMask.classList.toggle('show', open);
  if (!open) {
    favPickConfirm.disabled = true;
    return;
  }

  const selectable = favPickTargets.filter((f) => !favPickHasItem.has(String(f.id)));
  const alreadyIn = favPickTargets.filter((f) => favPickHasItem.has(String(f.id)));

  if (favPickError) {
    favPickList.innerHTML = `<div class="fav-folder-error">${escapeHtml(favPickError)}<br>
      <button type="button" class="fav-folder-retry" id="favPickRetry">重试</button></div>`;
    const btn = document.getElementById('favPickRetry');
    if (btn) btn.addEventListener('click', loadFavPickTargets);
  } else if (favPickLoading && !favPickTargets.length) {
    favPickList.innerHTML = `<div class="fav-folder-placeholder">加载中...</div>`;
  } else if (!favPickTargets.length) {
    favPickList.innerHTML = `<div class="fav-folder-placeholder">没有别的收藏夹,请先在 B 站创建一个</div>`;
  } else if (!selectable.length) {
    favPickList.innerHTML = `<div class="fav-folder-placeholder">别的收藏夹里都已经有这条内容了</div>`;
  } else {
    favPickList.innerHTML = selectable.map((f) => favPickItemHTML(f, false)).join('')
      + alreadyIn.map((f) => favPickItemHTML(f, true)).join('');
  }

  // 点夹子只是选中(上游一次只处理一个目标),由"确定"提交
  favPickConfirm.disabled = favPickLoading || favPickSubmitting || !favPickTargetId;
  favPickConfirm.textContent = favPickSubmitting ? '提交中...' : '确定';
}

favPickList.addEventListener('click', (e) => {
  const item = e.target.closest('.fav-folder-item');
  if (!item || favPickSubmitting || item.classList.contains('is-disabled')) return;
  favPickTargetId = item.dataset.id;
  updateFavPickUI();
});

favPickConfirm.addEventListener('click', () => {
  if (favPickTargetId) submitFavPick(favPickAction);
});

async function submitFavPick(action) {
  // 提交中、没点过夹子、或这条内容没有 aid 时都不提交
  if (favPickSubmitting || !favPickTargetId || !favPickAid) return;

  favPickSubmitting = true;
  updateFavPickUI();
  try {
    const data = await fetchJson('/api/account/favorites/transfer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        aid: favPickAid,
        type: favPickType,
        mediaId: favPickSrcId,
        targetMediaId: favPickTargetId,
        action,
      }),
    });
    if (data.__status === 401) {
      // 先让弹窗"关掉"再切回未登录页,onUnauthorized 会兜底再关一次
      closeFavPick();
      renderNotLoggedIn();
      return;
    }
    if (data.code !== 0) throw new Error(data.message || '操作失败,请稍后重试');

    const target = favFolders.find((f) => String(f.id) === String(favPickTargetId));
    if (target) target.mediaCount = (target.mediaCount || 0) + 1;
    if (action === 'move') {
      // 源夹子数减掉;列表里也摘掉这一条(后端不重拉,移动是确定性的)
      const source = favFolders.find((f) => String(f.id) === String(favPickSrcId));
      if (source && source.mediaCount > 0) source.mediaCount -= 1;
      const moved = favPickActiveItem;
      favDetailList = favDetailList.filter((it) => it !== moved);
      renderFavDetailList();
      updateFavLoadMoreUI();
    }
    // 夹子数量变了,列表页的计数也跟着更新
    renderFavFolders();
    const title = target ? `「${target.title}」` : '目标收藏夹';
    closeFavPick();
    showToast(action === 'move' ? `已移动到${title}` : `已复制到${title}`);
  } catch (err) {
    favPickSubmitting = false;
    updateFavPickUI();
    showToast(err.message || (action === 'move' ? '移动失败,请稍后重试' : '复制失败,请稍后重试'));
  }
}

function favCardHTML(item) {
  // 标题右侧的"..."按钮:操作(复制到/移动到/取消收藏)都收在它展开的菜单里。
  // 三项都要 aid(deal 的 rid,也是搬运的 resources),番剧/课程等非视频条目后端给 0,不给按钮
  const menuAttrs = `data-menu-id="${item.aid}" data-menu-media-id="${escapeAttr(String(favDetailMediaId || ''))}" data-menu-type="${item.type || 2}" data-menu-title="${escapeAttr(plainText(item.title))}"`;
  const actionHTML = item.aid
    ? `<button type="button" class="card-more" ${menuAttrs} title="更多操作" aria-label="更多操作" aria-haspopup="true">⋯</button>
       ${favCardMenuHTML()}`
    : '';
  return videoCardHTML({
    href: buildPlayerHref(item.bvid, 1, 0),
    pic: item.pic,
    title: item.title,
    author: item.author || '',
    authorMid: item.authorMid || 0,
    // 收藏夹里显示的是"什么时候收藏的",不是视频的发布日期
    favTime: item.favTime,
    duration: item.duration,
    extraStat: item.valid ? thumbStatsHTML(item.play, item.danmaku) : '',
    actionHTML,
    invalid: !item.valid,
  });
}

function renderFavDetailList() {
  const box = document.getElementById('favDetailList');
  if (!favDetailList.length) {
    // 失败提示在这里渲染: finally 里的这次重绘会覆盖 catch 写的内容
    if (favDetailError) {
      box.innerHTML = `<div class="error-box">${escapeHtml(favDetailError)}<br>
        <button type="button" class="retry-btn" id="favDetailRetryBtn">重试</button></div>`;
      const btn = box.querySelector('#favDetailRetryBtn');
      if (btn) btn.addEventListener('click', () => loadFavDetail(true));
      return;
    }
    box.innerHTML = favDetailLoading
      ? `<div class="placeholder">正在加载...</div>`
      : `<div class="placeholder">这个收藏夹还是空的</div>`;
    return;
  }
  box.innerHTML = `<div class="grid">${favDetailList.map(favCardHTML).join('')}</div>`;
}

async function loadFavDetail(reset) {
  if (favDetailLoading) return;
  if (reset) {
    favDetailList = [];
    favDetailPage = 1;
    favDetailHasMore = true;
    favDetailError = '';
  }
  if (!favDetailHasMore) return;

  favDetailLoading = true;
  renderFavDetailList();
  updateFavLoadMoreUI();

  try {
    const data = await fetchJson(`/api/account/favorites/${encodeURIComponent(favDetailMediaId)}?pn=${favDetailPage}`);
    if (data.__status === 401) {
      renderNotLoggedIn();
      return;
    }
    if (data.code !== 0) throw new Error(data.message || '获取收藏夹内容失败');

    favDetailError = '';
    favDetailList = favDetailList.concat(data.list || []);
    favDetailHasMore = !!data.hasMore;
    favDetailPage += 1;
  } catch (err) {
    if (!favDetailList.length) favDetailError = err.message || '加载失败,请稍后重试';
  } finally {
    favDetailLoading = false;
    renderFavDetailList();
    updateFavLoadMoreUI();
  }
}

function updateFavLoadMoreUI() {
  const row = document.getElementById('favLoadMoreRow');
  if (!favDetailList.length && !favDetailLoading) {
    row.style.display = 'none';
    return;
  }
  if (!favDetailHasMore) {
    row.innerHTML = `<span class="load-more-tip">没有更多了</span>`;
    row.style.display = 'block';
    return;
  }
  row.style.display = 'block';
  row.innerHTML = `<button class="load-more-btn" id="favLoadMoreBtn" ${favDetailLoading ? 'disabled' : ''}>${favDetailLoading ? '加载中...' : '加载更多'}</button>`;
  document.getElementById('favLoadMoreBtn').addEventListener('click', () => loadFavDetail(false));
}

// 登录失效时自己的主页/历史/收藏/投稿都不能看了,切回未登录页;别人的空间(?mid=)不用动
function onUnauthorized() {
  if (!getUrlMid()) {
    closeRelationsModal();
    closeFavPick();
    closeFolderForm();
    // 夹子列在未登录页里,收起菜单免得残留的 aria-expanded 留在旧节点上
    folderMenu.close();
    const mainArea = document.getElementById('mainArea');
    if (mainArea) mainArea.style.display = 'none';
    renderNotLoggedIn();
  }
}

// 登录成功后资料卡/收藏/历史都跟着变,重新拉一次
function afterLoginSuccess() {
  loadProfile();
}


/* ----------------------------- 初始化 ----------------------------- */

loadProfile();
refreshLoginStatus();
startLoginWatch();
// 页面加载完后再确认一次上游登录态: 此时右上角已渲染,不会出现"登录/头像"闪烁,
// 登录已失效时用户一进页面就能看到提示,不必等第一次巡检
setTimeout(() => refreshLoginStatus({ verify: true }), 1500);
</script>
