<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>个人主页</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<script src="/theme.js"></script>
<link rel="stylesheet" href="/common.css" />
<style>
  /* 关注/粉丝列表弹窗 */
  .rel-modal-mask {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .rel-modal {
    width: 420px;
    max-width: calc(100vw - 32px);
    height: 560px;
    max-height: calc(100vh - 64px);
    background: var(--card);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .rel-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .rel-modal-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .rel-modal-close {
    background: none;
    border: none;
    font-size: 20px;
    line-height: 1;
    color: var(--text-3);
    cursor: pointer;
    padding: 4px;
  }
  .rel-modal-close:hover { color: var(--text); }
  .rel-modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px;
  }
  .rel-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 8px;
    border-radius: 8px;
  }
  .rel-item:hover { background: var(--hover); }
  .rel-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--fill);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .rel-info { flex: 1; min-width: 0; }
  .rel-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rel-sign {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rel-follow-btn {
    flex-shrink: 0;
    padding: 6px 14px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    border: 1px solid var(--pink);
    border-radius: 14px;
    background: var(--pink);
    color: var(--on-brand);
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .rel-follow-btn:hover { background: var(--pink-dark); border-color: var(--pink-dark); }
  .rel-follow-btn.following {
    background: var(--card);
    color: var(--text-2);
    border-color: var(--border);
  }
  .rel-follow-btn.following:hover {
    color: var(--pink-dark);
    border-color: var(--pink-dark);
    background: var(--card);
  }
  .rel-follow-btn:disabled { cursor: default; opacity: .6; }
  .rel-load-more-row { text-align: center; padding: 12px 0 8px; }

  .content {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 24px 60px;
  }

/* 资料卡 */
  .profile-card {
    background: var(--card);
    /* 浅色下 --card 与页面底色同为白,不给描边整张卡就看不出来 */
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 24px;
  }
  .profile-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--fill);
    border: 2px solid var(--border);
    flex-shrink: 0;
  }
  .profile-info { flex: 1; min-width: 0; }
  .profile-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .profile-name { font-size: 18px; font-weight: 700; color: var(--text); }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    color: var(--on-brand);
    white-space: nowrap;
  }
  .badge-level { background: var(--blue); }
  .badge-vip { background: linear-gradient(135deg, #fb7299, #ffb199); }
  .profile-uid { font-size: 12px; color: var(--text-3); margin: 4px 0 0; }
  .profile-sign {
    font-size: 13px;
    color: var(--text-2);
    margin: 10px 0 0;
    line-height: 1.5;
    word-break: break-all;
  }
  .profile-stats {
    display: flex;
    gap: 20px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-2);
  }
  .profile-stats b { color: var(--text); font-weight: 600; }
  .stat-link { cursor: pointer; border-radius: 4px; transition: color .15s ease; }
  /* :hover 直接给 <b> 上色,所以数字自己也要有 transition,否则只有"关注/粉丝"在渐变 */
  .stat-link b { transition: color .15s ease; }
  .stat-link:hover { color: var(--pink); }
  .stat-link:hover b { color: var(--pink); }
  .profile-actions { flex-shrink: 0; }
  .logout-btn {
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    background: none;
    color: var(--text-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s ease, border-color .15s ease;
  }
  .logout-btn:hover { color: var(--pink-dark); border-color: var(--pink-dark); }
  /* 确认后到跳转之间按钮会禁用:pointer-events 一并关掉,免得悬停还变色,看着像还能点 */
  .logout-btn:disabled {
    opacity: .55;
    cursor: default;
    pointer-events: none;
  }

  .profile-skeleton {
    background: var(--card);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
    color: var(--text-3);
    font-size: 14px;
  }

/* 未登录提示 */
  .not-logged-in {
    background: var(--card);
    border-radius: 12px;
    padding: 60px 20px;
    text-align: center;
    color: var(--text-2);
  }
  .not-logged-in button {
    display: inline-block;
    margin-top: 14px;
    padding: 8px 20px;
    background: var(--pink);
    color: var(--on-brand);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
  }
  .not-logged-in button:hover { background: var(--pink-dark); }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .tab-btn {
    position: relative;
    padding: 10px 2px;
    background: none;
    border: none;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-3);
    cursor: pointer;
    font-family: inherit;
  }
  .tab-btn.active { color: var(--text); }
  .tab-btn.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--pink);
    border-radius: 1px;
  }
  /* 选项卡右侧的投稿总数 */
  .tab-count {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-3);
    margin-left: 2px;
  }

  .tab-panel { display: none; }
  .tab-panel.show { display: block; }

/* 投稿列表的排序方式(胶囊按钮,选中的填粉色) */
  .chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .chip {
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--card);
    color: var(--text-2);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: color .15s ease, background .15s ease, border-color .15s ease;
  }
  .chip:hover { border-color: var(--pink); color: var(--pink); }
  /* 放在 :hover 之后: 悬停当前选中的也保持"粉底白字" */
  .chip.active { color: var(--on-brand); background: var(--pink); border-color: var(--pink); }

/* 卡片网格(历史记录 / 收藏夹视频复用) */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px 16px;
  }
  /* 卡片不再有底色、也不整块可点:只有封面和标题是播放页入口 */
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
  }
  .card, .card:link, .card:visited, .card:hover, .card:active,
  .card *, .card *:link, .card *:visited, .card *:hover, .card *:active {
    text-decoration: none;
  }
/* 标题只在光标落在标题文字本身时才变粉 */
  /* 标题文字本身才是入口,样式见下面 .title-text */
  .card.invalid .thumb-wrap { cursor: default; }
  .card.invalid .title-text { cursor: default; }
  .card.invalid .title-text:hover { color: var(--text); }

  .thumb-wrap {
    display: block;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: var(--thumb-bg);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
  }
  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card.invalid .thumb-wrap img { filter: grayscale(1); opacity: .5; }
  .thumb-wrap::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 40%;
    background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));
    pointer-events: none;
  }
  .duration {
    position: absolute;
    right: 6px; bottom: 6px;
    background: rgba(0,0,0,.6);
    color: #fff;
    font-size: 11px;
    padding: 1px 5px;
    border-radius: 3px;
    z-index: 1;
  }
  .page-badge {
    position: absolute;
    left: 6px; top: 6px;
    background: rgba(0,0,0,.6);
    color: #fff;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 3px;
    z-index: 1;
  }
/* 卡片上"删除这条历史 / 取消收藏"的垃圾桶按钮(与标题同一行,贴在右边):
   默认灰色描边图标,悬停变粉加一层浅底,不抢标题注意力 */
  .card-del {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: none;
    border-radius: 4px;
    background: none;
    color: var(--text-3);
    cursor: pointer;
    font-family: inherit;
    transition: color .15s ease, background .15s ease;
  }
  .card-del svg { display: block; }
  .card-del:hover { color: var(--pink); background: var(--hover); }
  .card-del:disabled { cursor: default; opacity: .45; }
  .invalid-badge {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    background: rgba(0,0,0,.35);
    z-index: 1;
  }
  .progress-track {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: rgba(255,255,255,.35);
    z-index: 1;
  }
  .progress-fill { display: block; height: 100%; background: var(--pink); }
  .thumb-stats {
    position: absolute;
    left: 6px; bottom: 6px;
    display: flex;
    gap: 8px;
    color: #fff;
    font-size: 12px;
    z-index: 1;
  }
  .stat-item { display: flex; align-items: center; gap: 3px; }
  .stat-item svg { flex-shrink: 0; }

  .card-body { position: relative; padding: 8px 2px 6px; }
  .title {
    font-size: 14px;
    line-height: 1.4;
    height: 2.8em;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    color: var(--text);
    margin: 0 0 6px;
  }
  /* 标题文字外面包一层行内元素:块级 .title 占满整行(为了两行截断),
     只让文字本身当点击/悬停区,右侧与第二行的留白不响应 */
  .title-text {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: color .12s ease;
  }
  .title-text:hover { color: var(--pink); }
  .author {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 4px;
  }
/* 标题 + 右侧操作按钮(取消收藏 / 移动复制)同一行: 标题占满剩余宽度(仍两行截断),按钮固定右边不横跳 */
  .card-title-row {
    display: flex;
    align-items: flex-start;
    gap: 4px;
  }
  .card-title-row .title { flex: 1; min-width: 0; }
/* UP 信息行: 左边 UP 昵称链接,右边时间(历史记录用);时间不参与省略号计算,故 flex-shrink: 0 */
  .card-info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 4px;
  }
  .card-info-row .author { margin-top: 0; flex: 1; min-width: 0; }
  .card-time {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--text-3);
  }
/* 收藏夹卡片上跟在 UP 名后面的"收藏于 xxx": 与 UP 名同行,过长时随 UP 名一起省略 */
  .author-fav {
    margin-left: 6px;
    color: var(--text-3);
  }
  .author svg { flex-shrink: 0; color: var(--text-3); }
  .author span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    /* :hover 规则直接给这个 span 上色,所以它自己也必须有 transition,
       否则只有 <a> 和角标在渐变、文字是硬跳色 */
    transition: color .12s ease;
  }
/* UP 这一行(角标 + 用户名 + 日期)整体是一个链接,指向 TA 的个人主页,
   角标和文字都在 <a> 里,悬停任意一处三者一起变粉、点击行为一致 */
  .author-link {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    color: var(--text-3);
    text-decoration: none;
    cursor: pointer;
    transition: color .12s ease;
  }
  .author-link svg { transition: color .12s ease; }
  .author-link:hover,
  .author-link:hover svg,
  .author-link:hover .author-name {
    color: var(--pink);
  }

  /* 收藏夹:左边是夹子列表(纵向),右边是这个夹子的内容 */
  .fav-layout {
    display: flex;
    align-items: flex-start;
    gap: 20px;
  }
  .fav-side {
    flex: 0 0 184px;
    min-width: 0;
  }
  .fav-main {
    flex: 1;
    min-width: 0;
  }
  .folder-list {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  /* 夹子名 + 行尾一块"数量/删除按钮"的位置。两者叠在同一处:平时显示数量,
     悬停时数量淡出、删除按钮淡入;数量留在 DOM 里只为占住宽度,所以切换时不跳 */
  .folder-item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .folder-item:hover { background: var(--hover); }
  .folder-item:focus-visible { background: var(--hover); outline: none; }
  /* 当前打开的这个夹子:整行浅粉底 + 名字变主色,和播放页"已激活"一个观感。
     写在 :hover 之后,这样悬停激活项时底色不会被 --hover 盖掉 */
  .folder-item.active,
  .folder-item.active:hover { background: var(--pink-soft); }
  .folder-item.active .folder-title,
  .folder-item.active .folder-count,
  .folder-item.active .folder-icon { color: var(--pink); }
  /* 夹子名前面的文件夹图标:不参与省略号,名字过长时自己截断 */
  .folder-icon {
    position: relative;
    flex-shrink: 0;
    display: flex;
    margin-right: 6px;
    color: var(--text-3);
  }
  .folder-icon svg { display: block; }
  /* 私密夹子:图标右下角挂一个小锁。锁底下垫一块和所在行底色相同的方片,
     否则压在文件夹的轮廓线上看不清;行底色有"默认 / 悬停 / 选中"三种,各跟一条。
     锁的颜色不写死,跟着 .folder-icon 走,选中那行会一起变主色 */
  .folder-lock {
    position: absolute;
    right: -2px;
    bottom: -2px;
    display: flex;
    padding: 1px;
    border-radius: 3px;
    background: var(--bg);
  }
  .folder-item:hover .folder-lock { background: var(--hover); }
  .folder-item.active .folder-lock { background: var(--pink-soft); }
  .folder-lock svg { display: block; }
  .folder-title {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .folder-tail {
    position: relative;
    flex-shrink: 0;
    min-width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
  .folder-count {
    font-size: 12px;
    color: var(--text-3);
    transition: opacity .12s ease;
  }
  /* 有 "..." 按钮的那一行,悬停时数字让位(菜单按钮同时藏在那个位置上) */
  .folder-item:hover .folder-count { opacity: 0; }
  /* 每一行右侧的 "..." 按钮:平时不显示,悬停整行才出现(数字同时让位),
     用 opacity 而不是 display,免得出现/消失时整行宽度跳动 */
  .folder-more {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: none;
    border-radius: 4px;
    background: none;
    color: var(--text-3);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .12s ease, color .15s ease, background .15s ease;
  }
  .folder-more svg { display: block; }
  .folder-item:hover .folder-more,
  .folder-more:focus-visible {
    opacity: 1;
    pointer-events: auto;
  }
  /* 按钮旁边的菜单(遮住同行的数字没关系,菜单一关就恢复)。
     展开/收起用 visibility + opacity + transform 过渡(display 没法过渡),
     收起时往按钮那侧挪 6px,展开就是从这里滑回原位 */
  .folder-menu {
    position: absolute;
    top: 50%;
    left: 100%;
    margin-left: 4px;
    z-index: 30;
    min-width: 96px;
    padding: 4px 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 14px var(--shadow);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-50%) translateX(-6px);
    transition: opacity .16s ease, transform .16s ease, visibility .16s;
  }
  .folder-menu.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(-50%) translateX(0);
  }
  .folder-menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text-2);
    white-space: nowrap;
    cursor: pointer;
  }
  .folder-menu-item svg { flex-shrink: 0; color: var(--text-3); }
  .folder-menu-item:hover { background: var(--hover); color: var(--pink); }
  .folder-menu-item:hover svg { color: var(--pink); }
/* 两套 "..." 菜单的图标统一尺寸:垃圾桶常量是给历史记录那个大按钮用的,
   直接放进菜单会比同菜单里的图标大一圈,所以在菜单里统一钉住 */
  .card-menu-item svg,
  .folder-menu-item svg { width: 16px; height: 16px; }

/* 左侧边栏顶部的"新建收藏夹" */
  .fav-create-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    width: 100%;
    box-sizing: border-box;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text-2);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .fav-create-btn:hover { color: var(--pink); border-color: var(--pink); }

/* 收藏夹卡片标题右侧的"..."按钮(展开操作菜单),与垃圾桶图标同类的方形按钮 */
  .card-more {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: none;
    border-radius: 4px;
    background: none;
    color: var(--text-3);
    font-family: inherit;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: color .15s ease, background .15s ease;
  }
  /* 卡片上的 "..." :悬停/展开时给粉字 + 浅底(侧栏那个夹子行的是另一套,不改这里) */
  .card-more:hover,
  .card-more.active { color: var(--pink); background: var(--hover); }

/* "..."展开的操作菜单:绝对定位在卡片内,不参与网格布局,所以不会把卡片撑高。
   展开/收起同 .folder-menu,收起时往上挪一点,从按钮下方滑出来 */
  .card-menu {
    position: absolute;
    top: 26px;
    right: 0;
    z-index: 20;
    min-width: 104px;
    padding: 4px 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 14px var(--shadow);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity .16s ease, transform .16s ease, visibility .16s;
  }
  .card-menu.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .card-menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text-2);
    white-space: nowrap;
    cursor: pointer;
  }
  .card-menu-item svg { flex-shrink: 0; color: var(--text-3); }
  .card-menu-item:hover { background: var(--hover); color: var(--pink); }
  .card-menu-item:hover svg { color: var(--pink); }

/* 新建收藏夹弹窗的表单:输入框 + "仅自己可见" */
  .fav-create-body { padding: 0 24px; text-align: left; }
  .fav-create-input {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--fill);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color .15s ease;
  }
  .fav-create-input:focus { border-color: var(--pink); }
  .fav-create-input::placeholder { color: var(--text-3); }
  .fav-create-check {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    color: var(--text-2);
    font-size: 13px;
    cursor: pointer;
  }
  /* 勾上之后浏览器给 checkbox 配的勾是黑的(accent-color 只管底色),
     这里要的是"粉底 + 白勾",所以样子自己画在紧跟其后的 .fav-create-box 上;
     原生控件留在原地,只负责状态和键盘焦点,视觉上透明 */
  .fav-create-native {
    position: absolute;
    left: 0;
    top: 50%;
    width: 15px;
    height: 15px;
    margin: -7.5px 0 0;
    opacity: 0;
    cursor: pointer;
  }
  .fav-create-box {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 15px;
    height: 15px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--fill);
  }
  .fav-create-native:checked + .fav-create-box {
    background: var(--pink);
    border-color: var(--pink);
  }
  /* 勾用的是和其它图标一样的描边 path(形状与播放页收藏夹弹窗里那个勾一致,
     盒子更小所以描边按比例加粗),平时不占位,勾选时才出现;
     颜色走 --on-brand,居中交给盒子自己 */
  .fav-create-box svg { display: none; color: var(--on-brand); }
  .fav-create-native:checked + .fav-create-box svg { display: block; }
  .fav-create-native:focus-visible + .fav-create-box {
    outline: 2px solid var(--pink);
    outline-offset: 1px;
  }

  /* 右侧内容区顶部只留夹子名(切换靠左侧边栏,不再有返回按钮) */
  .fav-detail-header { margin-bottom: 16px; }
  .fav-detail-title { font-size: 15px; font-weight: 600; color: var(--text); }

/* 空状态 / 加载 / 错误 */
  .placeholder, .error-box {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-3);
    font-size: 14px;
  }
  .error-box { color: var(--pink-dark); }

  /* 加载失败时的重试按钮(资料卡 / 投稿列表共用) */
  .retry-btn {
    margin-top: 12px;
    padding: 7px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--text-2);
    font-size: 13px;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .retry-btn:hover { color: var(--pink); border-color: var(--pink); }

  .load-more-row {
    text-align: center;
    padding: 24px 0 0;
  }
  .load-more-btn {
    padding: 8px 22px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    background: var(--card);
    color: var(--text-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .load-more-btn:hover:not(:disabled) { color: var(--pink); border-color: var(--pink); }
  .load-more-btn:disabled { cursor: default; opacity: .6; }
  .load-more-tip { font-size: 12.5px; color: var(--text-3); }

/* 轻提示: 删历史/取消收藏这类"一点就完"的操作给一句反馈 */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 48px;
    transform: translate(-50%, 12px);
    max-width: calc(100vw - 48px);
    padding: 9px 18px;
    border-radius: 18px;
    background: var(--toast-bg);
    color: #fff;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    z-index: 300;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

/* --------------------------- 收藏夹弹窗(本页两处共用) ---------------------------
   "复制/移动到收藏夹"弹窗 + "新建/编辑收藏夹"信息弹窗共用这一套;播放页"选择收藏夹"
   用的是同一套类名,样式在那边自己的 <style> 里也留了一份,改这里记得同步。 */
  .fav-folder-mask {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: 200;
    align-items: center;
    justify-content: center;
    display: none;
  }
  .fav-folder-mask.show { display: flex; }
  .fav-folder-modal {
    width: 320px;
    background: var(--card);
    border-radius: 14px;
    padding: 20px 0 0;
    text-align: center;
  }
  .fav-folder-title {
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  /* 列表:夹子名在左(count 列会把名字列挤窄),名字过长省略,不影响数字列 */
  .fav-folder-list {
    max-height: 300px;
    overflow-y: auto;
    padding: 0 12px;
    text-align: left;
  }
  .fav-folder-item {
    display: flex;
    align-items: center;
    padding: 9px 8px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
  }
  .fav-folder-item:hover { background: var(--hover); }
  /* "目标夹子已经有这条内容"的行:列出来但不让选(上游不会真的重复加入)。
     这一条必须排在 .fav-folder-item 之后 —— 权重相同,靠顺序覆盖文字色与光标 */
  .fav-folder-item.is-disabled {
    color: var(--text-3);
    cursor: default;
  }
  .fav-folder-item.is-disabled:hover { background: none; }
  .fav-folder-name {
    flex: 1;
    min-width: 0;
    margin-right: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .fav-folder-count {
    flex-shrink: 0;
    color: var(--text-3);
    font-size: 12px;
  }
  /* 勾选标记:未勾选时只留一个淡色对勾占位,选中后整行变主色 */
  .fav-folder-check {
    flex-shrink: 0;
    display: flex;
    margin-right: 10px;
    color: var(--border);
  }
  .fav-folder-item.checked { color: var(--pink); }
  .fav-folder-item.checked .fav-folder-check { color: var(--pink); }
  .fav-folder-placeholder {
    padding: 12px 10px 16px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-3);
  }
  .fav-folder-error {
    padding: 12px 10px 16px;
    font-size: 13px;
    color: var(--text-2);
  }
  .fav-folder-retry {
    margin-top: 10px;
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--card);
    color: var(--text-2);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .fav-folder-retry:hover { color: var(--text); border-color: var(--text-3); }
  /* 底部操作行:按钮等宽排在中间,数量由弹窗决定(两处都是"取消 + 确定") */
  .fav-folder-foot {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 10px;
    width: 260px;
    margin: 16px auto 20px;
  }
  .fav-folder-btn {
    padding: 7px 0;
    border: none;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .fav-folder-btn.cancel {
    background: var(--fill);
    color: var(--text-2);
  }
  .fav-folder-btn.cancel:hover { background: var(--hover-strong); color: var(--text); }
  .fav-folder-btn.confirm {
    background: var(--pink);
    color: var(--on-brand);
  }
  .fav-folder-btn.confirm:hover { background: var(--pink-dark); }
  .fav-folder-btn:disabled {
    cursor: default;
    opacity: .55;
  }

  @media (max-width: 600px) {
    .content { padding: 16px 14px 40px; }
    .profile-card { flex-wrap: wrap; }
    .profile-actions { width: 100%; }
    .logout-btn { width: 100%; }
    .fav-layout { flex-direction: column; }
    .fav-side { flex: none; width: 100%; }
    /* 窄屏上左右并排会让两边都太窄,改成上下堆叠,夹子列表限高内部滚动 */
    .folder-list { max-height: 168px; overflow-y: auto; }
  }
</style>
</head>

    <div class="tab-panel show" id="panelSpaceVideos">
      <!-- 排序方式:内容由 renderSpaceVideoOrderChips() 生成;
           上游风控降级时那批数据不支持排序,整排按钮会被收起来 -->
      <div class="chips" id="spaceVideoChips"></div>
      <div id="spaceVideoList"></div>
      <div class="load-more-row" id="spaceVideoLoadMoreRow" style="display:none;">
        <button class="load-more-btn" id="spaceVideoLoadMoreBtn">加载更多</button>
      </div>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
/* ----------------------------- 工具函数 ----------------------------- */

/* 统一的"请求 + 解析 JSON"辅助函数: 先取文本再尝试解析,
 * 服务端异常返回 HTML 错误页时不会抛出 "Unexpected token '<'" 这类报错,
 * 而是一律归并成同一句简短提示,细节只留在错误对象里 */
async function fetchJson(url, options) {
  const res = await fetch(url, options);
  const text = await res.text();

  let data = null;
  try {
    data = JSON.parse(text);
  } catch {
    // 非 JSON 响应(服务端异常页 / 网关错误页): 不区分原因,统一文案
    throw new Error('加载失败,请稍后重试');
  }

  // 把状态码挂在返回值上,调用方据此判断 401
  data.__status = res.status;
  return data;
}

// 统一的"加载失败"展示: 一句提示 + 一个重试按钮
function renderLoadError(host, retry) {
  if (!host) return;
  host.innerHTML = `<div class="error-box">加载失败<br>
    <button type="button" class="retry-btn" id="loadRetryBtn">重试</button></div>`;
  const btn = host.querySelector('#loadRetryBtn');
  if (btn && retry) btn.addEventListener('click', retry);
}

function formatCount(n) {
  if (n == null) return '-';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return String(n);
}

// 把接口返回的时长统一换算成秒: /api/space/videos 给 "mm:ss" / "hh:mm:ss" 字符串,
// /api/history、/api/account/favorites 给秒数。带冒号的字符串必须逐段解析,
// 直接 parseInt 会把 "13:05" 截成 13
function parseDurationSeconds(sec) {
  if (typeof sec === 'number') return Number.isFinite(sec) ? sec : 0;
  const str = String(sec == null ? '' : sec).trim();
  if (!str) return 0;
  if (str.includes(':')) {
    const parts = str.split(':').map((p) => parseInt(p, 10) || 0);
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    return parts[0] || 0;
  }
  return parseInt(str, 10) || 0;
}

function formatDuration(sec) {
  const totalSeconds = parseDurationSeconds(sec);
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  if (isNaN(d.getTime())) return '';
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${mm}-${dd}`;
}

// 收藏夹卡片上的"收藏于 xxx": 同年只给月-日,跨年再带年份
function formatFavDate(ts) {
  const text = formatDate(ts);
  if (!text) return '';
  const d = new Date(ts * 1000);
  return d.getFullYear() === new Date().getFullYear() ? text : `${d.getFullYear()}-${text}`;
}

// 历史记录卡片右侧的观看时间: 今天/昨天只写"今天 20:15",更早带上日期,跨年再带年份
function formatDateTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  if (isNaN(d.getTime())) return '';
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  const time = `${hh}:${mi}`;

  const now = new Date();
  const dayStart = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const dayDiff = Math.round((dayStart(now) - dayStart(d)) / 86400000);
  if (dayDiff === 0) return `今天 ${time}`;
  if (dayDiff === 1) return `昨天 ${time}`;
  if (d.getFullYear() === now.getFullYear()) return `${formatDate(ts)} ${time}`;
  return `${d.getFullYear()}-${formatDate(ts)} ${time}`;
}

// 转义工具(escapeHtml / escapeAttr / plainText)统一由 common.js 提供:
// 本页原来那三份副本少转了单引号,且 stripHtml 拿 innerHTML 解析上游文本,
// 他人签名就能借它执行 —— 这是本页存储型 XSS 的来源,一起删掉

// URL 上的 ?mid= 参数决定本页是"我的主页"还是"他人空间",有值且为纯数字才算数
function getUrlMid() {
  const mid = new URLSearchParams(window.location.search).get('mid');
  return mid && /^\d+$/.test(mid) ? mid : null;
}

// URL 上的 ?tab= 指定进页面时打开哪个选项卡,顶栏的"历史记录/收藏夹"入口就靠它直达
function getUrlTab() {
  const tab = new URLSearchParams(window.location.search).get('tab');
  return tab === 'history' || tab === 'favorites' ? tab : null;
}

/* ----------------------------- 顶部导航搜索框 -----------------------------
 * 本页不展示搜索结果,提交后跳转到 /search。搜索历史的存取与下拉交互在 common.js 里。
 * -------------------------------------------------------------------- */

const searchForm = document.getElementById('searchForm');
const searchInput = document.getElementById('keyword');

// 本页不展示搜索结果,提交后统一跳转到独立的搜索结果页。
function goSearch(keyword) {
  window.location.href = `/search?keyword=${encodeURIComponent(keyword)}`;
}

searchForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const keyword = searchInput.value.trim();
  if (!keyword) return;
  addHistory(keyword);
  hideHistoryDropdown();
  goSearch(keyword);
});

/* ----------------------------- 资料卡 ----------------------------- */

async function loadProfile() {
  const urlMid = getUrlMid();
  if (urlMid) {
    loadOtherSpace(urlMid);
    return;
  }

  try {
    const data = await fetchJson('/api/account/profile');
    if (data.__status === 401) {
      renderNotLoggedIn();
      return;
    }
    if (data.code !== 0) {
      renderProfileError(null, loadProfile);
      return;
    }
    renderProfile(data);
    document.getElementById('mainArea').style.display = 'block';
    setupSpaceVideosTab('my', data.mid);
    // 自己的主页默认展示"我的投稿",三个面板都是点开对应选项卡时才加载;
    // 带 ?tab= 进来时直接切过去,不为看一眼历史/收藏先拉一次投稿
    const urlTab = getUrlTab();
    if (urlTab) {
      switchTab(urlTab);
    } else {
      spaceVideoLoaded = true;
      loadSpaceVideos(true);
    }
  } catch (err) {
    renderProfileError(null, loadProfile);
  }
}

/* ----------------------------- 他人空间(?mid=) -----------------------------
 * 与"我的主页"共用同一个页面:顶部资料卡换成公开信息 + 关注按钮,
 * tab 区域把"历史记录/收藏夹"换成"TA 的投稿"。未登录也能看,只有点关注要求登录。
 * -------------------------------------------------------------------- */

let spaceMid = null;
// 投稿面板当前展示的是不是"我的投稿"(只影响空列表的文案: 你 / TA)
let spaceVideoIsSelf = true;
// 选项卡上的文案("我的投稿" / "TA 的投稿");总数拼在同一个按钮里,所以文案单独存一份
let spaceVideoTabLabel = '我的投稿';

// 在选项卡右侧显示投稿总数。传 null 表示"没有可信的总数": 上游降级数据
// (recArchivesByKeywords)只有最近 50 条且不带总数,显示出来反而误导
function updateSpaceVideoTabCount(total) {
  const tab = document.getElementById('tabSpaceVideos');
  tab.innerHTML = typeof total === 'number' && total > 0
    ? `${spaceVideoTabLabel} <span class="tab-count">${formatCount(total)}</span>`
    : spaceVideoTabLabel;
}

/* ----------------------------- 投稿排序方式 -----------------------------
 * 三个值后端原样透传给上游 arc/search,对应"最新发布 / 最多播放 / 最多收藏"。
 * 上游风控降级(recArchivesByKeywords)时数据不支持排序,整排按钮收起来,免得点了没反应。
 * -------------------------------------------------------------------- */
const SPACE_ORDERS = [['pubdate', '最新发布'], ['click', '最多播放'], ['stow', '最多收藏']];
let spaceVideoOrder = 'pubdate';
// 已有请求在飞时又点了排序:等这次回来再按新排序重拉一遍,
// 否则那次点击会被 loadSpaceVideos 开头的"正在加载就返回"吃掉
let spaceVideoReloadPending = false;

function renderSpaceVideoOrderChips() {
  const box = document.getElementById('spaceVideoChips');
  if (spaceVideoFallback) {
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  box.style.display = 'flex';
  box.innerHTML = SPACE_ORDERS.map(([key, label]) =>
    `<button type="button" class="chip${key === spaceVideoOrder ? ' active' : ''}" data-order="${key}">${label}</button>`
  ).join('');
}

document.getElementById('spaceVideoChips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  // 点已经选中的那个不用重拉
  if (!chip || chip.dataset.order === spaceVideoOrder) return;
  spaceVideoOrder = chip.dataset.order;
  renderSpaceVideoOrderChips();
  if (spaceVideoLoading) spaceVideoReloadPending = true;
  else loadSpaceVideos(true); // 换了排序:清空列表,从第一页按新排序重来
});

// 投稿面板在两种场景下复用: 自己的主页 = "我的投稿",他人空间 = "TA 的投稿"。
// 这里只定下选项卡文案和"这份投稿属于谁",渲染/分页/加载更多走同一套逻辑
function setupSpaceVideosTab(mode, mid) {
  spaceVideoTabLabel = mode === 'my' ? '我的投稿' : 'TA 的投稿';
  // 换了人就把上一个账号/UP 的总数清掉,等新数据回来再填
  updateSpaceVideoTabCount(null);
  document.getElementById('tabSpaceVideos').style.display = '';
  spaceMid = mid != null && mid !== '' ? String(mid) : null;
  // 空列表的文案要区分"你"和"TA"
  spaceVideoIsSelf = mode === 'my';
  renderSpaceVideoOrderChips();
}

async function loadOtherSpace(mid) {
  try {
    const data = await fetchJson(`/api/up/info?mid=${mid}`);
    if (data.code !== 0) {
      // 只有"该用户不存在"这类需要明确告知的情况才显示后端文案,其余统一"加载失败"
      renderProfileError(/不存在/.test(data.message || '') ? data.message : null, () => loadOtherSpace(mid));
      return;
    }
    // 这个 mid 就是自己的:走完整版"我的主页"
    if (data.isSelf) {
      window.location.replace('/account');
      return;
    }

    // 他人空间:选项卡换成"TA 的投稿"
    setupSpaceVideosTab('other', mid);
    renderOtherProfile(data);
    setupSpaceTab();
    document.getElementById('mainArea').style.display = 'block';
    loadSpaceVideos(true);
  } catch (err) {
    renderProfileError(null, () => loadOtherSpace(mid));
  }
}

function renderOtherProfile(data) {
  const following = data.following != null ? formatCount(data.following) : '-';
  const follower = data.follower != null ? formatCount(data.follower) : '-';
  const followBtn = data.isFollowing
    ? `<button class="rel-follow-btn following" type="button" id="spaceFollowBtn" data-mid="${data.mid}" data-following="1">已关注</button>`
    : `<button class="rel-follow-btn" type="button" id="spaceFollowBtn" data-mid="${data.mid}" data-following="0">+ 关注</button>`;

  document.getElementById('profileArea').innerHTML = `
    <div class="profile-card">
      <img class="profile-avatar" src="${data.avatar || ''}" referrerpolicy="no-referrer" alt="" onerror="this.style.visibility='hidden'" />
      <div class="profile-info">
        <div class="profile-name-row">
          <span class="profile-name">${escapeHtml(data.name)}</span>
        </div>
        <p class="profile-uid">UID: ${data.mid || '-'}</p>
        ${data.sign ? `<p class="profile-sign">${escapeHtml(data.sign)}</p>` : ''}
        <div class="profile-stats">
          <!-- 与"我的主页"一样,两个数字可点开看列表;带上 mid 就是看 TA 的列表 -->
          <span class="stat-link" onclick="openRelationsModal('following', ${data.mid || 0})">关注 <b>${following}</b></span>
          <span class="stat-link" onclick="openRelationsModal('follower', ${data.mid || 0})">粉丝 <b>${follower}</b></span>
        </div>
      </div>
      <div class="profile-actions">
        ${followBtn}
      </div>
    </div>
  `;
  document.getElementById('spaceFollowBtn').addEventListener('click', handleSpaceFollowClick);
  document.title = data.name ? `${data.name}的个人空间` : '个人空间 - B站视频搜索器';
}

async function handleSpaceFollowClick() {
  if (!isUserLoggedIn) { openLoginModal(); return; }

  const btn = document.getElementById('spaceFollowBtn');
  const mid = btn.dataset.mid;
  const nextFollow = btn.dataset.following !== '1';
  btn.disabled = true;
  try {
    const data = await fetchJson('/api/up/follow', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mid, follow: nextFollow }),
    });
    if (data.code !== 0) {
      return;
    }
    btn.classList.toggle('following', nextFollow);
    btn.dataset.following = nextFollow ? '1' : '0';
    btn.textContent = nextFollow ? '已关注' : '+ 关注';
  } catch (err) {
    // 关注失败保持按钮原状即可,不弹窗也不打日志
  } finally {
    btn.disabled = false;
  }
}

/* 他人空间(?mid=)的选项卡布局: 只保留"TA 的投稿"(自己的投稿请回 /account 看) */
function setupSpaceTab() {
  document.getElementById('tabHistory').style.display = 'none';
  document.getElementById('tabFavorites').style.display = 'none';
  document.getElementById('tabHistory').classList.remove('active');
  document.getElementById('tabFavorites').classList.remove('active');
  document.getElementById('panelHistory').classList.remove('show');
  document.getElementById('panelFavorites').classList.remove('show');

  document.getElementById('tabSpaceVideos').classList.add('active');
  document.getElementById('panelSpaceVideos').classList.add('show');
  activeTab = 'spaceVideos';
  spaceVideoLoaded = true; // 下面紧接着就会拉第一页,不用等点选项卡
}

// 投稿列表的卡片: 缩略图上叠"播放量 / 弹幕数"(与首页样式一致),底部只留发布日期。
// 不显示 UP 昵称也不链 TA 的主页: 整个面板本来就是某个人的投稿,每张卡片再重复作者没有意义
function spaceVideoCardHTML(item) {
  return videoCardHTML({
    href: buildPlayerHref(item.bvid),
    pic: item.pic,
    title: item.title,
    meta: item.pubdate ? formatDate(item.pubdate) : '',
    extraStat: thumbStatsHTML(item.play, item.danmaku),
    // 后端已把上游的 "mm:ss" 字符串和兜底接口的秒数统一成 durationSeconds;
    // 老数据没有这个字段时 formatDuration 自己也能解析带冒号的字符串
    duration: item.durationSeconds != null ? item.durationSeconds : item.duration,
  });
}

let spaceVideoList = [];
let spaceVideoPage = 1;
let spaceVideoHasMore = true;
let spaceVideoLoading = false;
let spaceVideoError = '';
let spaceVideoFallback = false;
// 投稿列表是否已经拉过第一页(改成点开对应选项卡才加载)
let spaceVideoLoaded = false;

function renderSpaceVideoList() {
  const box = document.getElementById('spaceVideoList');
  if (!spaceVideoList.length) {
    // 加载失败只显示统一的"加载失败 + 重试",不暴露风控等上游细节
    if (spaceVideoError) {
      box.innerHTML = `<div class="error-box">加载失败<br>
        <button type="button" class="retry-btn" id="spaceRetryBtn">重试</button></div>`;
      const btn = box.querySelector('#spaceRetryBtn');
      if (btn) btn.addEventListener('click', () => loadSpaceVideos(true));
      return;
    }
    box.innerHTML = spaceVideoLoading
      ? `<div class="placeholder">正在加载...</div>`
      : `<div class="placeholder">${spaceVideoIsSelf ? '你' : 'TA'}还没有发布过投稿</div>`;
    return;
  }
  // 降级数据(arc/search 被风控时后端用 recArchivesByKeywords 兜底)静默生效,
  // 降级数据静默生效,不在界面上额外提示;它不支持翻页,所以下面会隐藏"加载更多"
  box.innerHTML = `<div class="grid">${spaceVideoList.map(spaceVideoCardHTML).join('')}</div>`;
}

async function loadSpaceVideos(reset) {
  if (spaceVideoLoading) return;
  // 资料卡一定会带回自己的 mid(他人空间则来自 ?mid=)。真拿不到时不要用 mid=null
  // 去请求上游,直接按"加载失败"展示,至少还有重试按钮
  if (!spaceMid) {
    spaceVideoList = [];
    spaceVideoHasMore = false;
    spaceVideoError = '加载失败';
    renderSpaceVideoList();
    updateSpaceVideoLoadMoreUI();
    return;
  }
  if (reset) {
    spaceVideoList = [];
    spaceVideoPage = 1;
    spaceVideoHasMore = true;
    spaceVideoError = '';
    spaceVideoFallback = false;
    updateSpaceVideoTabCount(null);
    renderSpaceVideoOrderChips();
  }
  if (!spaceVideoHasMore) return;

  spaceVideoLoading = true;
  renderSpaceVideoList();
  updateSpaceVideoLoadMoreUI();

  try {
    const data = await fetchJson(`/api/space/videos?mid=${spaceMid}&pn=${spaceVideoPage}&order=${spaceVideoOrder}`);
    if (data.code !== 0) throw new Error(data.message || '获取投稿列表失败');
    if (!Array.isArray(data.list)) throw new Error('投稿列表数据格式异常');

    spaceVideoError = '';
    // fallback = 后端因风控降级用了 recArchivesByKeywords,这批数据不支持排序/翻页
    spaceVideoFallback = !!data.fallback;
    // 总数只信 arc/search 的 page.count;降级的那批只有最近 50 条,不能当总数
    updateSpaceVideoTabCount(spaceVideoFallback ? null : data.total);
    // 降级数据不支持排序,顺手把排序按钮收起来(正常数据则保证它显示着)
    renderSpaceVideoOrderChips();
    spaceVideoList = spaceVideoList.concat(data.list);
    spaceVideoHasMore = !!data.hasMore;
    spaceVideoPage += 1;
  } catch (err) {
    // 只有"首页就失败"才停止继续加载;已拿到数据后翻页失败,保留现有列表并停掉按钮
    if (!spaceVideoList.length) {
      spaceVideoError = '加载失败';
      spaceVideoHasMore = false;
    }
  } finally {
    spaceVideoLoading = false;
    renderSpaceVideoList();
    updateSpaceVideoLoadMoreUI();
    // 加载途中点过排序:按新排序重来一遍
    if (spaceVideoReloadPending) {
      spaceVideoReloadPending = false;
      loadSpaceVideos(true);
    }
  }
}

function updateSpaceVideoLoadMoreUI() {
  const row = document.getElementById('spaceVideoLoadMoreRow');
  // 首页就失败时不显示"加载更多",避免用户反复点、反复撞风控
  if (spaceVideoError && !spaceVideoList.length) {
    row.style.display = 'none';
    return;
  }
  // 降级数据只有这一批,没有"翻页"这回事;显示"没有更多了"会让人误以为这就是全部投稿
  if (spaceVideoFallback) {
    row.style.display = 'none';
    return;
  }
  if (!spaceVideoList.length && !spaceVideoLoading) {
    row.style.display = 'none';
    return;
  }
  if (!spaceVideoHasMore) {
    row.innerHTML = `<span class="load-more-tip">没有更多了</span>`;
    row.style.display = 'block';
    return;
  }
  row.style.display = 'block';
  row.innerHTML = `<button class="load-more-btn" id="spaceVideoLoadMoreBtn" ${spaceVideoLoading ? 'disabled' : ''}>${spaceVideoLoading ? '加载中...' : '加载更多'}</button>`;
  document.getElementById('spaceVideoLoadMoreBtn').addEventListener('click', () => loadSpaceVideos(false));
}

function renderNotLoggedIn() {
  document.title = '个人主页 - B站视频搜索器';
  document.getElementById('profileArea').innerHTML = `
    <div class="not-logged-in">
      <p>还没有登录 B 站账号,登录后才能查看个人主页</p>
      <button type="button" onclick="openLoginModal()">前往登录</button>
    </div>
  `;
}

// 资料卡区域的失败展示: 默认"加载失败" + 重试按钮,只有"该用户不存在"这类
// 需要明确告知用户的情况才传 msg
function renderProfileError(msg, retry) {
  document.title = '个人主页 - B站视频搜索器';
  const area = document.getElementById('profileArea');
  area.innerHTML = `<div class="error-box">${escapeHtml(msg || '加载失败')}<br>
    <button type="button" class="retry-btn" id="profileRetryBtn">重试</button></div>`;
  const btn = area.querySelector('#profileRetryBtn');
  if (btn && retry) btn.addEventListener('click', retry);
}

function renderProfile(p) {
  const badges = [];
  if (p.level != null) badges.push(`<span class="badge badge-level">LV${p.level}</span>`);
  if (p.vipType > 0) {
    const vipText = p.vipType === 1 ? '月度大会员' : '大会员';
    badges.push(`<span class="badge badge-vip">${vipText}</span>`);
  }

  const money = typeof p.money === 'number'
    ? (Number.isInteger(p.money) ? p.money : p.money.toFixed(1))
    : '-';
  const following = p.following != null ? formatCount(p.following) : '-';
  const follower = p.follower != null ? formatCount(p.follower) : '-';

  document.getElementById('profileArea').innerHTML = `
    <div class="profile-card">
      <img class="profile-avatar" src="${p.avatar || ''}" referrerpolicy="no-referrer" alt="" onerror="this.style.visibility='hidden'" />
      <div class="profile-info">
        <div class="profile-name-row">
          <span class="profile-name">${escapeHtml(p.uname)}</span>
          ${badges.join('')}
        </div>
        <p class="profile-uid">UID: ${p.mid || '-'}</p>
        ${p.sign ? `<p class="profile-sign">${escapeHtml(p.sign)}</p>` : ''}
        <div class="profile-stats">
          <span>硬币 <b>${money}</b></span>
          <span class="stat-link" onclick="openRelationsModal('following')">关注 <b>${following}</b></span>
          <span class="stat-link" onclick="openRelationsModal('follower')">粉丝 <b>${follower}</b></span>
        </div>
      </div>
      <div class="profile-actions">
        <button class="logout-btn" type="button" id="logoutBtn">退出登录</button>
      </div>
    </div>
  `;
  document.getElementById('logoutBtn').addEventListener('click', handleLogout);
  document.title = p.uname ? `${p.uname}的个人主页` : '个人主页 - B站视频搜索器';
}

async function handleLogout() {
  if (!window.confirm('确定退出登录吗？退出后需要重新扫码登录 B 站账号。')) return;

  // 请求在路上时禁用按钮,避免连点发第二次退出(第二次登录态已失效,只会白报一次错)
  const btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  try {
    await fetch('/api/login/logout', { method: 'POST' });
  } catch (err) {
  }
  // 个人主页离开登录态就没有内容可看了,退出后直接回首页
  window.location.href = '/';
}

/* ----------------------------- 关注/粉丝列表弹窗 -----------------------------
 * 点击资料卡上的"关注"/"粉丝"数字打开。两个接口分页方式一致,共用一套状态和渲染逻辑,
 * 只是 type 不同(following/follower)对应不同接口和标题。
 * 第二个参数是"看谁的列表": 不传 = 自己,传 mid = 他人空间。
 * 看别人的列表要求登录(没登录就直接弹扫码登录);对方设了隐私时上游返回一句可读提示,
 * 这里原样显示在弹窗里。
 * -------------------------------------------------------------------- */

let relType = 'following';
// 当前弹窗展示的是谁的列表: null = 自己,字符串 = 别人的 mid
let relMid = null;
let relList = [];
let relPage = 1;
let relHasMore = true;
let relLoading = false;
// 列表加载失败的原因(隐私设置 / 风控 / 网络),空串表示没出错
let relError = '';

function openRelationsModal(type, mid) {
  relType = type;
  relMid = mid != null && mid !== '' ? String(mid) : null;
  // 看别人的列表要登录态,没登录就别打开一个必然报错的弹窗
  if (relMid && !isUserLoggedIn) {
    openLoginModal();
    return;
  }

  relList = [];
  relPage = 1;
  relHasMore = true;
  relLoading = false;
  relError = '';

  // 自己的列表叫"我的关注/我的粉丝";别人的列表带上 TA 的昵称,免得看串
  let title;
  if (relMid) {
    const name = (document.querySelector('.profile-name') || {}).textContent || 'TA';
    title = `${name}的${type === 'following' ? '关注' : '粉丝'}`;
  } else {
    title = type === 'following' ? '我的关注' : '我的粉丝';
  }
  document.getElementById('relModalTitle').textContent = title;
  document.getElementById('relModalMask').style.display = 'flex';
  document.getElementById('relModalBody').scrollTop = 0;
  renderRelationsList();
  loadRelationsList();
}

function closeRelationsModal() {
  document.getElementById('relModalMask').style.display = 'none';
}

document.getElementById('relModalMask').addEventListener('click', (e) => {
  if (e.target.id === 'relModalMask') closeRelationsModal();
});

async function loadRelationsList() {
  if (relLoading || !relHasMore) return;
  relLoading = true;
  updateRelLoadMoreUI();

  const apiPath = relType === 'following' ? '/api/account/followings' : '/api/account/followers';
  const params = new URLSearchParams({ pn: String(relPage) });
  if (relMid) params.set('mid', relMid);
  try {
    const data = await fetchJson(`${apiPath}?${params.toString()}`);
    if (data.__status === 401) {
      closeRelationsModal();
      // 自己主页上的 401 = 登录态没了,整页换成登录提示;他人空间本来就可能匿名浏览,
      // 这时只弹登录框,别把刚看到的资料卡顶掉
      if (relMid) openLoginModal();
      else renderNotLoggedIn();
      return;
    }
    if (data.code !== 0) throw new Error(data.message || (relType === 'following' ? '获取关注列表失败' : '获取粉丝列表失败'));

    relError = '';
    relList = relList.concat(data.list || []);
    relHasMore = !!data.hasMore;
    relPage += 1;
  } catch (err) {
    // 失败原因记下来交给 renderRelationsList 显示(首页就失败才算整体失败;
    // 已拿到数据后翻页失败,保留现有列表、把按钮停掉即可)
    if (!relList.length) relError = err.message || '加载失败,请稍后重试';
  } finally {
    relLoading = false;
    renderRelationsList();
    updateRelLoadMoreUI();
  }
}

function relItemHTML(u) {
  const followBtn = u.isFollowing
    ? `<button class="rel-follow-btn following" type="button" data-mid="${u.mid}" data-following="1">已关注</button>`
    : `<button class="rel-follow-btn" type="button" data-mid="${u.mid}" data-following="0">+ 关注</button>`;
  return `
    <div class="rel-item">
      <div class="rel-user" data-mid="${u.mid || 0}" style="cursor:pointer; display:flex; align-items:center; gap:12px; min-width:0; flex:1;">
        <img class="rel-avatar" src="${u.avatar || ''}" referrerpolicy="no-referrer" alt="" onerror="this.style.visibility='hidden'" />
        <div class="rel-info">
          <div class="rel-name">${escapeHtml(u.name)}</div>
          <div class="rel-sign">${u.sign ? escapeHtml(u.sign) : '暂无简介'}</div>
        </div>
      </div>
      ${followBtn}
    </div>
  `;
}

function renderRelationsList() {
  const box = document.getElementById('relList');
  if (!relList.length) {
    // 失败提示要在这里渲染,不能在 catch 里直接写 innerHTML:
    // loadRelationsList 的 finally 会紧接着再调一次本函数,刚写进去的错误框会被空列表文案覆盖
    if (relError) {
      box.innerHTML = `<div class="error-box">${escapeHtml(relError)}<br>
        <button type="button" class="retry-btn" id="relRetryBtn">重试</button></div>`;
      return;
    }
    const empty = relType === 'following' ? '还没有关注任何人' : '还没有粉丝';
    box.innerHTML = relLoading
      ? `<div class="placeholder">正在加载...</div>`
      : `<div class="placeholder">${relMid ? `TA ${empty}` : empty}</div>`;
    return;
  }
  box.innerHTML = relList.map(relItemHTML).join('');
}

// 关注/取关: 列表项里的按钮共用同一套逻辑
document.getElementById('relList').addEventListener('click', async (e) => {
  const retryBtn = e.target.closest('#relRetryBtn');
  if (retryBtn) {
    loadRelationsList();
    return;
  }
  // 点头像/昵称进 TA 的空间页,不触发关注按钮的逻辑
  const userEl = e.target.closest('.rel-user');
  if (userEl) {
    const mid = userEl.dataset.mid;
    if (mid && mid !== '0') {
      window.location.href = `/account?mid=${mid}`;
    }
    return;
  }

  const btn = e.target.closest('.rel-follow-btn');
  if (!btn) return;

  // 关注别人要有登录态(比如匿名看他人空间时),没登录就弹扫码登录,别让按钮点了没反应
  if (!isUserLoggedIn) { openLoginModal(); return; }

  const mid = btn.dataset.mid;
  const nextFollow = btn.dataset.following !== '1';
  btn.disabled = true;
  try {
    const data = await fetchJson('/api/up/follow', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mid, follow: nextFollow }),
    });
    if (data.code !== 0) {
      return;
    }
    const target = relList.find((u) => String(u.mid) === String(mid));
    if (target) target.isFollowing = nextFollow;
    btn.classList.toggle('following', nextFollow);
    btn.dataset.following = nextFollow ? '1' : '0';
    btn.textContent = nextFollow ? '已关注' : '+ 关注';
  } catch (err) {
  } finally {
    btn.disabled = false;
  }
});

function updateRelLoadMoreUI() {
  const row = document.getElementById('relLoadMoreRow');
  if (!relList.length && !relLoading) {
    row.style.display = 'none';
    return;
  }
  if (!relHasMore) {
    row.innerHTML = `<span class="load-more-tip">没有更多了</span>`;
    row.style.display = 'block';
    return;
  }
  row.style.display = 'block';
  row.innerHTML = `<button class="load-more-btn" id="relLoadMoreBtn" ${relLoading ? 'disabled' : ''}>${relLoading ? '加载中...' : '加载更多'}</button>`;
  document.getElementById('relLoadMoreBtn').addEventListener('click', () => loadRelationsList());
}

// "我的投稿"是默认选项卡,初值与 HTML 上的 active/show 对应
let activeTab = 'spaceVideos';
let favLoaded = false;
let historyLoaded = false;

// 当前选项卡回写到地址栏的 ?tab=:默认的"我的投稿"不带参数。
// 用 replaceState,切选项卡不往浏览历史里塞记录,返回键行为不变
function syncUrlTab(tab) {
  const url = new URL(window.location.href);
  if (tab === 'spaceVideos') url.searchParams.delete('tab');
  else url.searchParams.set('tab', tab);
  history.replaceState(null, '', url);
}

function switchTab(tab) {
  if (tab === activeTab) return;
  activeTab = tab;
  syncUrlTab(tab);
  document.getElementById('tabSpaceVideos').classList.toggle('active', tab === 'spaceVideos');
  document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
  document.getElementById('tabFavorites').classList.toggle('active', tab === 'favorites');
  document.getElementById('panelSpaceVideos').classList.toggle('show', tab === 'spaceVideos');
  document.getElementById('panelHistory').classList.toggle('show', tab === 'history');
  document.getElementById('panelFavorites').classList.toggle('show', tab === 'favorites');

  // 三个面板都是"第一次点开才加载"(「我的投稿」进页面时已加载过)
  if (tab === 'spaceVideos' && !spaceVideoLoaded) {
    spaceVideoLoaded = true;
    loadSpaceVideos(true);
  }
  if (tab === 'history' && !historyLoaded) {
    historyLoaded = true;
    loadHistory(true);
  }
  if (tab === 'favorites' && !favLoaded) {
    favLoaded = true;
    loadFavFolders();
  }
}

// rightMeta 贴在该行最右边(历史记录用来显示观看时间,左边 UP、右边时间)。
// actionHTML 是标题右侧的操作按钮(删历史/取消收藏/移动复制),与标题同一行,由卡片点击委托优先拦截。

function videoCardHTML({ href, pic, title, author, duration, authorMid, favTime, meta, rightMeta, badgeText, progressPct, durationText, extraStat, actionHTML, invalid }) {
  const cls = invalid ? 'card invalid' : 'card';
  const linkAttrs = invalid ? '' : ` href="${escapeAttr(href)}"`;
  const mid = authorMid || 0;
  const favTag = favTime ? `<span class="author-fav">· 收藏于 ${formatFavDate(favTime)}</span>` : '';
  const authorHTML = author
    ? `<div class="author">
          <a class="author-link" href="/account?mid=${escapeAttr(String(mid))}" data-mid="${mid}">
            <svg width="16" height="13" viewBox="0 0 24 20" xmlns="http://www.w3.org/2000/svg">

            </svg>
            <span class="author-name">${escapeHtml(author)}</span>${favTag}

    : (meta ? `<div class="author"><span>${meta}</span></div>` : '');

    ? `<div class="card-info-row">${authorHTML}${rightMeta ? `<span class="card-time">${rightMeta}</span>` : ''}</div>`

  return `

        <img src="${pic}" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.style.opacity=0" />
        ${badgeText ? `<span class="page-badge">${badgeText}</span>` : ''}
        ${extraStat ? `<span class="thumb-stats">${extraStat}</span>` : ''}
        <span class="duration">${durationText || formatDuration(duration)}</span>
        ${invalid ? `<span class="invalid-badge">视频已失效</span>` : ''}
        ${progressPct != null ? `<span class="progress-track"><span class="progress-fill" style="width:${progressPct}%"></span></span>` : ''}
      </a>
      <div class="card-body">
        <div class="card-title-row">
          <p class="title" title="${escapeAttr(plainText(title))}"><a class="title-text"${linkAttrs}>${title}</a></p>
          ${actionHTML || ''}
        </div>
        ${infoHTML}
      </div>
    </div>
  `;
}

/* ----------------------------- 卡片上的 "..." 操作菜单 -----------------------------
 * 收藏夹卡片的操作(取消收藏 / 复制到 / 移动到)收在一个 "..." 菜单里,
 * 菜单挂在卡片上(绝对定位),不参与网格布局,展开时不会把卡片撑高。
 * 卡片和侧栏那两套菜单的逻辑完全一样,只差按钮上的 aria-expanded,
 * 所以共用这个控制器:悬停 "..." 按钮展开,离开按钮或菜单收起,同时只开一个。
 * close() 是幂等的,点菜单项时也调它。
 * -------------------------------------------------------------------- */

function createMenuController(triggerSelector, menuSelector, syncAria) {
  let open = null; // 当前展开的那一个: { button, menu }

  function close() {
    if (!open) return;
    // 列表重绘过时这两个元素可能已经不在文档里了,改它们没有意义
    if (open.menu.isConnected) open.menu.classList.remove('show');
    if (open.button.isConnected) {
      open.button.classList.remove('active');
      if (syncAria) open.button.setAttribute('aria-expanded', 'false');
    }
    open = null;
  }

  function show(button, menu) {
    if (!button || !menu || (open && open.button === button)) return;
    close();
    menu.classList.add('show');
    button.classList.add('active');
    if (syncAria) button.setAttribute('aria-expanded', 'true');
    open = { button, menu };
  }

  // 按钮与菜单相差一层 DOM(在父元素里就能找到对方),指针落在任一个上都算展开区域
  function handleOver(e) {
    const button = e.target.closest(triggerSelector);
    const menu = button ? button.parentElement.querySelector(menuSelector) : e.target.closest(menuSelector);
    if (!menu) return;
    show(button || menu.parentElement.querySelector(triggerSelector), menu);
  }

  // 指针在按钮与菜单之间来回不算离开,挪到别处就收起
  function handleOut(e) {
    const to = e.relatedTarget;
    if (to && to.closest && (to.closest(triggerSelector) || to.closest(menuSelector))) return;
    close();
  }

  // 列表会整块重绘,逐个元素挂监听会被重绘丢掉,所以委托在容器上
  function bind(container) {
    container.addEventListener('mouseover', handleOver);
    container.addEventListener('mouseout', handleOut);
  }

  return { close, bind };
}

// 菜单项自带图标,免得每张卡片重复写一大段 svg;data-action 由两种菜单共用

function favCardMenuHTML() {
  return `<div class="card-menu">
      ${cardMenuItemHTML('unfav', '取消收藏', { icon: CARD_ACTION_ICON.trash })}
      ${cardMenuItemHTML('copy', '复制到', { icon: CARD_ACTION_ICON.copy })}

// 点菜单项时把这一项相关的 id 一起带过去:移动/复制要内容 id + 源夹子,取消收藏要 aid + 标题
function runCardMenuAction(menuItem) {
  const { action } = menuItem.dataset;
  // 菜单项自己不带这些 id:它们来自同一张卡片上的 "..." 按钮,点哪一项都先取一遍
  const { menuId, menuMediaId, menuType, menuTitle } = menuItem.closest('.card').querySelector('.card-more').dataset;
  cardMenu.close();
  if (action === 'copy' || action === 'move') {
    openFavPick({ menuId, menuMediaId, menuType }, action);
    return;
  }
  if (action === 'unfav') {
    // 复用删历史那条路径:卡片在失败时才有"重试"可言,所以整张卡片一起关掉
    handleCardAction({ dataset: { unfav: menuId, mediaId: menuMediaId, title: menuTitle }, disabled: false }, menuItem.closest('.card'));
  }
}

/* ----------------------------- 删历史 / 取消收藏 -----------------------------
 * 两个操作都是真删: 上游删掉之后才改本地列表,所以刷新页面不会"复活"。
 * 失败时只弹一句提示并把按钮(或整张卡片)恢复可点,列表保持不变。
 * favCard 是收藏夹卡片走 "..." 菜单时的兜底:菜单按下去就收了,得靠卡片本身恢复状态。
 * -------------------------------------------------------------------- */
async function handleCardAction(btn, favCard) {
  // 失败要恢复可点的那个东西:普通按钮就是它自己;走 "..." 菜单时菜单已经收了,
  // 换成整张卡片(它是个 div,没有 disabled,只当重复提交的保护位)
  const target = favCard || btn;
  if (!favCard && btn.disabled) return;
  const historyAid = btn.dataset.delHistory;
  const favAid = btn.dataset.unfav;
  if (!historyAid && !favAid) return;

  // "取消收藏"动的是用户自己整理过的数据,先确认;删除单条历史记录不确认
  if (favAid && !window.confirm(`确定取消收藏「${btn.dataset.title || ''}」吗？`)) return;

  target.disabled = true;
  try {
    const data = await fetchJson(
      historyAid ? '/api/account/history/delete' : '/api/account/favorites/remove',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(
          historyAid
            ? { aid: historyAid }
            : { aid: favAid, mediaId: btn.dataset.mediaId || favDetailMediaId }
        ),
      }
    );
    if (data.__status === 401) {
      renderNotLoggedIn();
      return;
    }
    if (data.code !== 0) {
      showToast(data.message || '操作失败,请稍后重试');
      target.disabled = false;
      return;
    }

    if (historyAid) {
      historyList = historyList.filter((it) => String(it.aid) !== String(historyAid));
      renderHistoryList();
      updateHistoryLoadMoreUI();
      showToast('已删除这条历史记录');
    } else {
      favDetailList = favDetailList.filter((it) => String(it.aid) !== String(favAid));
      renderFavDetailList();
      updateFavLoadMoreUI();
      // 收藏夹列表上的数量也要跟着减,不然返回上一级数字对不上
      const folder = favFolders.find((f) => String(f.id) === String(favDetailMediaId));
      if (folder && folder.mediaCount > 0) {
        folder.mediaCount -= 1;
        renderFavFolders();
      }
      showToast('已取消收藏');
    }
  } catch (err) {
    showToast(err.message || '操作失败,请稍后重试');
    target.disabled = false;
  }
}

// 轻提示: 默认 1.8 秒后自己淡出,重要提示可传更长的时长
let toastTimer = null;
function showToast(text, durationMs) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), durationMs || 1800);
}

function buildPlayerHref(bvid, page, seekSeconds) {
  const params = new URLSearchParams();
  params.set('bv', bvid);
  if (page && page > 1) params.set('p', String(page));
  if (seekSeconds && seekSeconds > 0) params.set('t', String(seekSeconds));
  return `/player?${params.toString()}`;
}

/* ----------------------------- 历史记录 ----------------------------- */

let historyList = [];
let historyCursor = { max: 0, view_at: 0, business: '' };
let historyHasMore = true;
let historyLoading = false;
// 历史记录加载失败的原因,空串表示没出错(用来和"真的没有历史"区分开)
let historyError = '';

function historyCardHTML(item) {
  // 时长统一换算成秒再参与进度条计算,上游若给 "mm:ss" 字符串也能正确解析
  const totalSec = parseDurationSeconds(item.duration);
  const seek = item.progress > 0 ? item.progress : 0;
  const href = buildPlayerHref(item.bvid, item.page, seek);
  const progressPct = totalSec > 0
    ? (item.progress < 0 ? 100 : Math.min(100, (item.progress / totalSec) * 100))
    : (item.progress < 0 ? 100 : 0);
  const badgeText = item.page > 1 ? `P${item.page}` : '';

  // 时长处标出上次观看位置: progress 为正数显示"看到位置 / 总时长",
  // 已看完(-1)或还没播放(0)时与其他卡片一样只显示总时长
  const durationText = item.progress > 0
    ? `${formatDuration(item.progress)} / ${formatDuration(totalSec)}`
    : formatDuration(totalSec);

  // 标题右边的"删除这条历史记录"按钮。aid 是删除接口要的 kid=archive_{aid};
  // 老数据/异常数据没有 aid 时不给按钮,免得点了必然失败
  const actionHTML = item.aid
    ? `<button type="button" class="card-del" data-del-history="${item.aid}" title="删除这条历史记录" aria-label="删除这条历史记录">${TRASH_ICON_SVG}</button>`
    : '';

  return videoCardHTML({
    href,
    pic: item.pic,
    title: item.title,
    author: item.author || '',
    authorMid: item.authorMid || 0,
    // 这条历史是什么时候看的,贴在 UP 昵称那一行的最右边
    rightMeta: item.viewAt ? formatDateTime(item.viewAt) : '',
    duration: item.duration,
    badgeText,
    progressPct,
    durationText,
    actionHTML,
  });
}

function renderHistoryList() {
  const box = document.getElementById('historyList');
  if (!historyList.length) {
    // 失败提示在这里渲染: loadHistory 的 finally 会紧接着再调一次本函数,
    // 在 catch 里写 innerHTML 会被下面的"暂无观看历史"覆盖
    if (historyError) {
      box.innerHTML = `<div class="error-box">${escapeHtml(historyError)}<br>
        <button type="button" class="retry-btn" id="historyRetryBtn">重试</button></div>`;
      const btn = box.querySelector('#historyRetryBtn');
      if (btn) btn.addEventListener('click', () => loadHistory(true));
      return;
    }
    box.innerHTML = historyLoading
      ? `<div class="placeholder">正在加载...</div>`
      : `<div class="placeholder">暂无观看历史</div>`;
    return;
  }
  box.innerHTML = `<div class="grid">${historyList.map(historyCardHTML).join('')}</div>`;
}

async function loadHistory(reset) {
  if (historyLoading) return;
  if (reset) {
    historyList = [];
    historyCursor = { max: 0, view_at: 0, business: '' };
    historyHasMore = true;
    historyError = '';
  }
  if (!historyHasMore) return;

  historyLoading = true;
  renderHistoryList();
  updateHistoryLoadMoreUI();

  try {
    const params = new URLSearchParams({
      max: String(historyCursor.max || 0),
      view_at: String(historyCursor.view_at || 0),
      business: historyCursor.business || '',
    });
    const data = await fetchJson(`/api/account/history?${params.toString()}`);
    if (data.__status === 401) {
      renderNotLoggedIn();
      return;
    }
    if (data.code !== 0) throw new Error(data.message || '获取历史记录失败');

    historyError = '';
    historyList = historyList.concat(data.list || []);
    historyHasMore = !!data.hasMore;
    historyCursor = data.nextCursor || historyCursor;
  } catch (err) {
    // 首页就失败才算整体失败;已拿到数据后翻页失败,保留现有列表并停掉按钮
    if (!historyList.length) historyError = err.message || '加载失败,请稍后重试';
  } finally {
    historyLoading = false;
    renderHistoryList();
    updateHistoryLoadMoreUI();
  }
}

function updateHistoryLoadMoreUI() {
  const row = document.getElementById('historyLoadMoreRow');
  const btn = document.getElementById('historyLoadMoreBtn');
  if (!historyList.length && !historyLoading) {
    row.style.display = 'none';
    return;
  }
  if (!historyHasMore) {
    row.innerHTML = `<span class="load-more-tip">没有更多了</span>`;
    row.style.display = 'block';
    return;
  }
  row.style.display = 'block';
  row.innerHTML = `<button class="load-more-btn" id="historyLoadMoreBtn" ${historyLoading ? 'disabled' : ''}>${historyLoading ? '加载中...' : '加载更多'}</button>`;
  document.getElementById('historyLoadMoreBtn').addEventListener('click', () => loadHistory(false));
}
